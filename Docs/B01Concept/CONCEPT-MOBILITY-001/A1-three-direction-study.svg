<text x="96" y="897" font-size="20" font-weight="bold" fill="#f9cb88">RESEARCH-ONLY DESIGN INPUT FOR B01-10 / B01-30 / B01-23</text>
<text x="96" y="936" font-size="18" fill="#c4dfe2">ONE detachable visual module. Proposed wheel, support arms, shock and provisional attach interface remain distinguishable.</text>
