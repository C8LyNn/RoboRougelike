<!doctype html><html lang="pl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>B01-12 LOCALIZE-001</title>
<style>
:root{color-scheme:dark;--bg:#111827;--surface:#1e293b;--border:#385071;--ink:#f5f9ff;--muted:#bacadd;--accent:#56d4e8;--warn:#f5bd6f}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;margin:0}main{max-width:980px;margin:auto;padding:24px 16px 80px}h1{font-size:clamp(1.3rem,3vw,2rem);margin:0 0 4px}h2{font-size:1.1rem;margin:0 0 12px}.lead{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;min-width:0}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:6px;min-width:135px;flex:1}label{color:var(--muted);font-weight:600}select,input,button{border-radius:8px;border:1px solid #6484a4;background:#122033;color:var(--ink);padding:11px;font:inherit;min-width:0}button{cursor:pointer}button[aria-pressed="true"]{background:#1f566a;border-color:var(--accent)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button:hover{border-color:var(--accent)}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tab{min-width:110px}.panel{min-height:230px}.stat{font-size:1.1rem;margin:12px 0}.warning{border-left:4px solid var(--warn);padding:12px;background:#463521}.muted{color:var(--muted)}.badge{display:inline-block;border:1px solid var(--accent);border-radius:100px;padding:4px 12px;color:#a6ecfb}.audit-line{margin:6px 0;overflow-wrap:anywhere}.snapshot{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace;color:var(--muted)}#notice{min-height:38px;color:#a6ecfb;margin-top:12px}#screen button{max-width:100%;white-space:normal;text-align:left}footer{margin-top:20px;color:var(--muted);font-size:.85rem}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:18px 12px 60px}.card{padding:14px}}
</style></head><body><main><h1 id="title"></h1><p class="lead" id="subtitle"></p><div class="card toolbar"><div class="field"><label for="locale" id="localeLabel"></label><select id="locale"><option value="pl">Polski</option><option value="en">English</option><option value="pseudo">Pseudo [stress]</option></select></div><div class="field"><label for="quantity" id="quantityLabel"></label><input id="quantity" type="number" min="0" max="99" step="1" value="2"/></div><div class="field"><label id="modeLabel" for="refresh"></label><button id="refresh" type="button"></button></div></div>
<div class="grid"><div class="card"><nav class="tabs" aria-label="Screen preview"><button id="garageTab" class="tab" aria-pressed="true" type="button"></button><button id="combatTab" class="tab" aria-pressed="false" type="button"></button></nav><section class="panel" id="screen" aria-live="polite"></section><p id="notice" role="status" aria-live="polite"></p></div><aside class="card"><h2 id="auditTitle"></h2><p class="audit-line" id="auditFormat"></p><p class="audit-line" id="auditLong"></p><p class="audit-line" id="auditOverflow"></p><hr/><div class="snapshot" id="snapshot" aria-label="Read-only state"></div></aside></div><footer>Research only • no Unity integration • no storage/network • input state preserved on locale change</footer></main>
<script src="localize_engine.js"></script><script src="catalog.js"></script><script src="app.js"></script></body></html>
