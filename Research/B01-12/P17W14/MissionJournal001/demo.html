<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B01-12 — Dziennik celów</title>
<style>
:root{color-scheme:dark;--ink:#eaf3ff;--muted:#a9bfd7;--border:#3b536c;--panel:#1a2a3b;--accent:#77d9ee}*{box-sizing:border-box}body{margin:0;background:#0c1420;color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:24px 16px 70px}h1{font-size:clamp(1.45rem,3vw,2.3rem);margin:0 0 8px}p{color:var(--muted)}button,select,textarea{font:inherit;color:var(--ink);background:#25394c;border:1px solid #66809c;border-radius:9px;padding:9px}button{cursor:pointer}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #96eafa;outline-offset:2px}button:disabled{opacity:.48;cursor:not-allowed}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;min-width:0}.list{display:grid;gap:9px}.item{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px;border:1px solid var(--border);border-radius:10px;min-width:0}.item strong{display:block;overflow-wrap:anywhere}.item small{color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:.75rem;border:1px solid #89a7c0;border-radius:8px;padding:2px 6px;white-space:nowrap}.done{color:#b2f5ca}.available{color:#8ce3f3}.locked{color:#ffd09a}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}textarea{display:block;width:100%;min-height:125px;resize:vertical;overflow-wrap:anywhere}#status{min-height:25px;color:#bcf0d6}#progress{height:12px;width:100%;accent-color:var(--accent)}.muted{font-size:.85rem;color:var(--muted)}code{overflow-wrap:anywhere}#selected{overflow-wrap:anywhere}@media(max-width:740px){.layout{grid-template-columns:minmax(0,1fr)}main{padding:18px 12px 48px}.panel{padding:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main>
<h1>Dziennik celów misji</h1><p>Samodzielny prototyp UX. Zależności, ukończenia i przypięcie celu; nie steruje rozgrywką.</p>
<div class="layout"><section class="panel"><h2>Lista zadań</h2><div class="row"><label for="filter">Widok</label><select id="filter"><option value="all">Wszystkie</option><option value="available">Dostępne</option><option value="done">Ukończone</option><option value="locked">Zablokowane</option></select><button id="reset" type="button">Reset misji</button></div><progress id="progress" max="5" value="0"></progress><p id="counter" class="muted"></p><div id="list" class="list" aria-label="Cele misji"></div></section>
<section class="panel"><h2>Wybrany cel</h2><p id="selected">Wybierz cel z listy.</p><p id="dependency" class="muted"></p><h2>Stan i historia</h2><p id="status" role="status" aria-live="polite">Gotowe.</p><div id="history" class="muted"></div><h2>Przenośny stan JSON</h2><div class="row"><button type="button" id="export">Eksportuj</button><button type="button" id="import">Importuj</button></div><label for="json">Profil misji (wersja 1)</label><textarea id="json" spellcheck="false" aria-label="Profil JSON misji"></textarea><p class="muted">Nieprawidłowy stan jest odrzucany atomowo. Żadne dane nie są zapisywane w przeglądarce.</p></section></div>
</main><script src="journal_engine.js"></script><script src="ui.js"></script></body></html>
