name: B01-50 PARTICLELOD-001 original emission policy .NET + fixed GUID source QA
on:
  pull_request:
    paths:
      - 'Tools/B01/B01-50/PARTICLELOD001/**'
      - '.github/workflows/b01-50-particlelod001.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-particle-emission-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compile and run exact CSharp source in .NET 8 with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p particlelod-evidence
          dotnet --version | tee particlelod-evidence/dotnet-sdk.txt
          dotnet run -c Release --project Tools/B01/B01-50/PARTICLELOD001/tests/PARTICLELOD.Tests.csproj -- --receipt particlelod-evidence/original-source-receipt.json 2>&1 | tee particlelod-evidence/original-source-tests.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('particlelod-evidence/original-source-receipt.json').read_text())
          assert d['failed'] == 0 and d['passed'] == d['total'] == 41
          assert d['nativeUnity'] == 'NOT_RUN'
          assert d['actualFPS'] == 'NOT_MEASURED' and d['actualParticleCount'] == 'NOT_MEASURED'
          print('ORIGINAL_CSHARP_41_PASS; NATIVE_UNITY_NOT_RUN')
          PY
      - name: Audit stable Unity script GUIDs for actual collisions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee particlelod-evidence/unity-guid-source-check.log
          from pathlib import Path
          import re
          base=Path('Tools/B01/B01-50/PARTICLELOD001')
          scripts=['Core/OptionalParticleEmissionBudget.cs','Unity/B0150OptionalParticleEmissionLod.cs','Unity/B0150OptionalParticleEmissionDemo.cs']
          guids=set()
          for src in scripts:
              s=base/src
              m=Path(str(s)+'.meta')
              assert s.is_file() and m.is_file(),src
              source=m.read_text()
              assert 'fileFormatVersion: 2' in source and 'MonoImporter:' in source,src
              match=re.search(r'^guid: ([0-9a-f]{32})$',source,re.M)
              assert match,src
              assert match[1] not in guids,'Duplicate source script .meta GUID'
              guids.add(match[1])
          for meta in Path('Assets').rglob('*.meta'):
              text=meta.read_text(encoding='utf-8',errors='replace')
              original=re.search(r'^guid: ([0-9a-f]{32})$',text,re.M)
              assert not original or original[1] not in guids, 'Existing Assets GUID collision '+str(meta)
          print('UNITY_META_SOURCE_GUID_GATE 3/3 PASS; original tracked Assets checked')
          PY
          sha256sum particlelod-evidence/original-source-receipt.json particlelod-evidence/original-source-tests.log particlelod-evidence/unity-guid-source-check.log particlelod-evidence/dotnet-sdk.txt > particlelod-evidence/SHA256SUMS.txt
      - name: Preserve original executed CSharp source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B01-50-PARTICLELOD001-ORIGINAL-SOURCE-GUID-QA
          path: particlelod-evidence/**
          if-no-files-found: error
          retention-days: 30
