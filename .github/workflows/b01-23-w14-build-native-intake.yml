name: B01-23 W14 BUILD R1.4 native intake — source gate only
on:
  push:
    branches:
      - 'b01-23/w14-build001-native-acceptance-profile'
    paths:
      - 'Tools/B01/BUILD001/W14Acceptance/**'
      - '.github/workflows/b01-23-w14-build-native-intake.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-intake-contract:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run 15 BUILD-specific fail-closed intake and evidence-parser selftests
        run: python Tools/B01/BUILD001/W14Acceptance/test_w14_acceptance.py
      - name: Download ACTUAL frozen R1.4 full SOURCE artifact (not a replacement build)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact
          gh run download 40325389893 -n B01-BUILD001-R14-contact-area-source -D artifact -R C8LyNn/RoboRougelike
      - name: Verify immutable producer's ACTUAL inner archive and all original asset hashes
        shell: bash
        run: |
          python -c "import sys;sys.path.insert(0,'Tools/B01/BUILD001/W14Acceptance');import prepare_build_native as p;import verify_build_native as v; assets=p.verify_archive('artifact/B01-BUILD001-R14.zip'); methods=v.verify_real_source_method_inventory(assets);print('W15_REAL_R14_SOURCE_INVENTORY_PASS',len(assets),'asset/meta',methods,'actual CSharp test methods; Unity native NOT_RUN; G2 HOLD')"
      - name: Explicit native limitation
        shell: bash
        run: |
          echo 'BUILD R1.4 Unity6000.3.14f1 native Compile, EditMode, PlayMode, receiver #258 and Windows game remain NOT_RUN in this CI.'
          echo 'No player, no Unity license and no G2 assertion is performed here.'
