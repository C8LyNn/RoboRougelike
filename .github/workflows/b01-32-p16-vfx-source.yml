name: B01-32 P16 original isolated Unity assets source validation (NOT NATIVE)
on:
  push:
    branches:
      - art/b01-32-p16-vfx-demonstrator
    paths:
      - Assets/B0132P16VfxDemo/**
      - Tools/B01-32/P16/**
      - .github/workflows/b01-32-p16-vfx-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-G0:
    name: Unity scene/prefab original source & Roslyn / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse actual original Unity YAML, .meta GUIDs and asmdefs
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
          python Tools/B01-32/P16/verify_unity_assets.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Parse exact CSharp with Roslyn (no Unity API compilation)
        run: dotnet run --configuration Release --project Tools/B01-32/P16/SourceSyntax/SourceSyntax.csproj
      - name: Generate SHA-256 of all actual scene/prefab sources
        run: python Tools/B01-32/P16/build_source_receipt.py build/b01-32-p16
      - name: Upload physical standalone Unity assets and original hashes
        uses: actions/upload-artifact@v4
        with:
          name: B0132-P16-VFX-SOURCE-${{ matrix.os }}
          path: |
            Assets/B0132P16VfxDemo.meta
            Assets/B0132P16VfxDemo/
            build/b01-32-p16/SOURCE_SHA256.json
            build/b01-32-p16/SOURCE_SHA256.txt
          if-no-files-found: error
          retention-days: 30
