name: B01-62 W17 AUTHOR-FROZEN #596 Exclusive Physical G0 Intake
on:
  push:
    branches:
      - qa/b01-62-p17w17-selected596-physical-intake
  pull_request:
    paths:
      - 'Tools/B01/B01-62/P17W17Selected596PhysicalIntake/**'
      - '.github/workflows/b01-62-p17w17-596-physical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-selected-596:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch ONLY author-frozen selected #596 and immutable #510/#556
        run: |
          git fetch --no-tags origin efb2b06eafedab5469b57f163152d96aca3c5915
          git fetch --no-tags origin d94400d95d13db7f27e1533df05c9292d5380431
          git fetch --no-tags origin 33094f154c7b91119b36d58aab285e6e83c5de57
      - name: Run exact selected #596 ORIGINAL physical Git build and safe rollback
        run: |
          set -o pipefail
          mkdir -p qa-b01-62-w17-596
          python Tools/B01/B01-62/P17W17Selected596PhysicalIntake/intake.py --repo . --output qa-b01-62-w17-596/physical-receipt.json | tee qa-b01-62-w17-596/qa.stdout
      - uses: actions/upload-artifact@v4
        with:
          name: b01-62-w17-596-source-${{ matrix.os }}
          path: qa-b01-62-w17-596/*
          if-no-files-found: error
