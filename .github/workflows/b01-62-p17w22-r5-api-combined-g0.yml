name: B01-62 W22 ORIGINAL R5 API V2 Combined Physical Source G0
on:
  push:
    branches: [qa/b01-62-p17w22-r5-api-combined-g0-source-intake]
  pull_request:
    paths:
      - 'Tools/B01/B01-62/P17W22CombinedSourceG0/**'
      - '.github/workflows/b01-62-p17w22-r5-api-combined-g0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-owner-packets-scratch-g0:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch only selected exact original Git source commits
        run: |
          set -euo pipefail
          git fetch --no-tags origin d94400d95d13db7f27e1533df05c9292d5380431 33094f154c7b91119b36d58aab285e6e83c5de57 09c1809b73324a6d31c13e5d0143de62ac1e3ca6 cc7f73541517a18f4479bb155534bd4832d9985e eed2e39636edfd8b8db754c426db452164cbf9d7 809f82575c638e1b4d2806b5f417bddab6c0871a d6ec0c82e388e65c1e02ddfd920bb50a1f6ef121 bd8905ad549a7b26854b671be971f7d781308311
      - name: ACTUALLY build original owner ZIPs, verify Git SHA, independent physical GUID and rollback
        run: |
          set -euo pipefail
          mkdir -p b0162-w22-combined-evidence
          python Tools/B01/B01-62/P17W22CombinedSourceG0/combined_g0.py --repo . --receipt b0162-w22-combined-evidence/combined-g0.json | tee b0162-w22-combined-evidence/tests.log
          grep -q 'B0162_W22_CROSS_OWNER_GUIDS_UNIQUE=38/38' b0162-w22-combined-evidence/tests.log
          grep -q 'B0162_W22_COMBINED_G0=SOURCE_TRANSPORT_PASS_ONLY' b0162-w22-combined-evidence/tests.log
          grep -q 'B0162_W22_REAL_UNITY_G1=NOT_RUN' b0162-w22-combined-evidence/tests.log
      - uses: actions/upload-artifact@v4
        with:
          name: b0162-w22-original-r5-api2-g0-${{ matrix.os }}
          path: b0162-w22-combined-evidence/*
          if-no-files-found: error
