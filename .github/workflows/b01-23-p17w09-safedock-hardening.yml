name: B01-23 W09 actual protected docking core + original Git ZIP tests
on:
  push:
    branches: [b01-23/p17w09-safedock-hardening001]
  pull_request:
    paths:
      - 'Assets/B0123DockHardening001/**'
      - 'Tools/B01/B01-23/P17W09DockHardening001/**'
      - '.github/workflows/b01-23-p17w09-safedock-hardening.yml'
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile actual W09 and original frozen W08 C#9 security gates and execute tests
        run: dotnet run --project Tools/B01/B01-23/P17W09DockHardening001/HardenedSourceTests.csproj --configuration Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actual Git source, unique Unity GUID and original ZIP stage rollback negative QA
        run: python -m unittest discover -s Tools/B01/B01-23/P17W09DockHardening001 -p test_package.py -v
      - name: Generate original deterministic W09 DELTA source physical ZIP
        run: python Tools/B01/B01-23/P17W09DockHardening001/package.py build --archive dist/B0123_W09_DockHardening_Delta.zip
      - uses: actions/upload-artifact@v4
        with:
          name: b01-23-w09-dock-hardening-${{ matrix.os }}
          path: dist/B0123_W09_DockHardening_Delta.zip
          if-no-files-found: error
