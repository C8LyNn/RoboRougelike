name: B01-12 EDGE-PAN-001 original source QA
on:
  pull_request:
    paths:
      - 'Research/B01-12/P17W23/EdgePan001/**'
      - '.github/workflows/b01-12-edge-pan.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Positive exact-source Node and real Chromium
        working-directory: Research/B01-12/P17W23/EdgePan001
        run: |
          node test_engine.cjs
          python test_browser.py
      - name: Negative disposable byte mutation must reject both runners
        run: |
          set -euo pipefail
          cp -a Research/B01-12/P17W23/EdgePan001 "$RUNNER_TEMP/edgepan-negative"
          printf '\n' >> "$RUNNER_TEMP/edgepan-negative/ui.js"
          cd "$RUNNER_TEMP/edgepan-negative"
          set +e
          node test_engine.cjs >node-negative.log 2>&1; n=$?
          python test_browser.py >browser-negative.log 2>&1; b=$?
          set -e
          cat node-negative.log browser-negative.log
          test "$n" -eq 2 && test "$b" -eq 2
          grep -q 'FAIL_CLOSED source mismatch: ui.js' node-negative.log
          grep -q 'FAIL_CLOSED source mismatch: ui.js' browser-negative.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-pan-qa-${{ github.sha }}
          path: |
            Research/B01-12/P17W23/EdgePan001/*results.json
            Research/B01-12/P17W23/EdgePan001/evidence-1280x720.png
          if-no-files-found: ignore
