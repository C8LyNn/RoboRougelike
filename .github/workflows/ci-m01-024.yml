name: M01-024 Blender mechanical-anchor-harpoon QA
on:
  push:
    branches: [feature/rrl-model-m01-024-mechanical-anchor-harpoon]
    paths:
      - 'Tools/ModelFactory/M01/M01-024/*.py'
      - 'Tools/ModelFactory/M01/M01-024/README.md'
      - '.github/workflows/ci-m01-024.yml'
  pull_request:
    types: [opened, synchronize]
    branches: [develop]
    paths:
      - 'Tools/ModelFactory/M01/M01-024/*.py'
      - 'Tools/ModelFactory/M01/M01-024/README.md'
      - '.github/workflows/ci-m01-024.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  blender-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Generate real animated harpoon twice in Blender
        run: |
          blender --background --python-exit-code 1 --python Tools/ModelFactory/M01/M01-024/generate_m01_024.py -- --repeat --out Tools/ModelFactory/M01/M01-024/generated
      - name: Independently validate mesh and Blender exports
        run: |
          python3 Tools/ModelFactory/M01/M01-024/qa_m01_024.py --out Tools/ModelFactory/M01/M01-024/generated --require-blender
      - name: Record digests
        run: |
          cd Tools/ModelFactory/M01/M01-024/generated
          rm -f *.blend1
          sha256sum M01-024_mechanical_anchor_harpoon.* > SHA256SUMS
      - name: Upload actual 3D artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M01-024-mechanical-anchor-harpoon-3D
          path: Tools/ModelFactory/M01/M01-024/generated/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish verified exports to exclusive feature branch
        if: success() && github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f Tools/ModelFactory/M01/M01-024/generated/*
          if ! git diff --cached --quiet; then
            git commit -m 'MODEL-01 M01-024: verified Blender 3D exports'
            git fetch origin feature/rrl-model-m01-024-mechanical-anchor-harpoon
            git rebase origin/feature/rrl-model-m01-024-mechanical-anchor-harpoon
            git push origin HEAD:feature/rrl-model-m01-024-mechanical-anchor-harpoon || echo '::warning::Push blocked; workflow artifacts retained'
          fi