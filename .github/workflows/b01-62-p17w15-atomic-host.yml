name: B01-62 P17 W15 Exact #556 #510 Atomic Host Port Source QA
on:
  push:
    branches:
      - qa/b01-62-p17w15-atomic-host-bridge
  pull_request:
    paths:
      - 'Tools/B01/B01-62/P17W15AtomicHostBridge/**'
      - '.github/workflows/b01-62-p17w15-atomic-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fetch ONLY immutably frozen selected Save #556 and game #510
        run: |
          git fetch --no-tags origin 33094f154c7b91119b36d58aab285e6e83c5de57
          git fetch --no-tags origin d94400d95d13db7f27e1533df05c9292d5380431
      - name: Verify original source bytes and isolate inputs
        run: |
          mkdir -p b01-62-w15-receipts
          python Tools/B01/B01-62/P17W15AtomicHostBridge/source_guard.py --repo . --out Tools/B01/B01-62/P17W15AtomicHostBridge/Input --receipt b01-62-w15-receipts/source.json
      - name: Execute ACTUAL #556 Save schema + ACTUAL #510 R2 ledger + W06 against bridge
        run: |
          dotnet run --project Tools/B01/B01-62/P17W15AtomicHostBridge/OriginalHostBridgeQA.csproj --configuration Release --verbosity quiet | tee b01-62-w15-receipts/qa.stdout
      - uses: actions/upload-artifact@v4
        with:
          name: b01-62-w15-original-host-port-${{ matrix.os }}
          path: b01-62-w15-receipts/*
          if-no-files-found: error
