name: M02-003 Balloon Sand Wheel QA
on:
  push:
    branches: ["feature/rrl-model-m02-003-balloon-sand-wheel"]
    paths:
      - "Tools/ModelFactory/M02/M02-003/**"
      - ".github/workflows/model-m02-003-qa.yml"
  pull_request:
    branches: [develop]
    paths:
      - "Tools/ModelFactory/M02/M02-003/**"
      - ".github/workflows/model-m02-003-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheel-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python syntax and mesh topology self-test
        run: |
          python3 -m py_compile Tools/ModelFactory/M02/M02-003/generate_m02_003.py
          python3 Tools/ModelFactory/M02/M02-003/generate_m02_003.py --self-test
      - name: Generate real Unity-compatible OBJ and MTL
        run: |
          python3 Tools/ModelFactory/M02/M02-003/generate_m02_003.py --out build/M02-003
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path("build/M02-003")
          report=json.loads((base/"M02-003_manifest.json").read_text())
          assert report["id"]=="M02-003" and report["qa"]=="PASS",report
          assert report["parts"]==47 and report["materials"]==7,report
          assert report["spokes"]==20 and report["bolts"]==20,report
          assert report["axle_bore_diameter_m"]==.09,report
          assert report["shaft_radial_clearance_m"]==.011,report
          assert report["blender"].startswith("NOT RUN"),report
          obj=base/"M02-003_balloon_sand_wheel.obj"
          mtl=base/"M02-003_balloon_sand_wheel.mtl"
          rows=obj.read_text().splitlines()
          verts=[r for r in rows if r.startswith("v ")]
          faces=[r for r in rows if r.startswith("f ")]
          names=[r for r in rows if r.startswith("o ")]
          assert len(verts)==report["vertices"]
          assert len(faces)==report["triangles"]
          assert len(names)==report["parts"]
          for face in faces:
              ids=list(map(int,face.split()[1:]))
              assert len(ids)==3 and len(set(ids))==3
              assert all(1<=i<=len(verts) for i in ids)
          assert len([r for r in mtl.read_text().splitlines() if r.startswith("newmtl ")])==7
          print("PASS OBJ",len(verts),"vertices",len(faces),"triangles",len(names),"parts")
          PY
      - name: Deterministic repeat generation
        run: |
          python3 Tools/ModelFactory/M02/M02-003/generate_m02_003.py --out build/M02-003-second
          cmp build/M02-003/M02-003_balloon_sand_wheel.obj build/M02-003-second/M02-003_balloon_sand_wheel.obj
          cmp build/M02-003/M02-003_balloon_sand_wheel.mtl build/M02-003-second/M02-003_balloon_sand_wheel.mtl
      - name: Upload verified OBJ MTL and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: M02-003-balloon-sand-wheel-OBJ-MTL
          path: |
            build/M02-003/M02-003_balloon_sand_wheel.obj
            build/M02-003/M02-003_balloon_sand_wheel.mtl
            build/M02-003/M02-003_manifest.json
          if-no-files-found: error
