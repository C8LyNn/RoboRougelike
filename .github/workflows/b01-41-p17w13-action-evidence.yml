name: B01-41 P17 W13 original GitHub Actions native-vs-source evidence gate
on:
  push:
    branches: ['ci/b01-41-p17w13-action-evidence']
    paths:
      - 'Tools/B01/CI41/P17W13/**'
      - '.github/workflows/b01-41-p17w13-action-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  provenance:
    name: Exact original #510 #532 CI-02 CI-03 evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify own exact source and 35-case real API-mutation test blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Tools/B01/CI41/P17W13/action_evidence.py)" = '2771675b4d327ba71163f34016987398ceb2e68f'
          test "$(git hash-object Tools/B01/CI41/P17W13/test_action_evidence.py)" = 'de5e7a9396172a946c01bb53850ad259fc881b28'
          echo 'REAL_ACTIONS_ATTESTOR_SOURCE_PINS_PASS'
      - name: Fetch original immutable real GitHub API run and all jobs metadata
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then PY=python; else PY=python3; fi
          mkdir -p 'Tools/B01/CI41/P17W13/receipts'
          for CASE in selected-510-source native-532-readiness blocked-edit-522 blocked-play-522; do
            "$PY" 'Tools/B01/CI41/P17W13/action_evidence.py' --case "$CASE" --capture-out "Tools/B01/CI41/P17W13/receipts/original-$CASE.json" --out "Tools/B01/CI41/P17W13/receipts/result-$CASE.json"
          done
          echo 'FOUR_ORIGINAL_PINNED_GITHUB_RUNS_CAPTURED_AND_CLASSIFIED'
      - name: Run 35 real GitHub run/job/step negative evidence mutation checks
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then PY=python; else PY=python3; fi
          "$PY" -m unittest discover -s 'Tools/B01/CI41/P17W13/' -p test_action_evidence.py -v 2>&1 | tee "Tools/B01/CI41/P17W13/tests-${{ runner.os }}.txt"
          grep -q 'Ran 35 tests' "Tools/B01/CI41/P17W13/tests-${{ runner.os }}.txt"
          grep -q 'ORIGINAL_532_ZIP_PASS_NATIVE_NOT_RUN_SAVELOAD_HOLD' "Tools/B01/CI41/P17W13/tests-${{ runner.os }}.txt"
          grep -q 'ORIGINAL_SELECTED_510_SOURCE_SUCCESS_NATIVE_G1_NOT_RUN' "Tools/B01/CI41/P17W13/tests-${{ runner.os }}.txt"
      - name: Prevent fabricated Native G1 or accepted SaveLoad in source-only receipts
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then PY=python; else PY=python3; fi
          "$PY" -c 'import json,pathlib; p=pathlib.Path("Tools/B01/CI41/P17W13/receipts"); docs=[json.loads(x.read_text()) for x in p.glob("result-*.json")]; assert len(docs)==4 and {d["classification"] for d in docs}=={"SOURCE_ONLY_EXECUTED","NATIVE_BLOCKED_ACTIVATION"}; assert all(d["github_run_evidence"]=="VALIDATED" and d["native_unity_g1"]=="NOT_RUN" and d["release_gate"]=="HOLD" and d["codex_ack"]=="NOT_ESTABLISHED" and d["save_load_persistence"]=="HOLD_UNTIL_INDEPENDENT_ADAPTER_ACCEPTANCE" for d in docs); print("ALL_FOUR_ORIGINAL_RUNS_NATIVE_NOT_RUN_AND_SAVELOAD_HOLD")'
      - name: Upload original source only run metadata and fail closed receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CI41-W13-ACTIONS-EVIDENCE-${{ runner.os }}
          path: |
            Tools/B01/CI41/P17W13/receipts/*.json
            Tools/B01/CI41/P17W13/tests-${{ runner.os }}.txt
          retention-days: 14
          if-no-files-found: warn
