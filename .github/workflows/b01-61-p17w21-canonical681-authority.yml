name: B01-61 W21 exact original canonical 681 cross process owner authority QA
on:
  push:
    branches: [qa/b01-61-p17w21-canonical681-exclusive-authority]
  pull_request:
    paths:
      - 'Tools/B01/B01-61/P17W21Canonical681AuthorityQA/**'
      - '.github/workflows/b01-61-p17w21-canonical681-authority.yml'
permissions:
  contents: read
jobs:
  original-681-owner-authority:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Compile unchanged owner #681 CanonicalWorldGateway plus frozen original binary W06
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Tools/B01/B01-61/P17W21Canonical681AuthorityQA/Canonical681AuthorityQA.csproj -c Release --nologo 2>&1 | tee build.log
      - name: Independent original source real filesystem and CHILD CLR owner concurrency
        shell: bash
        run: |
          set -euo pipefail
          set +e
          dotnet Tools/B01/B01-61/P17W21Canonical681AuthorityQA/bin/Release/net8.0/Canonical681AuthorityQA.dll --release | tee qa_release.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "ACTUAL_681_SOURCE_RELEASE_EXIT=${rc}"
          if [[ "${rc}" -ne 3 ]]; then echo "MISSING_EXPECTED_RED_OR_FAULTY_TESTS"; exit 1; fi
          grep -Fx 'TOTAL 10 PASS 10 FAIL 0' qa_release.log
          grep -Fx 'SOURCE_RELEASE_GATE=HOLD_UNFENCED_MULTI_OWNER_681' qa_release.log
      - name: Exact original Git SHA owner, 5 QA paths, cross-process source witness receipt
        shell: bash
        run: |
          set -euo pipefail
          python Tools/B01/B01-61/P17W21Canonical681AuthorityQA/receipt.py --log qa_release.log --out dist/b01-61-w21-original-681-source.json
      - name: Original source stdout and SHA256 JSON evidence (no native Unity claims)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-61-w21-canonical681-original-${{ matrix.os }}
          path: |
            build.log
            qa_release.log
            dist/b01-61-w21-original-681-source.json
          if-no-files-found: warn
