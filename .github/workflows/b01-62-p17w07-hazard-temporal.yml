name: B01-62 independent real HAZARDPULSE original temporal map acceptance
on:
  pull_request:
    paths:
      - 'Tools/B01/B01-62/P17W07HazardTemporalQA/**'
      - '.github/workflows/b01-62-p17w07-hazard-temporal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-temporal-source:
    name: Verify exact owner/source maps and zero-hit time-grid route (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch immutable exact owner #430 and original #359/#346 map objects
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 6095577ece27320b1a861a738cc23ba42d6793a6
          git fetch --no-tags origin ad52a604ffa4f143d98e607049d6f79e0c7e580f
          git fetch --no-tags origin f565e250659692541d672cdab108c4cfb8cfdd31
      - name: Independently execute original-source positive/negative temporal QA
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s Tools/B01/B01-62/P17W07HazardTemporalQA -p test_receiver.py -v \
            2>&1 | tee "$RUNNER_TEMP/temporal-tests.log"
          grep -q "Ran 16 tests" "$RUNNER_TEMP/temporal-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/temporal-tests.log"
      - name: Execute real original map receiver and emit deterministic physical JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Tools/B01/B01-62/P17W07HazardTemporalQA/output
          python Tools/B01/B01-62/P17W07HazardTemporalQA/receiver.py \
            --repo . --out Tools/B01/B01-62/P17W07HazardTemporalQA/output/route.json \
            | tee Tools/B01/B01-62/P17W07HazardTemporalQA/output/run.log
          grep -q "^ORIGINAL_HAZARD_TEMPORAL_RECEIVER=PASS" \
            Tools/B01/B01-62/P17W07HazardTemporalQA/output/run.log
          cp "$RUNNER_TEMP/temporal-tests.log" Tools/B01/B01-62/P17W07HazardTemporalQA/output/tests.log
      - uses: actions/upload-artifact@v4
        with:
          name: b01-62-p17w07-temporal-${{ matrix.os }}
          path: Tools/B01/B01-62/P17W07HazardTemporalQA/output/
          retention-days: 14
          if-no-files-found: error
  source-route-receipt-parity:
    runs-on: ubuntu-24.04
    needs: original-temporal-source
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: b01-62-p17w07-temporal-windows-2025
          path: received/windows
      - uses: actions/download-artifact@v4
        with:
          name: b01-62-p17w07-temporal-ubuntu-24.04
          path: received/linux
      - shell: bash
        run: |
          set -euo pipefail
          cmp received/windows/route.json received/linux/route.json
          sha256sum received/windows/route.json received/linux/route.json
          echo "B01_62_HAZARD_SOURCE_ROUTE_CROSS_OS_BYTE_PARITY=PASS"
