name: Model Factory M03-002 Static Geometry QA

on:
  push:
    branches:
      - fix/rrl-m03-002-wear-liners-isolated-export
    paths:
      - 'Tools/ModelFactory/M03/M03-002/**'
      - '.github/workflows/ci-model-m03-002.yml'
  pull_request:
    paths:
      - "Tools/ModelFactory/M03/M03-002/**"
      - ".github/workflows/ci-model-m03-002.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-procedural-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile and regenerate static geometry
        run: |
          set -euo pipefail
          python3 -m py_compile Tools/ModelFactory/M03/M03-002/generate_m03_002.py
          mkdir -p /tmp/m03-002
          python3 Tools/ModelFactory/M03/M03-002/generate_m03_002.py --self-test --output-dir /tmp/m03-002
      - name: Check deterministic OBJ and material output
        run: |
          set -euo pipefail
          cmp Tools/ModelFactory/M03/M03-002/M03-002.obj /tmp/m03-002/M03-002.obj
          cmp Tools/ModelFactory/M03/M03-002/M03-002.mtl /tmp/m03-002/M03-002.mtl
      - name: Verify 21-step moving clearance
        run: |
          python3 - <<'PY'
          import json
          q=json.load(open('/tmp/m03-002/M03-002.static-qa.json',encoding='utf-8'))
          assert q['static_geometry']=='PASS'
          assert q['collision_samples']==21
          assert q['minimum_overlap_m']>=0.29
          assert len(q['materials'])>=3
          assert q['moving_fixed_aabb_checks']>1000
          assert q['fixed_wear_liners']==8
          assert abs(q['liner_slider_nominal_clearance_m'] - .013)<1e-8
          assert abs(q['liner_wall_anchor_overlap_m'] - .003)<1e-8
          assert q['parts']==77 and q['obj_vertices']==616 and q['obj_quads']==462
          assert q['moving_fixed_aabb_checks']==30240
          assert 'rubber' in q['materials']
          print('M03-002 V2: 8 anchored guide pads, collision/clearance QA PASS')
          PY
      - name: Verify committed geometry and isolated Blender export source
        run: |
          python3 - <<'PY'
          import ast, json
          from pathlib import Path
          root=Path("Tools/ModelFactory/M03/M03-002")
          source=(root/"generate_m03_002.py").read_text("utf-8")
          tree=ast.parse(source)
          assert 'use_selection=True' in source, "glTF exporter must be selection-isolated"
          assert 'prior_selection' in source and 'finally:' in source
          spec=json.loads((root/"M03-002.static-qa.json").read_text("utf-8"))
          obj=(root/"M03-002.obj").read_text("utf-8")
          assert spec["component_count"]==77
          assert spec["fixed_wear_liners"]==8
          assert obj.count("\\no Sleeve_WearLiner_")==8
          assert obj.count("\\nv ")==616
          assert obj.count("\\nf ")==462
          print("M03-002 static OBJ and selected export source QA PASS")
          PY
