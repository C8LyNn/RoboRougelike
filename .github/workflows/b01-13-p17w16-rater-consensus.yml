name: B01-13 W16 Rater Consensus original source
on:
  push:
    paths: ['Research/B01-13/P17N/**', '.github/workflows/b01-13-p17w16-rater-consensus.yml']
  pull_request:
    paths: ['Research/B01-13/P17N/**', '.github/workflows/b01-13-p17w16-rater-consensus.yml']
  workflow_dispatch:
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify new W16 file blobs, sizes and SHA256
        run: python Research/B01-13/P17N/verify_package.py
      - name: Pin frozen W15 source, execute original W16 tests
        shell: pwsh
        run: |
          git fetch --no-tags origin acc2288f72d47bd3969f840524cf8c5d07c0c6d2
          node -e "const fs=require('fs'),cp=require('child_process');fs.writeFileSync('Research/B01-13/P17N/PinnedW15.mjs',cp.execFileSync('git',['show','acc2288f72d47bd3969f840524cf8c5d07c0c6d2:Research/B01-13/P17M/recovery_timeline.mjs']))"
          $actual = (git hash-object -- Research/B01-13/P17N/PinnedW15.mjs).Trim()
          if ($actual -ne '6ec383f0b3e341d58f9b5e971fc435a74d78a583') { throw "ORIGINAL_W15_CHANGED=$actual" }
          Write-Output "W15_EXACT_BLOB_PASS=$actual"
          $env:B01_W15_ORIGINAL_SOURCE = (Resolve-Path Research/B01-13/P17N/PinnedW15.mjs).Path
          node --test Research/B01-13/P17N/test_rater_consensus.mjs
