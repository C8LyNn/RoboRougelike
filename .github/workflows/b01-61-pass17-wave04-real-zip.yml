name: B01-61 W04 independent real original P17 bracing ZIP receiver

on:
  push:
    branches: ['qa/b01-61-pass17-wave03-bracing-cross-acceptance']
  pull_request:
    paths:
      - 'Tools/B01/B01-61-P17-W03/**'
      - '.github/workflows/b01-61-pass17-wave04-real-zip.yml'

permissions:
  contents: read
  actions: read

jobs:
  real-b01-23-original-artifact:
    name: Download B01-23 actual original ZIP / ${{ matrix.source }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [windows, ubuntu]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact original B01-23 authored ZIP source / producer manifest commits
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 5666a39eabd4cea91b2b605a9eb99ea2f1e226e8
          git fetch --no-tags --depth=1 origin 8fc0f99ef7bf6c39c21609616b7e852538d2de12
      - name: Independently DOWNLOAD actual B01-23 GitHub Actions archive and inspect original game asset bytes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python Tools/B01/B01-61-P17-W03/archive_receipt.py --repo . --artifact ${{ matrix.source }} --output real-archive-${{ matrix.source }}.json 2>&1 | tee real-archive-${{ matrix.source }}.log
      - name: Preserve independently executed real-producer-binary original SHA receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b0161-w04-real-producer-zip-${{ matrix.source }}
          path: |
            real-archive-${{ matrix.source }}.json
            real-archive-${{ matrix.source }}.log
          if-no-files-found: warn
