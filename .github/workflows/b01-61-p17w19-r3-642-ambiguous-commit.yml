name: B01-61 W19 selected R3 642 exact SHA missing-ACK release security witness
on:
  push:
    branches: [qa/b01-61-p17w19-r3-642-atomic-ambiguous-commit-security]
  pull_request:
    paths:
      - 'Tools/B01/B01-61/P17W19R3Selected642AmbiguousCommitQA/**'
      - '.github/workflows/b01-61-p17w19-r3-642-ambiguous-commit.yml'
permissions:
  contents: read
jobs:
  selected-r3-original-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Original R3 642 CSharp9 exact producer + frozen 556 W06 510 direct source
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Tools/B01/B01-61/P17W19R3Selected642AmbiguousCommitQA/R3SecurityQA.csproj -c Release --nologo
          set +e
          dotnet Tools/B01/B01-61/P17W19R3Selected642AmbiguousCommitQA/bin/Release/net8.0/R3SecurityQA.dll --release | tee qa_release.log
          status=${PIPESTATUS[0]}
          set -e
          echo "ACTUAL_R3_SECURITY_RELEASE_GATE_EXIT=${status}"
          if [[ "${status}" -ne 3 ]]; then
            echo "MISSING_EXPECTED_RED_OR_FAILED_TEST"
            exit 1
          fi
          grep -Fx 'TOTAL 16 PASS 16 FAIL 0' qa_release.log
          grep -Fx 'SOURCE_RELEASE_GATE=HOLD_P0_RED' qa_release.log
      - name: Fail closed on producer SHA drift/ALT mixing and verify actually executed source logs
        shell: bash
        run: |
          set -euo pipefail
          python Tools/B01/B01-61/P17W19R3Selected642AmbiguousCommitQA/receipt.py --log qa_release.log --out dist/b01-61-p17w19-r3-642-original-source.json
      - name: Upload actual original stdout and SHA256 Git receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-61-p17w19-r3-642-exact-source-${{ matrix.os }}
          path: |
            qa_release.log
            dist/b01-61-p17w19-r3-642-original-source.json
          if-no-files-found: warn
