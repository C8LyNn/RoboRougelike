name: B01-25 W03 original-CSharp MapDraft import acceptance (NOT UNITY)
on:
  push:
    branches: [research/b01-25-p17w03-mapdraft-import-proof]
    paths:
      - 'Research/B01-25/P17/MAPDRAFT-IMPORT-001/**'
      - '.github/workflows/b01-25-w03-mapdraft-import.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-mapdraft-csharp:
    name: Native dotnet 8 original MapDraft source / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    env:
      MAPDRAFT_COMMIT: be2c4b6ac63e04eff5b046e50641ec8d1da4837f
      MAPDRAFT_BLOB: 0331a54a1545ecd1ea18b616ef13fed113474b8c
      CLEARANCE_COMMIT: ad52a604ffa4f143d98e607049d6f79e0c7e580f
      CLEARANCE_BLOB: 53eb696950121465befea2855eda4d7268750016
      SLALOM_COMMIT: f565e250659692541d672cdab108c4cfb8cfdd31
      SLALOM_BLOB: 013f5fe2058e76233f580a439e8402c0fe09f124
      PROOF: Research/B01-25/P17/MAPDRAFT-IMPORT-001
    steps:
      - name: Checkout new receiver without any canonical edits
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prepare actual dotnet 8 native compiler
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fetch exact Codex MapDraft.cs and BOTH published original arenas by immutable commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF/.source"
          git fetch --no-tags origin "$MAPDRAFT_COMMIT" "$CLEARANCE_COMMIT" "$SLALOM_COMMIT"
          git show "${MAPDRAFT_COMMIT}:Assets/MapEditor/MapDraft.cs" > "$PROOF/.source/MapDraft.cs"
          git show "${CLEARANCE_COMMIT}:Research/B01-25/P17/CLEARANCELADDER001/arena.json" > "$PROOF/.source/clearance.json"
          git show "${SLALOM_COMMIT}:Research/B01-25/P17/SLALOM001/arena.json" > "$PROOF/.source/slalom.json"
          test "$(git hash-object "$PROOF/.source/MapDraft.cs")" = "$MAPDRAFT_BLOB"
          test "$(git hash-object "$PROOF/.source/clearance.json")" = "$CLEARANCE_BLOB"
          test "$(git hash-object "$PROOF/.source/slalom.json")" = "$SLALOM_BLOB"
          echo "SOURCE_PINS_PASS: original Codex C# + two immutable B01-25 maps"
          git rev-parse HEAD
      - name: Actually compile and execute original Codex MapDraft C# with minimal NON-UNITY substitutes
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project "$PROOF/MapDraftImportProof.csproj" --configuration Release -- "$PROOF/.source/clearance.json" "$PROOF/.source/slalom.json" "$PROOF/.source/receipt.json" 2>&1 | tee "$PROOF/.source/execution-${RUNNER_OS}.log"
          test -s "$PROOF/.source/receipt.json"
      - name: Preserve original C# execution trace, result receipt and exact SHA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-25-mapdraft-import-${{ matrix.os }}
          path: |
            Research/B01-25/P17/MAPDRAFT-IMPORT-001/.source/receipt.json
            Research/B01-25/P17/MAPDRAFT-IMPORT-001/.source/execution-*.log
          if-no-files-found: warn
          retention-days: 21
