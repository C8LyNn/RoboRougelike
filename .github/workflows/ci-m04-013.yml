name: M04-013 Ringed Water Propeller Asset QA
on:
  push:
    branches: [feature/rrl-model-m04-013-ringed-water-propeller]
    paths:
      - 'Tools/ModelFactory/M04/M04-013/**'
      - '.github/workflows/ci-m04-013.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'Tools/ModelFactory/M04/M04-013/**'
      - '.github/workflows/ci-m04-013.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m04-013-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile and self-test source
        run: |
          python3 -m py_compile Tools/ModelFactory/M04/M04-013/generate_m04_013.py
          python3 Tools/ModelFactory/M04/M04-013/generate_m04_013.py --self-test
      - name: Independent actual OBJ QA and deterministic export
        run: |
          python3 Tools/ModelFactory/M04/M04-013/qa_m04_013.py
          python3 Tools/ModelFactory/M04/M04-013/generate_m04_013.py --out build/M04-013
      - name: Publish actual OBJ MTL and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: M04-013-static-OBJ-MTL-manifest
          path: build/M04-013/
          if-no-files-found: error
          retention-days: 30
  blender-animation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version | head -2
      - name: Run bpy and export actual BLEND GLB FBX
        run: |
          blender -b --factory-startup --python-exit-code 1 --python \
            Tools/ModelFactory/M04/M04-013/generate_m04_013.py -- \
            --out build/M04-013
      - name: Independent GLB animation and geometry QA
        run: |
          python3 Tools/ModelFactory/M04/M04-013/qa_m04_013.py \
            --glb build/M04-013/M04-013_ringed_water_propeller.glb
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/M04-013")
          report=json.loads((p/"M04-013_manifest.json").read_text())
          assert report["backend"]=="Blender bpy"
          assert report["export_blender"].startswith("PASS")
          assert report["unity_import"]=="NOT RUN"
          assert all((p/filename).stat().st_size>1000
              for filename in report["blender_files"])
          print("PASS real Blender exports; Unity NOT RUN")
          PY
      - name: Publish Blender source and animated Unity import candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: M04-013-Blender-animated-GLB-FBX
          path: build/M04-013/
          if-no-files-found: error
          retention-days: 30
