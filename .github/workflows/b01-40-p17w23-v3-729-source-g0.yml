name: B01-40 W23 exact selected V3 #729 R5 #690 original source G0 and one-authority blocker
on:
  push:
    branches: [qa/b01-40-p17w23-v3-729-r5-690-one-authority-g0]
    paths:
      - 'Tools/B01/B01-40/P17W23V3G0/**'
      - '.github/workflows/b01-40-p17w23-v3-729-source-g0.yml'
  pull_request:
    paths:
      - 'Tools/B01/B01-40/P17W23V3G0/**'
      - '.github/workflows/b01-40-p17w23-v3-729-source-g0.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-selected-v3-zip-guid-safe-scratch-one-authority:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          path: own
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          path: v3
          ref: b8ca29c7707cd6b4338d0b9772d74dee676d49d2
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: v2
          ref: 809f82575c638e1b4d2806b5f417bddab6c0871a
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: alt
          ref: 8ea411b49e629c059f16c9f8b59a534c19f660b8
      - uses: actions/checkout@v4
        with:
          path: r5
          ref: cc7f73541517a18f4479bb155534bd4832d9985e
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: r4
          ref: 09c1809b73324a6d31c13e5d0143de62ac1e3ca6
      - uses: actions/checkout@v4
        with:
          path: game
          ref: d94400d95d13db7f27e1533df05c9292d5380431
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: save
          ref: 33094f154c7b91119b36d58aab285e6e83c5de57
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: storage
          ref: d6ec0c82e388e65c1e02ddfd920bb50a1f6ef121
      - uses: actions/checkout@v4
        with:
          path: r2
          ref: bd8905ad549a7b26854b671be971f7d781308311
      - uses: actions/checkout@v4
        with:
          path: safe
          ref: 3b743acc52bb44ae6a50af56ed9aca46d22821a7
      - uses: actions/checkout@v4
        with:
          path: guid
          ref: 547b55560d1a33af182caeaf73f9a9b2d8b1b7fe
      - uses: actions/checkout@v4
        with:
          path: w21
          ref: 3cd990c1fabe7c01d226f40f3b8faa6de59e9819
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently execute exact ORIGINAL selected #729 producer Git ZIP, reject #719 same GUID CSharp and flat manifest collision, stage strict new scratch and HOLD two locks
        shell: bash
        run: |
          set -euo pipefail
          python own/Tools/B01/B01-40/P17W23V3G0/intake.py --v3 v3 --v2 v2 --alt alt --r5 r5 --r4 r4 --game game --save save --storage storage --r2 r2 --safe safe --guid guid --w21 w21 --out evidence | tee b0140-w23-original-v3-source.log
          grep -q 'B0140_W23_V3_729_AUTHOR_ORIGINAL_ZIP' b0140-w23-original-v3-source.log
          grep -q 'B0140_W23_V3_729_ORIGINAL_SAFE_STAGE_ROLLBACK' b0140-w23-original-v3-source.log
          grep -q 'B0140_W23_V3_729_R5_690_UNITY_G0' b0140-w23-original-v3-source.log
          grep -q 'B0140_W23_V3_729_712_669_ONE_OWNER_BLOCKER' b0140-w23-original-v3-source.log
          grep -q 'B0140_W23_EXACT_V3_SOURCE_TRANSPORT_PASS_FORMAL_ONE_LOCK_HOLD_NATIVE_NOT_RUN_NO_MERGE' b0140-w23-original-v3-source.log
          test -s evidence/v3-729-source-g0-and-one-lock-hold.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B01-40-W23-V3-729-ExactSourceG0-OneLockHold-${{ matrix.os }}
          path: |
            evidence/v3-729-source-g0-and-one-lock-hold.json
            b0140-w23-original-v3-source.log
          retention-days: 21
          if-no-files-found: warn
