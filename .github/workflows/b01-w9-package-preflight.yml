name: B01 W9 independent source preflight (NOT Unity)
on:
  push:
    branches: [audit/b01-w9-package-preflight-20261025]
    paths: ["Tools/B01/PackagePreflight/**", ".github/workflows/b01-w9-package-preflight.yml"]
  pull_request:
    paths: ["Tools/B01/PackagePreflight/**", ".github/workflows/b01-w9-package-preflight.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch exact three source baselines and three repaired PR heads
        shell: bash
        run: |
          set -euo pipefail
          for sha in 894d3488dedb69e2b8d89683d750bbdbfedf4e55 d48108f56d3fe0790ad715683e77b2de9219e4b1 d575b79e262ec9b65702608d6b6e28972da0d21c 489676414a3eb45fe70124098e3778a81d0aaff2 6c1aa7c2351a29695e4288dddad2565cdec3682a fd9a3f4dda08eaba56d9f74007bc35dc0809b67e; do
            git fetch --no-tags --depth=20 origin "$sha"
            git cat-file -e "$sha^{commit}"
          done
      - name: Test static scanner on positive and negative control fixtures
        run: python -m unittest discover -s Tools/B01/PackagePreflight -p 'test_*.py' -v
      - name: Execute on actual exact original and revised Git CSharp source trees
        run: python Tools/B01/PackagePreflight/w9_preflight.py
      - name: Build three complete deterministic package ZIPs with per-file SHA256
        run: python Tools/B01/PackagePreflight/pack_sources.py
      - name: Upload source inspection evidence on PASS or FAIL
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9-three-source-repairs-static-evidence
          path: w9-preflight-evidence/
          retention-days: 21
