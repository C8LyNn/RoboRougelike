name: B01-41 PASS17 W14 original physical Save contract archive parity and RED evidence
on:
  push:
    branches: ['ci/b01-41-p17w14-save-archive-parity']
    paths:
      - 'Tools/B01/CI41/P17W14/**'
      - '.github/workflows/b01-41-p17w14-save-archive-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  physical:
    name: Original #544/#549 outer artifact to inner ZIP exact parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enforce immutable original CI41 source and physical ZIP test Git blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Tools/B01/CI41/P17W14/save_artifact_parity.py)" = '4ec4803484b57cbb5342bf8255092453885f50e1'
          test "$(git hash-object Tools/B01/CI41/P17W14/test_save_artifact_parity.py)" = '11a4cda1b6ca1d8c7061630118e08a5cc3d9191a'
          echo 'CI41_W14_EXACT_SOURCE_BLOBS_PASS'
      - name: Run 30 physical original ZIP, manifest, tamper and QA RED controls
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then PY=python; else PY=python3; fi
          "$PY" -m unittest discover -s 'Tools/B01/CI41/P17W14/' -p test_save_artifact_parity.py -v 2>&1 | tee 'Tools/B01/CI41/P17W14/test-output-${{ runner.os }}.txt'
          grep -q 'Ran 30 tests' 'Tools/B01/CI41/P17W14/test-output-${{ runner.os }}.txt'
          grep -q 'PHYSICAL_SNAPSHOT_ZIP_PARITY_WITH_549_SECURITY_RED_RELEASE_HOLD' 'Tools/B01/CI41/P17W14/test-output-${{ runner.os }}.txt'
      - name: Download real immutable producer Windows plus Ubuntu artifacts and original #550 QA RED
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then PY=python; else PY=python3; fi
          "$PY" 'Tools/B01/CI41/P17W14/save_artifact_parity.py' --output 'Tools/B01/CI41/P17W14/real-original-physical-${{ runner.os }}.json'
          "$PY" -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["release_gate"]=="HOLD" and d["native_unity_g1"]=="NOT_RUN" and d["selected_save_contract"]=="NONE_DECIDED_BY_CI41" and d["save_load_host"]=="HOLD"; assert all(x["source_archive_parity"]=="PASS" for x in d["proposals"].values()); assert d["proposals"]["549"]["security_gate"]=="SECURITY_RED_FROM_INDEPENDENT_550" and "RED" in d["independent_550"]; print("ACTUAL_CROSS_OS_BINARY_INNER_ZIP_PARITY_PASS_BUT_SAVE_SECURITY_HOLD")' 'Tools/B01/CI41/P17W14/real-original-physical-${{ runner.os }}.json'
      - name: Upload physical archive fingerprints, independent security RED and raw tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CI41-W14-SAVE-ARCHIVE-PARITY-${{ runner.os }}
          path: |
            Tools/B01/CI41/P17W14/real-original-physical-${{ runner.os }}.json
            Tools/B01/CI41/P17W14/test-output-${{ runner.os }}.txt
          if-no-files-found: warn
          retention-days: 14
