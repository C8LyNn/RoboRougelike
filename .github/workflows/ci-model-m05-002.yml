name: Model Factory M05-002 QA
on:
  push:
    paths:
      - 'Tools/ModelFactory/M05/M05-002/**'
      - '.github/workflows/ci-model-m05-002.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'Tools/ModelFactory/M05/M05-002/**'
      - '.github/workflows/ci-model-m05-002.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Python syntax and procedural geometry
        run: |
          python3 -m py_compile Tools/ModelFactory/M05/M05-002/generate_m05_002.py
          python3 Tools/ModelFactory/M05/M05-002/generate_m05_002.py --self-test
      - name: Regenerate OBJ and compare with checked-in mesh
        run: |
          python3 Tools/ModelFactory/M05/M05-002/generate_m05_002.py --output-dir /tmp/m05-002
          cmp Tools/ModelFactory/M05/M05-002/M05-002.obj /tmp/m05-002/M05-002.obj
          cmp Tools/ModelFactory/M05/M05-002/M05-002.mtl /tmp/m05-002/M05-002.mtl
      - name: Verify mesh file integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Tools/ModelFactory/M05/M05-002/M05-002.obj')
          lines=p.read_text().splitlines()
          v=[line for line in lines if line.startswith('v ')]
          f=[line for line in lines if line.startswith('f ')]
          m=[line for line in lines if line.startswith('usemtl ')]
          assert len(v)==1160,(len(v),'vertices')
          assert len(f)==834,(len(f),'faces')
          assert len(m)==127,(len(m),'parts')
          for line in f:
              for idx in line.split()[1:]:
                  assert 1 <= int(idx) <= len(v)
          print('M05-002 OBJ integrity PASS:',len(v),'vertices,',len(f),'polygons,',len(m),'parts')
          PY
      - name: Validate 45 pose sweep, geometry manifest, and isolated Blender source
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('Tools/ModelFactory/M05/M05-002')
          src=(base/'generate_m05_002.py').read_text()
          manifest=json.loads((base/'M05-002.static-qa.json').read_text())
          spec=json.loads((base/'geometry.json').read_text())
          assert manifest['swept_base_tilt_aabb']=='PASS'
          assert manifest['swept_animation_samples']==45
          assert manifest['swept_checked_pairs']==45*13*114
          assert manifest['hinge_pivot_m']==spec['hinge_pivot']==[0,0.235,0.535]
          assert spec['qa_kinematics']['sample_step_deg']==1
          assert 'bpy.ops.object.delete' not in src
          assert 'bpy.ops.object.select_all(action="SELECT")' not in src
          assert 'use_selection=True' in src
          assert 'bpy.data.libraries.write(' in src
          assert 'for obj in tuple(owned.objects)' in src
          assert manifest['blender_execution']=='NOT_RUN'
          assert manifest['unity_import']=='NOT_RUN'
          print('M05-002 PASS: 45 sweep positions, 66,690 conservative AABB comparisons, collection isolation')
          PY
