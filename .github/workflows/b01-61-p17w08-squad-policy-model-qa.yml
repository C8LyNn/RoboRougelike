name: B01-61 P17 W08 SquadPressure variable-policy model-based QA (Unity NOT_RUN)
on:
  push:
    branches: [qa/b01-61-p17w08-squad-policy-model]
    paths:
      - 'Tools/B01/B01-61/P17W08/SquadPolicyModelQA/**'
      - '.github/workflows/b01-61-p17w08-squad-policy-model-qa.yml'
  pull_request:
    paths:
      - 'Tools/B01/B01-61/P17W08/SquadPolicyModelQA/**'
      - '.github/workflows/b01-61-p17w08-squad-policy-model-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-CSharp9-source-versus-96-policy-models:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact frozen original Git sources and QA-only scope
        shell: bash
        run: python Tools/B01/B01-61/P17W08/SquadPolicyModelQA/source_gate.py
      - name: Compile real original B01-24 and Codex CSharp9 against independent model
        shell: bash
        run: dotnet build Tools/B01/B01-61/P17W08/SquadPolicyModelQA/ModelQA.csproj -c Release --warnaserror
      - name: Execute actual 96-policy reference-model comparisons (Unity native NOT RUN)
        shell: bash
        run: |
          set -o pipefail
          dotnet run --no-build -c Release --project Tools/B01/B01-61/P17W08/SquadPolicyModelQA/ModelQA.csproj 2>&1 | tee squad-policy-model-source-test.txt
      - name: Preserve raw output even if test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-61-squad-policy-model-${{ matrix.os }}
          path: squad-policy-model-source-test.txt
          if-no-files-found: warn
          retention-days: 21
