name: Model Factory M04-002 Static QA

on:
  pull_request:
    branches: [develop]
    paths:
      - 'Tools/ModelFactory/M04/M04-002/**'
      - '.github/workflows/ci-m04-002.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python syntax
        run: python3 -m py_compile Tools/ModelFactory/M04/M04-002/generate_m04_002.py Tools/ModelFactory/M04/M04-002/test_m04_002.py
      - name: Geometry, materials, manifold topology and clearance assertions
        run: python3 Tools/ModelFactory/M04/M04-002/test_m04_002.py
