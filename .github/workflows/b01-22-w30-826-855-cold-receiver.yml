name: B01-22 W30 ORIGINAL #826 physical one-file Save + immutable #855 admission gap
on:
  pull_request:
    paths:
      - 'Tools/B01/ECONW30RECEIVER/**'
      - '.github/workflows/b01-22-w30-826-855-cold-receiver.yml'
  workflow_dispatch:
jobs:
  original-826-one-file-receiver:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fetch immutable EXACT original V7 and W29 admission CSharp file blobs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin b4df10a7ad7e6c758f8331013f6b216b3a3689a3 c9c19665a4f9385e6479f7151097deb797026ade
          mkdir -p Tools/B01/ECONW30RECEIVER/.source
          git show b4df10a7ad7e6c758f8331013f6b216b3a3689a3:Assets/B01Packages/ECONAPPROVED007/Runtime/ApprovedEconomyPolicyV7.cs > Tools/B01/ECONW30RECEIVER/.source/ApprovedEconomyPolicyV7.cs
          git show b4df10a7ad7e6c758f8331013f6b216b3a3689a3:Assets/B01Packages/ECONAPPROVED007/Runtime/CanonicalEconomySectionV7.cs > Tools/B01/ECONW30RECEIVER/.source/CanonicalEconomySectionV7.cs
          git show c9c19665a4f9385e6479f7151097deb797026ade:Assets/B01Packages/ECONADMISSIONW29/Runtime/EconomyV7AdmissionW29.cs > Tools/B01/ECONW30RECEIVER/.source/EconomyV7AdmissionW29.cs
      - name: Compile REAL ORIGINAL producer #826 one-owner full Save and #780+#855 source
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Tools/B01/ECONW30RECEIVER/W30.ReceiverQA.csproj -c Release
      - name: Actual original one-file #826 unsafe Win0-free write and legal transition
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project Tools/B01/ECONW30RECEIVER/W30.ReceiverQA.csproj -c Release --no-build -- --scenario "$RUNNER_TEMP/w30-b01-22" | tee "$RUNNER_TEMP/w30-receiver.log"
          dotnet run --project Tools/B01/ECONW30RECEIVER/W30.ReceiverQA.csproj -c Release --no-build -- --cold "$RUNNER_TEMP/w30-b01-22" | tee -a "$RUNNER_TEMP/w30-receiver.log"
          grep -q 'W30_ORIGINAL_826_INVALID_EPOCH0_FREE_PHYSICAL_WRITE_REPRODUCED' "$RUNNER_TEMP/w30-receiver.log"
          grep -q 'W30_ORIGINAL_826_AUTHORIZED_ZERO_PAID_AND_NEXT_WIN_PHYSICAL_PASS' "$RUNNER_TEMP/w30-receiver.log"
          grep -q 'W30_SOURCE_COLD_PROCESS_PASS' "$RUNNER_TEMP/w30-receiver.log"
      - name: Original selected code SHA, source manifest and contamination proof
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/B01/ECONW30RECEIVER/verify_package.py | tee -a "$RUNNER_TEMP/w30-receiver.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b01-22-w30-original-826-cold-receiver-${{ matrix.os }}
          path: ${{ runner.temp }}/w30-receiver.log
          if-no-files-found: error
