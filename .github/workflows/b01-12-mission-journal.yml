name: B01-12 MISSION-JOURNAL-001 source QA
on:
  pull_request:
    paths:
      - 'Research/B01-12/P17W14/MissionJournal001/**'
      - '.github/workflows/b01-12-mission-journal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Original-source engine and Chromium
        working-directory: Research/B01-12/P17W14/MissionJournal001
        run: |
          node test_engine.cjs
          python test_browser.py
      - name: Expected fail-closed corrupted-source negatives
        working-directory: Research/B01-12/P17W14/MissionJournal001
        run: |
          set -eu
          cp ui.js ui.js.original
          printf ' ' >> ui.js
          if node test_engine.cjs > /tmp/node-negative.log 2>&1; then echo 'NODE BAD: failed open'; exit 1; else grep -q FAIL_CLOSED /tmp/node-negative.log; fi
          if python test_browser.py > /tmp/browser-negative.log 2>&1; then echo 'BROWSER BAD: failed open'; exit 1; else grep -q FAIL_CLOSED /tmp/browser-negative.log; fi
          mv ui.js.original ui.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b01-12-mission-journal-evidence
          path: |
            Research/B01-12/P17W14/MissionJournal001/node-results.json
            Research/B01-12/P17W14/MissionJournal001/browser-results.json
            Research/B01-12/P17W14/MissionJournal001/evidence-1280x720.png
          if-no-files-found: warn
