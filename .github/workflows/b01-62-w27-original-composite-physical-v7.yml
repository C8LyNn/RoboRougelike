name: B01-62 W27 original selected composite physical V7 ABI
on:
  push:
    branches: [qa/b01-62-p17w27-selected-composite-abi-physical-v7-001]
  pull_request:
    paths:
      - 'Tools/B01/B01-62/P17W27CompositeOriginalPhysicalABI/**'
      - '.github/workflows/b01-62-w27-original-composite-physical-v7.yml'
permissions:
  contents: read
jobs:
  original-full-assembly-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pin selected #797, #792, #780 original producer and frozen #729/#556/#510 + provenance
        run: |
          set -euo pipefail
          dir=Tools/B01/B01-62/P17W27CompositeOriginalPhysicalABI
          mkdir -p "$dir/.external" b0162-w27-abi-evidence
          git fetch --no-tags origin 2b7983f0f9e09dd1d56906b379a3f7af7b02f21a 16cb2a7b5158605b15191b6074f9e392e0d1ebd3 b4df10a7ad7e6c758f8331013f6b216b3a3689a3 f5db40bf293fe9582ec7c6fcb3515aeff6fcf937
          test "$(git hash-object Tools/B01/B01-62/P17W25WholeGameEconomyV7/WholeGameEconomySlotV2.cs)" = 38f56d487d0a7ed44766beb0d46d4d294513694a
          test "$(git hash-object Tools/B01/B01-62/P17W25WholeGameEconomyV7/CanonicalWholeGameSessionV2.cs)" = 06a515a992d2ead8f59408a1544f1d6f34863659
          test "$(git hash-object Assets/B0123CanonicalSaveApi001/Core/CanonicalWorldGateway.cs)" = 21733278b6ab0669fccb6d085e0b6cf242792de2
          test "$(git hash-object Assets/B0123CanonicalSaveApi001/Core/CanonicalWorldSlotLease.cs)" = a9331dd620336d8c42165d134dc8a5e05ed51873
          test "$(git hash-object Assets/B0123SecureReattachV2/Runtime/AtomicDockLedger.cs)" = b6a4d04b0c6407c8c84451b4d599d96fe0e4d1a9
          test "$(git hash-object Assets/B0123DetachedSaveContract001/Runtime/DetachedSnapshotContract.cs)" = b52e511c370f5fca56c74029050844dc8cbb7f9a
          git show 16cb2a7b5158605b15191b6074f9e392e0d1ebd3:Assets/B0123CanonicalRigPortW24/Runtime/CanonicalPhysicalRigPortW24.cs > "$dir/.external/CanonicalPhysicalRigPortW24.cs"
          git show 16cb2a7b5158605b15191b6074f9e392e0d1ebd3:Assets/B0123CanonicalRigPortW24/Runtime/CanonicalRigLedgerHydratorW24.cs > "$dir/.external/CanonicalRigLedgerHydratorW24.cs"
          git show 16cb2a7b5158605b15191b6074f9e392e0d1ebd3:Tools/B01/B01-23/P17W25PhysicalRollbackR2/ManagedUnitySourceOnlyShim.cs > "$dir/.external/ManagedUnitySourceOnlyShim.cs"
          git show b4df10a7ad7e6c758f8331013f6b216b3a3689a3:Assets/B01Packages/ECONAPPROVED007/Runtime/ApprovedEconomyPolicyV7.cs > "$dir/.external/ApprovedEconomyPolicyV7.cs"
          git show b4df10a7ad7e6c758f8331013f6b216b3a3689a3:Assets/B01Packages/ECONAPPROVED007/Runtime/CanonicalEconomySectionV7.cs > "$dir/.external/CanonicalEconomySectionV7.cs"
          test "$(git hash-object "$dir/.external/CanonicalPhysicalRigPortW24.cs")" = 7623f698b6e644b8d8247a011b453bf40adc2227
          test "$(git hash-object "$dir/.external/CanonicalRigLedgerHydratorW24.cs")" = eb21cb12605e94d17dc7decdf040c9009ca0aafe
          test "$(git hash-object "$dir/.external/ManagedUnitySourceOnlyShim.cs")" = 53d16eb828772532f81a7af1ed2ed3a712b0e9e4
          test "$(git hash-object "$dir/.external/ApprovedEconomyPolicyV7.cs")" = 53ebce6c07388dc9c8a8ed79b6de4d3ccbee4773
          test "$(git hash-object "$dir/.external/CanonicalEconomySectionV7.cs")" = d8b71de91db36295b6220e9c4baad71eb54455f6
          git cat-file -e 'f5db40bf293fe9582ec7c6fcb3515aeff6fcf937^{commit}'
          echo B0162_W27_ORIGINAL_SELECTED_DEPENDENCY_SOURCE_BLOBS=11_OF_11_PASS | tee b0162-w27-abi-evidence/original-sha.txt
      - name: Compile exact original physical #792 + one V7 whole-game #797 and execute actual OS file / managed Rigidbody source
        run: |
          set -euo pipefail
          dotnet run --project Tools/B01/B01-62/P17W27CompositeOriginalPhysicalABI/OriginalPhysicalGameEconomyV7QA.csproj -c Release --verbosity minimal 2>&1 | tee b0162-w27-abi-evidence/results.txt
          grep -q 'B0162_W27_ORIGINAL_COMPOSITE_PHYSICAL_SOURCE_ABI_TOTAL 2 PASS 2 FAIL 0' b0162-w27-abi-evidence/results.txt
          grep -q 'B0162_W27_UNITY_PHYSX_NATIVE_G1=NOT_RUN' b0162-w27-abi-evidence/results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: b0162-w27-original-physical-v7-${{ matrix.os }}
          path: b0162-w27-abi-evidence/*
          if-no-files-found: error
