name: M02-023 Side Chain Drive Blender QA
on:
  push:
    branches:
      - feature/rrl-model-m02-023-side-chain-drive
  pull_request:
    paths:
      - 'Tools/ModelFactory/M02/M02-023/**'
      - '.github/workflows/ci-m02-023.yml'
  workflow_dispatch:
jobs:
  m02-023-blender-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Independent chain kinematics and SAT
        run: python3 Tools/ModelFactory/M02/M02-023/qa_m02_023.py --math-only
      - name: Install Blender and Python numpy
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Generate BLEND and animated GLB with actual Blender
        run: |
          blender -b -noaudio --python Tools/ModelFactory/M02/M02-023/generate_m02_023.py
          test -s Tools/ModelFactory/M02/M02-023/generated/M02-023.blend
          test -s Tools/ModelFactory/M02/M02-023/generated/M02-023_animated.glb
          test -s Tools/ModelFactory/M02/M02-023/generated/M02-023_qa.json
      - name: Independently validate actual binary GLB
        run: python3 Tools/ModelFactory/M02/M02-023/qa_m02_023.py
      - name: Upload generated 3D files and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M02-023-side-chain-drive-blend-glb-qa
          path: Tools/ModelFactory/M02/M02-023/generated/
          if-no-files-found: warn
