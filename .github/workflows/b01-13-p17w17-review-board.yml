name: B01-13 W17 Offline Review Board source and UI logic
on:
  push:
    paths: ['Research/B01-13/P17O/**', '.github/workflows/b01-13-p17w17-review-board.yml']
  pull_request:
    paths: ['Research/B01-13/P17O/**', '.github/workflows/b01-13-p17w17-review-board.yml']
  workflow_dispatch:
jobs:
  original-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 5 physical original Git blobs/bytes/SHA256
        run: python Research/B01-13/P17O/verify_package.py
      - name: Fetch true original frozen W15 + W16 sources, execute positive/negative UI tests
        shell: pwsh
        run: |
          git fetch --no-tags origin acc2288f72d47bd3969f840524cf8c5d07c0c6d2
          git fetch --no-tags origin 3f83937874c69cb8744247cb51606dcb2fa0fd91
          node -e "const fs=require('fs'),cp=require('child_process');for(const item of [['acc2288f72d47bd3969f840524cf8c5d07c0c6d2','P17M/recovery_timeline.mjs','PinnedW15.mjs'],['3f83937874c69cb8744247cb51606dcb2fa0fd91','P17N/rater_consensus.mjs','PinnedW16.mjs']])fs.writeFileSync('Research/B01-13/P17O/'+item[2],cp.execFileSync('git',['show',item[0]+':Research/B01-13/'+item[1]]))"
          $w15=(git hash-object -- Research/B01-13/P17O/PinnedW15.mjs).Trim()
          $w16=(git hash-object -- Research/B01-13/P17O/PinnedW16.mjs).Trim()
          if ($w15 -ne '6ec383f0b3e341d58f9b5e971fc435a74d78a583' -or $w16 -ne '56d158bb6c107a04fc42e7ee78d6a07317997729') { throw "UPSTREAM_PIN_FAIL W15=$w15 W16=$w16" }
          Write-Output "ORIGINAL_UPSTREAM_PASS W15=$w15 W16=$w16"
          $env:B01_W15_ORIGINAL_SOURCE=(Resolve-Path Research/B01-13/P17O/PinnedW15.mjs).Path
          $env:B01_W16_ORIGINAL_SOURCE=(Resolve-Path Research/B01-13/P17O/PinnedW16.mjs).Path
          node --test Research/B01-13/P17O/test_review_board.mjs
