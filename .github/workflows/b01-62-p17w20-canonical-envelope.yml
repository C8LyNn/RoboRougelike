name: B01-62 W20 canonical versioned single-record crash-consistent Save+checkpoint source QA
on:
  push:
    branches: [feature/b01-62-p17w20-canonical-atomic-envelope-v1]
  pull_request:
    paths:
      - 'Tools/B01/B01-62/P17W20CanonicalEnvelope001/**'
      - '.github/workflows/b01-62-p17w20-canonical-envelope.yml'
permissions:
  contents: read
jobs:
  real-disk-envelope:
    runs-on: ${{ matrix.os }}
    name: Exact frozen #556 Save and real OS atomic envelope fault/recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fetch EXACT frozen original #556 W06 #510 blob dependencies, never #652/#644/#604
        shell: bash
        run: |
          set -euo pipefail
          dir="Tools/B01/B01-62/P17W20CanonicalEnvelope001"
          mkdir -p "$dir/.source" "$dir/.output"
          git fetch --no-tags origin 33094f154c7b91119b36d58aab285e6e83c5de57 d94400d95d13db7f27e1533df05c9292d5380431 09c1809b73324a6d31c13e5d0143de62ac1e3ca6
          git show 33094f154c7b91119b36d58aab285e6e83c5de57:Assets/B0123DetachedSaveContract001/Runtime/DetachedSnapshotContract.cs > "$dir/.source/DetachedSnapshotContract.cs"
          git show d94400d95d13db7f27e1533df05c9292d5380431:Assets/B0123DebrisRepulse001/Runtime/DebrisImpulseCore.cs > "$dir/.source/DebrisImpulseCore.cs"
          git show d94400d95d13db7f27e1533df05c9292d5380431:Assets/B0123SecureReattachV2/Runtime/SecureRigSpec.cs > "$dir/.source/SecureRigSpec.cs"
          test "$(git hash-object "$dir/.source/DetachedSnapshotContract.cs")" = b52e511c370f5fca56c74029050844dc8cbb7f9a
          test "$(git hash-object "$dir/.source/DebrisImpulseCore.cs")" = fa1aa5e531927cbe73cf5fdfe161b4a981316db5
          test "$(git hash-object "$dir/.source/SecureRigSpec.cs")" = b680ed0ec969ac23203fa55eab7b90f8daa86e43
          echo B0162_W20_PINNED_ORIGINAL_556_W06_510_AND_SOLE_R4_647 | tee "$dir/.output/source-pins.log"
      - name: Actually compile/run original source linked 42 physical disk, full #556 and child process tests
        shell: bash
        run: |
          set -euo pipefail
          dir="Tools/B01/B01-62/P17W20CanonicalEnvelope001"
          dotnet run --project "$dir/AtomicEnvelopeTests.csproj" -c Release --verbosity minimal 2>&1 | tee "$dir/.output/w20-executed-source.log"
          grep -q 'B0162_W20_CANONICAL_ENVELOPE_TOTAL 42 PASS 42 FAIL 0' "$dir/.output/w20-executed-source.log"
          grep -q 'B0162_W20_SOURCE_ONLY_TRUE_556_W06_510_NO_NATIVE_UNITY_G1_NOT_RUN' "$dir/.output/w20-executed-source.log"
      - uses: actions/upload-artifact@v4
        with:
          name: b0162-w20-canonical-envelope-${{ matrix.os }}
          path: Tools/B01/B01-62/P17W20CanonicalEnvelope001/.output/
          if-no-files-found: error
