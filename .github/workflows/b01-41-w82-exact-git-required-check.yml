name: B01-41 PASS16 exact Git native-scope evidence gate (NO UNITY)
on:
  push:
    branches: ['audit/b01-41-w58-pass11-ci-evidence']
    paths:
      - 'Tools/B01/CI41/W82/**'
      - '.github/workflows/b01-41-w82-exact-git-required-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove-original-git-native-scope:
    name: Original Git scope negative (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin original QA code blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Tools/B01/CI41/W82/git_verified_required_gate.py)" = '17d40a3234696670b71a0821cf08fcfba3e3e45e'
          test "$(git hash-object Tools/B01/CI41/W82/test_git_verified_required_gate.py)" = '707f2942fa55461e37120f32b5107d3d87864581'
          test "$(git rev-parse 6fa53271bd8a2fec81cf0aab94556c8c53cfbf0f:Tools/B01/CI41/W78/required_aggregate.py)" = '42ea9a2dbd82a96232a761c32a3c1097f14dc716'
          echo 'QA_FIX_AND_ORIGINAL_PRE_FIX_SOURCE_GIT_BLOBS_PINNED'
      - name: Fetch actual original Codex game commit lineage without writing gameplay
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=80 origin '+refs/pull/310/head:refs/remotes/origin/ci41-pass16-codex'
          git cat-file -e '231005c6d0351945a8ee6684f3856af118f0e94f^{commit}'
          git cat-file -e 'a2ccd055070a963805cba0779b79f18489f4794f^{commit}'
          test "$(git diff --no-renames --name-only 231005c6d0351945a8ee6684f3856af118f0e94f a2ccd055070a963805cba0779b79f18489f4794f -- | grep -c '^Assets/')" -gt 4
          echo 'EXACT_ORIGINAL_CODEX_GAME_SHA_DIFF_FETCHED; UNITY_TESTS_NOT_STARTED'
      - name: Real original immutable source negative to repaired fail-closed on both OS
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = 'Windows' ]; then PY=python; else PY=python3; fi
          "$PY" -m unittest discover -s Tools/B01/CI41/W82 -p test_git_verified_required_gate.py -v 2>&1 | tee "Tools/B01/CI41/W82/source-git-${RUNNER_OS}.txt"
          grep -q 'ORIGINAL_PRIOR_W78_FORGED_QA_PATHS_ON_CODEX_GAME_ACCEPTED_RED' "Tools/B01/CI41/W82/source-git-${RUNNER_OS}.txt"
          grep -q 'ACTUAL_CODEX_ASSETS_OLD_TO_NEW_SHA=NATIVE_REQUIRED_BLOCKING_GREEN_FIXED' "Tools/B01/CI41/W82/source-git-${RUNNER_OS}.txt"
          grep -q 'FORGED_QA_ONLY_CHANGED_PATHS=REJECTED_FAIL_CLOSED' "Tools/B01/CI41/W82/source-git-${RUNNER_OS}.txt"
          echo 'P16_ORIGINAL_GIT_SCOPE_GUARD_PASS; NATIVE_UNITY=NOT_RUN'
      - name: Upload sanitized original Git decision evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: B01-41-P16-GITSCOPE-${{ matrix.os }}-${{ github.run_id }}
          path: Tools/B01/CI41/W82/source-git-${{ runner.os }}.txt
          if-no-files-found: warn
          retention-days: 14
