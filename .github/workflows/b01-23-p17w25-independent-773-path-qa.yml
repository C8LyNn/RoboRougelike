name: B01-23 W25 independent original 773 canonical path QA
on:
  push:
    branches: [b01-23/p17w25-independent-773-path-qa-r1]
  pull_request:
    paths:
      - 'Tools/B01/B01-23/P17W25Independent773PathQA001/**'
      - '.github/workflows/b01-23-p17w25-independent-773-path-qa.yml'
jobs:
  original-773-qa:
    strategy:
      fail-fast: false
      matrix: {os: [windows-2025, ubuntu-24.04]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - run: dotnet run --project Tools/B01/B01-23/P17W25Independent773PathQA001/Independent773PathQA.csproj -c Release
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m unittest discover -s Tools/B01/B01-23/P17W25Independent773PathQA001 -p test_provenance.py -v
