name: Model Factory M03-004 — X Frame Geometry and Blender Export

on:
  push:
    branches:
      - feature/rrl-model-m03-004-reinforced-x-frame
    paths:
      - "Tools/ModelFactory/M03/M03-004/**"
      - ".github/workflows/ci-model-m03-004.yml"
  pull_request:
    paths:
      - "Tools/ModelFactory/M03/M03-004/**"
      - ".github/workflows/ci-model-m03-004.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile and regenerate 3D OBJ/MTL
        run: |
          set -euo pipefail
          python3 -m py_compile Tools/ModelFactory/M03/M03-004/generate_m03_004.py
          mkdir -p /tmp/m03-004
          python3 Tools/ModelFactory/M03/M03-004/generate_m03_004.py --self-test --output-dir /tmp/m03-004
          cmp Tools/ModelFactory/M03/M03-004/M03-004.obj /tmp/m03-004/M03-004.obj
          cmp Tools/ModelFactory/M03/M03-004/M03-004.mtl /tmp/m03-004/M03-004.mtl
      - name: Verify 6 SNAP ports, 32 closed parts, winding and QA manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path("Tools/ModelFactory/M03/M03-004")
          fresh=json.loads(Path("/tmp/m03-004/M03-004.static-qa.json").read_text())
          committed=json.loads((base/"M03-004.static-qa.json").read_text())
          assert fresh==committed, "Committed QA manifest differs from actual source"
          assert fresh["result"]=="STATIC_GEOMETRY_PASS"
          assert fresh["parts"]==32 and fresh["vertices"]==256
          assert fresh["quads"]==192 and fresh["triangles"]==384
          assert len(fresh["snap_ports"])==6
          assert len(fresh["materials_used"])==4
          assert fresh["bounds_xyz_m"]==[[-.5,.5],[0,1],[-.5,.5]]
          assert fresh["animation"]=="NONE_REQUIRED"
          lines=(base/"M03-004.obj").read_text().splitlines()
          assert sum(s.startswith("o ") for s in lines)==32
          assert sum(s.startswith("v ") for s in lines)==256
          assert sum(s.startswith("f ") for s in lines)==192
          print("M03-004 deterministic OBJ/MTL, normals and ports PASS")
          PY

  blender-export:
    runs-on: ubuntu-latest
    needs: deterministic-geometry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Blender from Ubuntu repositories
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
          blender --version
      - name: Execute actual bpy source and export GLB + editable blend
        run: |
          set -euo pipefail
          mkdir -p /tmp/m03-004-blender
          blender --background --factory-startup --python Tools/ModelFactory/M03/M03-004/generate_m03_004.py -- --output-dir /tmp/m03-004-blender --require-blender
      - name: Inspect binary GLB header and selected asset nodes
        run: |
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          root=Path("/tmp/m03-004-blender")
          glb=root/"M03-004.glb"
          blend=root/"M03-004.blend"
          assert glb.exists() and glb.stat().st_size>4096
          assert blend.exists() and blend.stat().st_size>4096
          data=glb.read_bytes()
          magic,version,total=struct.unpack_from("<4sII",data)
          assert (magic,version,total)==(b"glTF",2,len(data))
          chunk_length,chunk_type=struct.unpack_from("<I4s",data,12)
          assert chunk_type==b"JSON"
          doc=json.loads(data[20:20+chunk_length])
          nodes=doc["nodes"]
          meshes=[node for node in nodes if "mesh" in node]
          assert len(meshes)==32, len(meshes)
          assert len(doc["materials"])==4
          assert all(n.get("name","").startswith("M03-004_") for n in nodes), nodes
          print("M03-004 real Blender GLB export PASS:",len(meshes),"meshes,",len(doc["materials"]),"materials")
          PY
      - name: Upload actual Blender and GLB outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: M03-004-Blender-GLB
          path: |
            /tmp/m03-004-blender/M03-004.blend
            /tmp/m03-004-blender/M03-004.glb
            /tmp/m03-004-blender/M03-004.static-qa.json
          if-no-files-found: error
