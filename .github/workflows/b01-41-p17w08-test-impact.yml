name: B01-41 P17W08 real Git Unity test-impact routing (source-only)
on:
  push:
    branches: ['ci/b01-41-p17w08-test-impact-plan']
    paths:
      - 'Tools/B01/CI41/P17W08/**'
      - '.github/workflows/b01-41-p17w08-test-impact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  impact:
    name: Physical Git diff fixture tests + actual Unity test inventory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Pin executable Git-object tool and regression test blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Tools/B01/CI41/P17W08/test_impact_plan.py)" = 'cf2c871a65f63b48700731963127c4fa4fb50c95'
          test "$(git hash-object Tools/B01/CI41/P17W08/test_test_impact_plan.py)" = '740f731ea3d18e53c252cdb5cf434360069b592e'
          echo 'ORIGINAL_SOURCE_AND_TEST_BLOB_PINS_PASS'
      - name: Execute 24 physical Git diff/rename/CLI/test-routing regression cases
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          "$PY" -m unittest discover -s Tools/B01/CI41/P17W08 -p test_test_impact_plan.py -v 2>&1 | tee "Tools/B01/CI41/P17W08/test-results-${RUNNER_OS}.txt"
          grep -q 'ACTUAL_PHYSICAL_GIT_ONE_MODULE_SELECTS_TWO_TEST_ASSEMBLIES_NOT_G1' "Tools/B01/CI41/P17W08/test-results-${RUNNER_OS}.txt"
          grep -q 'ACTUAL_CLI_PHYSICAL_GIT_DIFF_TARGETED_TWO_ASSEMBLIES_PASS' "Tools/B01/CI41/P17W08/test-results-${RUNNER_OS}.txt"
          grep -q 'ACTUAL_CLI_INVENTORY_DRIFT_EXIT2' "Tools/B01/CI41/P17W08/test-results-${RUNNER_OS}.txt"
      - name: Run immutable source scan of 9 actual MOV Unity modules and 62 original test files
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          SHA="$(git rev-parse HEAD)"
          "$PY" Tools/B01/CI41/P17W08/test_impact_plan.py --repo . --head-sha "$SHA" --inventory-only --expect-module-count 9 --out "Tools/B01/CI41/P17W08/real-inventory-${RUNNER_OS}.json" > "Tools/B01/CI41/P17W08/real-inventory-stdout-${RUNNER_OS}.txt"
          "$PY" -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["mode"]=="REAL_GAME_TEST_INVENTORY" and d["module_count"]==9 and d["module_test_file_count"]==29 and d["central_editor_test_file_count"]==33 and d["native_unity"]=="NOT_RUN" and d["game_g1"]=="NOT_ASSESSED"; print("ORIGINAL_REPO_NINE_REAL_MODULES_29_MODULE_TESTS_33_CENTRAL_TESTS_SOURCE_INVENTORY_PASS")' "Tools/B01/CI41/P17W08/real-inventory-${RUNNER_OS}.json"
      - name: Upload source-only real Git regression and source-inventory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CI41-TESTIMPACT-ORIGINAL-${{ matrix.os }}
          path: |
            Tools/B01/CI41/P17W08/test-results-${{ runner.os }}.txt
            Tools/B01/CI41/P17W08/real-inventory-${{ runner.os }}.json
            Tools/B01/CI41/P17W08/real-inventory-stdout-${{ runner.os }}.txt
          retention-days: 14
          if-no-files-found: warn
