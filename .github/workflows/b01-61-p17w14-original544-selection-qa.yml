name: B01-61 W14 original #544 direct source security selection QA (Unity native NOT_RUN)
on:
  push:
    branches: [qa/b01-61-p17w14-save-candidate544-guard]
    paths:
      - 'Tools/B01/B01-61/P17W14Candidate544QA/**'
      - '.github/workflows/b01-61-p17w14-original544-selection-qa.yml'
  pull_request:
    paths:
      - 'Tools/B01/B01-61/P17W14Candidate544QA/**'
      - '.github/workflows/b01-61-p17w14-original544-selection-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-544-unsafe-publication-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pin exact original #544 blob and materialize real W06/R2 original Git source
        shell: bash
        run: |
          set -o pipefail
          python Tools/B01/B01-61/P17W14Candidate544QA/source_guard.py 2>&1 | tee b01-61-w14-pin.log
      - name: Strictly compile actual original #544 + frozen original R2 and W06 (no Unity stub)
        shell: bash
        run: |
          set -o pipefail
          dotnet build Tools/B01/B01-61/P17W14Candidate544QA/Original544SecurityQA.csproj -c Release --warnaserror 2>&1 | tee b01-61-w14-compile.log
      - name: Execute source Save/Cold Restore hostile post-publish mutation and R2 transaction QA
        shell: bash
        run: |
          set -o pipefail
          dotnet run --no-build -c Release --project Tools/B01/B01-61/P17W14Candidate544QA/Original544SecurityQA.csproj 2>&1 | tee b01-61-w14-real-witness.log
          grep -q 'CANDIDATE_544_SOURCE_RELEASE_GATE_RED' b01-61-w14-real-witness.log
          grep -q 'UNITY_NATIVE=NOT_RUN' b01-61-w14-real-witness.log
      - name: Preserve unmodified original-source execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-61-w14-candidate544-${{ matrix.os }}
          path: |
            b01-61-w14-pin.log
            b01-61-w14-compile.log
            b01-61-w14-real-witness.log
          if-no-files-found: warn
          retention-days: 21
