name: B01-62 P17 W21 original #681 to #669 single authority original #556 source real QA
on:
  push:
    branches: [feature/b01-62-p17w21-681-669-single-authority-adapter-v1]
  pull_request:
    paths:
      - 'Tools/B01/B01-62/P17W21Canonical681SlotAdapter001/**'
      - '.github/workflows/b01-62-p17w21-canonical681-669-adapter.yml'
permissions:
  contents: read
jobs:
  original-selected-bridge:
    name: Original #681/#669 real cold Save and lost-ACK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pin EXACT original owner-selected API #681, canonical store #669, frozen #556 and W06/#510
        shell: bash
        run: |
          set -euo pipefail
          dir="Tools/B01/B01-62/P17W21Canonical681SlotAdapter001"
          mkdir -p "$dir/.source" "$dir/.output"
          git fetch --no-tags origin eed2e39636edfd8b8db754c426db452164cbf9d7 d6ec0c82e388e65c1e02ddfd920bb50a1f6ef121 33094f154c7b91119b36d58aab285e6e83c5de57 d94400d95d13db7f27e1533df05c9292d5380431
          git show eed2e39636edfd8b8db754c426db452164cbf9d7:Assets/B0123CanonicalSaveApi001/Core/CanonicalWorldGateway.cs > "$dir/.source/CanonicalWorldGateway.cs"
          git show d6ec0c82e388e65c1e02ddfd920bb50a1f6ef121:Tools/B01/B01-62/P17W20SingleFileSaveSlot/SingleFileSaveSlot.cs > "$dir/.source/SingleFileSaveSlot.cs"
          git show 33094f154c7b91119b36d58aab285e6e83c5de57:Assets/B0123DetachedSaveContract001/Runtime/DetachedSnapshotContract.cs > "$dir/.source/DetachedSnapshotContract.cs"
          git show d94400d95d13db7f27e1533df05c9292d5380431:Assets/B0123DebrisRepulse001/Runtime/DebrisImpulseCore.cs > "$dir/.source/DebrisImpulseCore.cs"
          git show d94400d95d13db7f27e1533df05c9292d5380431:Assets/B0123SecureReattachV2/Runtime/SecureRigSpec.cs > "$dir/.source/SecureRigSpec.cs"
          test "$(git hash-object "$dir/.source/CanonicalWorldGateway.cs")" = f47dacc4ce6dd4ed1c66b6d3a07b432d2bc572c7
          test "$(git hash-object "$dir/.source/SingleFileSaveSlot.cs")" = db7745635164d9eb6b10f3246538700158130b7b
          test "$(git hash-object "$dir/.source/DetachedSnapshotContract.cs")" = b52e511c370f5fca56c74029050844dc8cbb7f9a
          test "$(git hash-object "$dir/.source/DebrisImpulseCore.cs")" = fa1aa5e531927cbe73cf5fdfe161b4a981316db5
          test "$(git hash-object "$dir/.source/SecureRigSpec.cs")" = b680ed0ec969ac23203fa55eab7b90f8daa86e43
          echo B0162_W21_SELECTED_681_669_556_ORIGINAL_GIT_BLOBS_PASS | tee "$dir/.output/original-provenance.log"
      - name: Compile and run 33 original-source C#9 physical disk session/quarantine/cold restart cases
        shell: bash
        run: |
          set -euo pipefail
          dir="Tools/B01/B01-62/P17W21Canonical681SlotAdapter001"
          dotnet run --project "$dir/Original681And669Tests.csproj" -c Release --verbosity minimal 2>&1 | tee "$dir/.output/actual-original-source-executed.log"
          grep -q 'B0162_W21_CANONICAL_681_669_ACTUAL_SOURCE_TOTAL 33 PASS 33 FAIL 0' "$dir/.output/actual-original-source-executed.log"
          grep -q 'B0162_W21_ONLY_681_SELECTED_682_ALT_HOLD_669_SINGLE_AUTHORITY' "$dir/.output/actual-original-source-executed.log"
      - uses: actions/upload-artifact@v4
        with:
          name: b0162-p17w21-canonical681669-${{ matrix.os }}
          path: Tools/B01/B01-62/P17W21Canonical681SlotAdapter001/.output/
          include-hidden-files: true
          if-no-files-found: error
