name: B01-61 W28 exact original 826 Unity ABI plus three independent physical compiler mutant regressions
on:
  push:
    branches: [qa/b01-61-p17w28-826-unity-abi-independent-mutation]
  pull_request:
    paths:
      - 'Tools/B01/B01-61/P17W28SaveUnityAbiIndependentQA/**'
      - '.github/workflows/b01-61-w28-save826-abi-mutation.yml'
permissions:
  contents: read
jobs:
  independent-exact-original-save-abi:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fetch ORIGINAL immutable V7 from selected producer #780 not copied test code
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin b4df10a7ad7e6c758f8331013f6b216b3a3689a3 99fb08619c78b3834bb4c0450499babf991f218a
          src=Tools/B01/B01-62/P17W28UnityCompatibleWholeGameV3/.source
          mkdir -p "$src"
          git show b4df10a7ad7e6c758f8331013f6b216b3a3689a3:Assets/B01Packages/ECONAPPROVED007/Runtime/ApprovedEconomyPolicyV7.cs > "$src/ApprovedEconomyPolicyV7.cs"
          git show b4df10a7ad7e6c758f8331013f6b216b3a3689a3:Assets/B01Packages/ECONAPPROVED007/Runtime/CanonicalEconomySectionV7.cs > "$src/CanonicalEconomySectionV7.cs"
          test "$(git hash-object "$src/ApprovedEconomyPolicyV7.cs")" = 53ebce6c07388dc9c8a8ed79b6de4d3ccbee4773
          test "$(git hash-object "$src/CanonicalEconomySectionV7.cs")" = d8b71de91db36295b6220e9c4baad71eb54455f6
      - name: Independently compile EXACT selected original #826 CSharp9 against netstandard2.1
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Tools/B01/B01-62/P17W28UnityCompatibleWholeGameV3/WholeGameEconomyUnityV3Abi.csproj -c Release --nologo 2>&1 | tee real-original-826-netstandard21.log
          echo 'B0161_W28_EXACT_826_ORIGINAL_NETSTANDARD21_ABI=GREEN'
      - name: Re-execute original full world+ECON V7 9 real OS disk/CAS/ACK test cases
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project Tools/B01/B01-62/P17W28UnityCompatibleWholeGameV3/WholeGameEconomyUnityV3QA.csproj -c Release --nologo 2>&1 | tee real-original-826-fullgame-source.log
          grep -F 'W25_V7_GAME_ECON_ONE_ENVELOPE_SOURCE_TOTAL 9 PASS 9 FAIL 0' real-original-826-fullgame-source.log
          grep -F 'W28_REPLACE_AFTER_ACK_LOSS_COLD_ATOMIC_V7=PASS' real-original-826-fullgame-source.log
      - name: Independent three old Unity ABI regression mutants, isolated temp only
        shell: bash
        run: |
          set -euo pipefail
          python Tools/B01/B01-61/P17W28SaveUnityAbiIndependentQA/source_mutation_abi_qa.py dist/b0161-w28-save826 real-original-826-fullgame-source.log 2>&1 | tee real-abi-mutant-compiler-outcomes.log
          grep -F 'B0161_W28_ORIGINAL_826_ABI_NEGATIVE_CONTROLS_ALL_3=PASS' real-abi-mutant-compiler-outcomes.log
      - name: Preserve actual source ABI/build stdout and SHA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0161-w28-independent-original826-abi-${{ matrix.os }}
          path: |
            dist/b0161-w28-save826/**
            real-original-826-netstandard21.log
            real-original-826-fullgame-source.log
            real-abi-mutant-compiler-outcomes.log
          if-no-files-found: warn
