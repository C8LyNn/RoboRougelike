name: B01-41 P17B original Unity asset dependency impact (NO UNITY)
on:
  push:
    branches: ['audit/b01-41-p17-asset-impact-trace']
    paths:
      - 'Tools/B01/CI41/P17B/**'
      - '.github/workflows/b01-41-p17b-asset-impact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  impact:
    name: Asset impact original-Git dependency graph (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin original implementation and tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Tools/B01/CI41/P17B/asset_impact.py)" = '8214f5f5f3f0298ca39815e1f86075401d2bf659'
          test "$(git hash-object Tools/B01/CI41/P17B/test_asset_impact.py)" = '0356714cf844b31c7d73628c5a3fe401e0f22c26'
          echo 'ORIGINAL_B01_41_ASSET_IMPACT_TOOL_PINNED'
      - name: Fetch read-only original Codex ancestor source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=200 origin '+refs/pull/310/head:refs/remotes/origin/ci41-p17b-codex'
          git cat-file -e 'a2ccd055070a963805cba0779b79f18489f4794f^{commit}'
          git cat-file -e '16c2668104952f1b8db304cc7817b897fb48a9b1^{commit}'
          echo 'ORIGINAL_GAME_SOURCE_INPUTS_AVAILABLE; CODEX_FILES_NOT_MODIFIED'
      - name: Execute transitive prefab-scene regression and real Codex input
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = 'Windows' ]; then PY=python; else PY=python3; fi
          "$PY" -m unittest discover -s Tools/B01/CI41/P17B -p test_asset_impact.py -v 2>&1 | tee "Tools/B01/CI41/P17B/result-${RUNNER_OS}.txt"
          grep -q 'SCRIPT_TO_PREFAB_TO_SCENE_ORIGINAL_GIT_TRANSITIVE_IMPACT_PASS' "Tools/B01/CI41/P17B/result-${RUNNER_OS}.txt"
          grep -q 'MATERIAL_TO_PREFAB_TO_SCENE_ORIGINAL_GIT_IMPACT_PASS' "Tools/B01/CI41/P17B/result-${RUNNER_OS}.txt"
          grep -q 'DELETED_ASSET_REQUIRES_SEPARATE_RETIREMENT_QA_FAIL_CLOSED' "Tools/B01/CI41/P17B/result-${RUNNER_OS}.txt"
          grep -q 'REAL_CODEX_ENEMY_AI_SHA_ORIGINAL_ASSET_IMPACT_SCAN_PASS' "Tools/B01/CI41/P17B/result-${RUNNER_OS}.txt"
          echo 'CI41_ASSETIMPACT_001_EXECUTED_SOURCE_TESTS_PASS; NATIVE_UNITY=NOT_RUN; G1=HOLD'
      - name: Publish original Python Git test trace only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CI41-P17B-ASSETIMPACT-${{ matrix.os }}
          path: Tools/B01/CI41/P17B/result-${{ runner.os }}.txt
          if-no-files-found: warn
          retention-days: 14
