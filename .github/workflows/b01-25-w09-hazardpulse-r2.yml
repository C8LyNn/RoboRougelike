name: B01-25 W09 HAZARDPULSE R2 source timing regression (not Unity)
on:
  push:
    branches: [research/b01-25-p17w09-hazardpulse001-r2]
    paths:
      - 'Research/B01-25/P17/HAZARDPULSE001R2/**'
      - '.github/workflows/b01-25-w09-hazardpulse-r2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-r2-source-on-two-oses:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SRC: Research/B01-25/P17/HAZARDPULSE001R2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Load original immutable level maps and verify original Git object hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SRC/.output"
          git fetch --no-tags origin ad52a604ffa4f143d98e607049d6f79e0c7e580f f565e250659692541d672cdab108c4cfb8cfdd31
          git show ad52a604ffa4f143d98e607049d6f79e0c7e580f:Research/B01-25/P17/CLEARANCELADDER001/arena.json > "$SRC/.output/clearance.json"
          git show f565e250659692541d672cdab108c4cfb8cfdd31:Research/B01-25/P17/SLALOM001/arena.json > "$SRC/.output/slalom.json"
          test "$(git hash-object "$SRC/.output/clearance.json")" = 53eb696950121465befea2855eda4d7268750016
          test "$(git hash-object "$SRC/.output/slalom.json")" = 013f5fe2058e76233f580a439e8402c0fe09f124
          echo MAP_GIT_BLOB_PINS_PASS
      - name: Compile REAL R2 core against CSharp9 netstandard2.1 warning as error
        shell: bash
        run: |
          set -euo pipefail
          dotnet build "$SRC/PulseUnityCompat.csproj" --configuration Release -p:LangVersion=9.0 -warnaserror
      - name: Execute R2 source map tests and all newly added decimal boundaries
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project "$SRC/HazardPulse.csproj" --configuration Release -- "$SRC/profiles.json" "$SRC/.output/clearance.json" "$SRC/.output/slalom.json" "$SRC/.output/receipt.json" 2>&1 | tee "$SRC/.output/producer-${RUNNER_OS}.log"
          test -s "$SRC/.output/receipt.json"
      - name: Replay B01-60 original independent QA444 cases on R2 (producer replay)
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project "$SRC/Qa444Regression.csproj" --configuration Release 2>&1 | tee "$SRC/.output/qa444-${RUNNER_OS}.log"
      - name: Persist raw logs and machine-readable source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-25-hazardpulse-r2-${{ matrix.os }}
          path: |
            Research/B01-25/P17/HAZARDPULSE001R2/.output/receipt.json
            Research/B01-25/P17/HAZARDPULSE001R2/.output/producer-*.log
            Research/B01-25/P17/HAZARDPULSE001R2/.output/qa444-*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 21
