name: ModelFactory M04-023 Blender QA
on:
  push:
    branches:
      - feature/rrl-model-m04-023-ion-throttle
  pull_request:
    paths:
      - 'Tools/ModelFactory/M04/M04-023/**'
      - '.github/workflows/ci-m04-023.yml'
  workflow_dispatch:
jobs:
  blender-export-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and NumPy for glTF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version | head -3
      - name: Static Python syntax
        run: python3 -m py_compile Tools/ModelFactory/M04/M04-023/*.py
      - name: Generate BLEND and animated GLB; manifold and sampled clearance QA
        run: |
          blender -b --factory-startup --python-exit-code 1 --python Tools/ModelFactory/M04/M04-023/generate_m04_023.py -- --out build/M04-023
      - name: Reopen native BLEND
        run: |
          blender -b build/M04-023/M04-023.blend --python-exit-code 1 --python-expr "import bpy; assert len([o for o in bpy.data.objects if o.type == 'MESH']) >= 50"
      - name: Independent GLB animation and material validation
        run: |
          python3 Tools/ModelFactory/M04/M04-023/qa_m04_023.py --glb build/M04-023/M04-023.glb --manifest build/M04-023/manifest.json --report build/M04-023/qa.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M04-023-blend-glb-qa
          path: build/M04-023/
          if-no-files-found: warn
          retention-days: 30
