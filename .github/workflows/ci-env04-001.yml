name: ENV04-001 v002 ventilation grate - actual Blender QA and immutable revision
on:
  push:
    branches:
      - feature/rrl-env04-001-industrial-vent-grate-20261027
    paths:
      - 'Tools/EnvironmentFactory/ENV04/ENV04-001/*_v002.py'
      - 'Tools/EnvironmentFactory/ENV04/ENV04-001/README.md'
      - '.github/workflows/ci-env04-001.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'Tools/EnvironmentFactory/ENV04/ENV04-001/*_v002.py'
      - 'Tools/EnvironmentFactory/ENV04/ENV04-001/README.md'
      - '.github/workflows/ci-env04-001.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blender-static-art-v002:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install actual Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libglx-mesa0 libopengl0 libosmesa6
          blender --version
      - name: Generate actual v002 BLEND GLB and four real previews
        run: |
          blender --background --python-exit-code 1 --python Tools/EnvironmentFactory/ENV04/ENV04-001/generate_env04_001_v002.py -- --out Tools/EnvironmentFactory/ENV04/ENV04-001/generated/v002
      - name: Independent actual Blender mesh, UV, normals, GLB and PNG QA
        run: |
          blender --background --python-exit-code 1 --python Tools/EnvironmentFactory/ENV04/ENV04-001/qa_env04_001_v002.py -- --out Tools/EnvironmentFactory/ENV04/ENV04-001/generated/v002
      - name: Repeat generator and independent QA in isolated directory
        run: |
          blender --background --python-exit-code 1 --python Tools/EnvironmentFactory/ENV04/ENV04-001/generate_env04_001_v002.py -- --out /tmp/env04_v002_repro
          blender --background --python-exit-code 1 --python Tools/EnvironmentFactory/ENV04/ENV04-001/qa_env04_001_v002.py -- --out /tmp/env04_v002_repro
          python3 - <<'PY'
          import json
          from pathlib import Path
          first=Path("Tools/EnvironmentFactory/ENV04/ENV04-001/generated/v002")
          second=Path("/tmp/env04_v002_repro")
          for name,keys in [
              ("build_report.json",("geometry_sha256","source_sha256","triangles","mesh_objects","materials")),
              ("qa_report.json",("geometry_sha256","triangles","mesh_objects","materials","blender_bounds_min_m","blender_bounds_max_m","critical_aabb_pairs_checked"))
          ]:
              a=json.loads((first/name).read_text())
              b=json.loads((second/name).read_text())
              for key in keys:
                  assert a[key]==b[key],f"REPRO_FAIL {name} {key}: {a[key]} != {b[key]}"
          print("ENV04_V002_REPRODUCIBLE_GEOMETRY_AND_UV_PASS")
          PY
      - name: Record exact source SHA and physical SHA-256 for v002 only
        run: |
          cd Tools/EnvironmentFactory/ENV04/ENV04-001/generated/v002
          rm -f *.blend1
          git rev-parse HEAD > SOURCE_SHA.txt
          sha256sum *.blend *.glb *.png *.json SOURCE_SHA.txt > SHA256SUMS
          cat SOURCE_SHA.txt SHA256SUMS
      - name: Upload actual v002 binaries and QA evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ENV04-001-v002-actual-blender-exports
          path: Tools/EnvironmentFactory/ENV04/ENV04-001/generated/v002/
          if-no-files-found: error
          retention-days: 30
      - name: Commit only new v002 artifacts to existing PR branch
        if: success() && github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f Tools/EnvironmentFactory/ENV04/ENV04-001/generated/v002/
          if ! git diff --cached --quiet; then
            git commit -m 'ENV04-001 v002: verified Blender GLB BLEND and four renders'
            git fetch origin feature/rrl-env04-001-industrial-vent-grate-20261027
            git rebase origin/feature/rrl-env04-001-industrial-vent-grate-20261027
            git push origin HEAD:feature/rrl-env04-001-industrial-vent-grate-20261027
          fi
