name: B01-00 W09 receipt latch original source
on:
  push:
    branches:
      - b01-00/p17w09-receipt-latch-001
  pull_request:
    paths:
      - 'Tools/B01/B01-00/W09/RECEIPT-LATCH-001/**'
      - '.github/workflows/b01-00-w09-receipt-latch.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute original Python source and 406 original cases including W17 exclusive #596/#604 source choice and G0 HOLD
        run: python -m unittest discover -s Tools/B01/B01-00/W09/RECEIPT-LATCH-001 -p "test_*.py" -v
      - name: Run original CLI on safe HOLD example
        run: python Tools/B01/B01-00/W09/RECEIPT-LATCH-001/receipt_latch.py Tools/B01/B01-00/W09/RECEIPT-LATCH-001/example_hold.json
      - name: Verify original PR427 exact workflow ID and Windows Ubuntu test jobs via live GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python Tools/B01/B01-00/W09/RECEIPT-LATCH-001/github_live.py Tools/B01/B01-00/W09/RECEIPT-LATCH-001/example_hold.json --require-source-objects
      - name: Execute W13 actual source-only OFFERED receipt without fake G1/G2 ACK
        run: python Tools/B01/B01-00/W09/RECEIPT-LATCH-001/offer_protocol.py Tools/B01/B01-00/W09/RECEIPT-LATCH-001/offer_secure_v2_source_only.json --require-structural-offer
      - name: Check W14 real Save contract source evidence, no fake G0 or integration
        run: python Tools/B01/B01-00/W09/RECEIPT-LATCH-001/save_admission.py Tools/B01/B01-00/W09/RECEIPT-LATCH-001/save_contract_w14_hold.json
      - name: Execute W15 one selected frozen Save #556, source-G0 only and host HOLD
        run: python Tools/B01/B01-00/W09/RECEIPT-LATCH-001/save_admission.py --selected-v2 Tools/B01/B01-00/W09/RECEIPT-LATCH-001/save_contract_w15_selected.json
      - name: Check W16 real #585 exact RED and #587 newer untested core, no source approval
        run: python Tools/B01/B01-00/W09/RECEIPT-LATCH-001/save_admission.py --bridge-w16 Tools/B01/B01-00/W09/RECEIPT-LATCH-001/bridge_w16_hold.json
      - name: W17 only ONE corrected #596/#604 R2; source evidence cannot auto-offer
        run: python Tools/B01/B01-00/W09/RECEIPT-LATCH-001/save_admission.py --final-w17 Tools/B01/B01-00/W09/RECEIPT-LATCH-001/bridge_w17_final_pending.json
