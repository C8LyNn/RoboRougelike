name: MODEL-04 M04-018 Blender export and independent QA
on:
  push:
    branches:
      - feature/rrl-model-m04-018-deployable-stabilizer-anchor
  pull_request:
    paths:
      - 'Tools/ModelFactory/M04/M04-018/**'
      - '.github/workflows/ci-m04-018.yml'
  workflow_dispatch:

jobs:
  blender-export-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Generate BLEND, animated GLB, OBJ and manifest
        run: blender -b --factory-startup --python-exit-code 1 --python Tools/ModelFactory/M04/M04-018/generate_m04_018.py -- --out build/M04-018
      - name: Reopen BLEND and check rig
        run: |
          blender -b build/M04-018/M04-018_stabilizer_anchor.blend --python-exit-code 1 --python-expr "import bpy; assert len([o for o in bpy.data.objects if o.type == 'MESH']) >= 50; assert len([o for o in bpy.data.objects if o.name.startswith('CLAW_DEPLOY_PIVOT_Z_')]) == 4"
      - name: Independent GLB, OBJ and manifest QA
        run: python3 Tools/ModelFactory/M04/M04-018/qa_m04_018.py --out build/M04-018
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M04-018-blend-glb-obj-qa
          path: build/M04-018/
          if-no-files-found: warn
          retention-days: 30
