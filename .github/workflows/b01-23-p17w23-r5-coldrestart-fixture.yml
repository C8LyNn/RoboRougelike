name: B01-23 W23 R5 ColdRestart fixture exact source preflight
on:
  push:
    branches: [b01-23/p17w23-r5-coldrestart-native-fixture-r1]
  pull_request:
    paths:
      - Assets/B0123UnitySaveBridge001/Tests/IsolatedSaveWorldNativePlayModeTests.cs
      - Tools/B01/B01-23/P17W23R5ColdRestartFixture001/**
      - .github/workflows/b01-23-p17w23-r5-coldrestart-fixture.yml
jobs:
  source-fixture:
    strategy:
      fail-fast: false
      matrix: {os: [windows-2025, ubuntu-24.04]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Inspect exact frozen R5 source and g4 to g5 native fixture correction
        run: python -m unittest discover -s Tools/B01/B01-23/P17W23R5ColdRestartFixture001 -p test_fixture.py -v
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Re-run original R5 .NET8 source regression
        run: dotnet run --project Tools/B01/B01-23/P17W15UnitySaveBridge001/HostBridgeTests.csproj -c Release
