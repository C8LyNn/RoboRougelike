name: B01-41 P17 W03B repeated Unity CLI execution harness (SIMULATED EDITOR)
on:
  push:
    branches: ['audit/b01-41-p17-w03-unity-repeat-executor']
    paths:
      - 'Tools/B01/CI41/P17W03B/**'
      - '.github/workflows/b01-41-p17w03b-unity-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repeat-probe:
    name: Physical subprocess simulation with original B01-41 source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Pin exact original implementation and executable test Git blob hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Tools/B01/CI41/P17W03B/unity_repeat.py)" = '81e2e29a3be10a7882cba9603f453fd7253e1390'
          test "$(git hash-object Tools/B01/CI41/P17W03B/test_unity_repeat.py)" = '16cb0fc02eed331a4a0dd2bea268d5b4abfa5413'
          echo 'CI41_REPLAY_SOURCE_PINNED; NO_GAMEPLAY_SOURCE_EDITED'
      - name: Execute actual physical process replay cases using simulated Unity CLI
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = 'Windows' ]; then PY=python; else PY=python3; fi
          "$PY" -m unittest discover -s Tools/B01/CI41/P17W03B -p test_unity_repeat.py -v 2>&1 | tee "Tools/B01/CI41/P17W03B/result-${RUNNER_OS}.txt"
          grep -q 'ACTUAL_SUBPROCESS_THREE_TRIALS_TWO_EXACT_CODEX_FILTERS_GREEN_NOT_UNITY' "Tools/B01/CI41/P17W03B/result-${RUNNER_OS}.txt"
          grep -q 'ACTUAL_SUBPROCESS_TIMEOUT_STOPS_REPLAY_WITH_EVIDENCE' "Tools/B01/CI41/P17W03B/result-${RUNNER_OS}.txt"
          grep -q 'ACTUAL_COMMAND_LINE_SUBPROCESS_JSON_REPLAY_SCOPE_NOT_NATIVE_UNITY' "Tools/B01/CI41/P17W03B/result-${RUNNER_OS}.txt"
          echo 'SIMULATED_EDITOR_REAL_OS_PROCESSES_ONLY; NATIVE_UNITY=NOT_RUN; G1=NOT_RUN'
      - name: Upload physical subprocess source-only test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CI41-W03B-REPLAY-SIMULATOR-${{ matrix.os }}
          path: Tools/B01/CI41/P17W03B/result-${{ runner.os }}.txt
          if-no-files-found: warn
          retention-days: 14
