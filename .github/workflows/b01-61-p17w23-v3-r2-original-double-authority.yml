name: B01-61 W23 exact #729 V3 versus #712 original R2 physical dual-authority QA
on:
  push:
    branches: [qa/b01-61-p17w23-v3-729-vs-r2-712-dual-lock]
  pull_request:
    paths:
      - 'Tools/B01/B01-61/P17W23V3R2SingleAuthorityQA/**'
      - '.github/workflows/b01-61-p17w23-v3-r2-original-double-authority.yml'
permissions:
  contents: read
jobs:
  directly-compiled-original-729-712:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Rehydrate exact original selected #729 and #712, original #669 plus frozen #556 W06 #510
        shell: bash
        run: |
          set -euo pipefail
          dir="Tools/B01/B01-61/P17W23V3R2SingleAuthorityQA/.source"
          mkdir -p "$dir"
          git fetch --no-tags origin b8ca29c7707cd6b4338d0b9772d74dee676d49d2 bd8905ad549a7b26854b671be971f7d781308311 d6ec0c82e388e65c1e02ddfd920bb50a1f6ef121 33094f154c7b91119b36d58aab285e6e83c5de57 d94400d95d13db7f27e1533df05c9292d5380431
          git show b8ca29c7707cd6b4338d0b9772d74dee676d49d2:Assets/B0123CanonicalSaveApi001/Core/CanonicalWorldGateway.cs > "$dir/CanonicalWorldGatewayV3.cs"
          git show b8ca29c7707cd6b4338d0b9772d74dee676d49d2:Assets/B0123CanonicalSaveApi001/Core/CanonicalWorldSlotLease.cs > "$dir/CanonicalWorldSlotLease.cs"
          git show bd8905ad549a7b26854b671be971f7d781308311:Tools/B01/B01-62/P17W21CanonicalSessionLeaseR2/CanonicalSlotSessionR2.cs > "$dir/CanonicalSlotSessionR2.cs"
          git show d6ec0c82e388e65c1e02ddfd920bb50a1f6ef121:Tools/B01/B01-62/P17W20SingleFileSaveSlot/SingleFileSaveSlot.cs > "$dir/SingleFileSaveSlot.cs"
          git show 33094f154c7b91119b36d58aab285e6e83c5de57:Assets/B0123DetachedSaveContract001/Runtime/DetachedSnapshotContract.cs > "$dir/DetachedSnapshotContract.cs"
          git show d94400d95d13db7f27e1533df05c9292d5380431:Assets/B0123DebrisRepulse001/Runtime/DebrisImpulseCore.cs > "$dir/DebrisImpulseCore.cs"
          git show d94400d95d13db7f27e1533df05c9292d5380431:Assets/B0123SecureReattachV2/Runtime/SecureRigSpec.cs > "$dir/SecureRigSpec.cs"
          test "$(git hash-object "$dir/CanonicalWorldGatewayV3.cs")" = 21733278b6ab0669fccb6d085e0b6cf242792de2
          test "$(git hash-object "$dir/CanonicalWorldSlotLease.cs")" = a9331dd620336d8c42165d134dc8a5e05ed51873
          test "$(git hash-object "$dir/CanonicalSlotSessionR2.cs")" = fefc2e263e068b913c6e59ec3c8375bbbe43db4e
          test "$(git hash-object "$dir/SingleFileSaveSlot.cs")" = db7745635164d9eb6b10f3246538700158130b7b
          test "$(git hash-object "$dir/DetachedSnapshotContract.cs")" = b52e511c370f5fca56c74029050844dc8cbb7f9a
          test "$(git hash-object "$dir/DebrisImpulseCore.cs")" = fa1aa5e531927cbe73cf5fdfe161b4a981316db5
          test "$(git hash-object "$dir/SecureRigSpec.cs")" = b680ed0ec969ac23203fa55eab7b90f8daa86e43
      - name: Actual original CSharp9 .NET8 strict source build with real original OS FileStream
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Tools/B01/B01-61/P17W23V3R2SingleAuthorityQA/Original729And712QA.csproj -c Release --nologo 2>&1 | tee build.log
      - name: Execute two original physically conflicting owner sources and additional real OS CLR child
        shell: bash
        run: |
          set -euo pipefail
          set +e
          dotnet Tools/B01/B01-61/P17W23V3R2SingleAuthorityQA/bin/Release/net8.0/Original729And712QA.dll --release | tee qa_release.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "B0161_W23_ORIGINAL_SOURCE_RELEASE_EXIT=${rc}"
          if [[ "${rc}" -ne 3 ]]; then echo 'W23_ORIGINAL_SOURCE_RED_WITNESS_OR_HARNESS_INVALID'; exit 1; fi
          grep -Fx 'TOTAL 11 PASS 11 FAIL 0' qa_release.log
          grep -Fx 'SOURCE_RELEASE_GATE=HOLD_TWO_INDEPENDENT_DOT_OWNER_DOT_LEASE_AUTHORITIES' qa_release.log
      - name: Check original 7 Git source SHA + five B01-61 added-only QA files and source log markers
        shell: bash
        run: |
          set -euo pipefail
          python Tools/B01/B01-61/P17W23V3R2SingleAuthorityQA/receipt.py --log qa_release.log --out dist/b01-61-w23-v3-r2-physical-authority-receipt.json
      - name: Preserve raw actual OS source stdout, compiler logs, immutable SHA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0161-w23-v3-r2-original-${{ matrix.os }}
          path: |
            build.log
            qa_release.log
            dist/b01-61-w23-v3-r2-physical-authority-receipt.json
          if-no-files-found: warn
