name: B01-40 W34 original 923 full-R3 sole Save SOURCE G0 NOT UNITY
on:
  push:
    branches: [qa/b01-40-p17w31-877-885-onewriter-composite-g0]
permissions:
  contents: read
jobs:
  original-923-disk-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent original exact 923 source G0 and 8 negative mutation tests
        run: |
          set -euo pipefail
          git fetch --no-tags origin e6eb24b7a45a66a5fa5d039f59c80b7e4be4439b
          git fetch --no-tags origin a0282f2de0250d2a8fe421bbe182b4cb6fab2a11
          git fetch --no-tags origin b4df10a7ad7e6c758f8331013f6b216b3a3689a3
          git fetch --no-tags origin c9c19665a4f9385e6479f7151097deb797026ade
          python Tools/B01/B01-40/P17W31Game877Save885G0/audit.py --out w34-evidence | tee w34-source.log
          cp w34-source.log w34-evidence/source.log
          grep -q 'B0140_W34_923_15_OF_15_PRODUCER_SOURCE_SCOPE_PASS' w34-source.log
          grep -q 'B0140_W34_923_SAME_ONE_WRITER_11_NEGATIVE_GUARDS_PASS' w34-source.log
      - name: Checkout original producer 923 into separate ephemeral worktree, with immutable sources
        run: |
          set -euo pipefail
          git worktree add --detach _w34_original_923 e6eb24b7a45a66a5fa5d039f59c80b7e4be4439b
          mkdir -p _w34_original_923/Tools/B01/B01-62/P17W30AdmissionV3/.source
          mkdir -p _w34_original_923/Tools/B01/B01-62/P17W33R3World/.source
          git show 3bd9b159997924dcecb4e1cd1d41137896e5199e:Assets/R3/R3VehicleCatalog.cs > _w34_original_923/Tools/B01/B01-62/P17W33R3World/.source/R3VehicleCatalog.cs
          git show b4df10a7ad7e6c758f8331013f6b216b3a3689a3:Assets/B01Packages/ECONAPPROVED007/Runtime/ApprovedEconomyPolicyV7.cs > _w34_original_923/Tools/B01/B01-62/P17W30AdmissionV3/.source/ApprovedEconomyPolicyV7.cs
          git show b4df10a7ad7e6c758f8331013f6b216b3a3689a3:Assets/B01Packages/ECONAPPROVED007/Runtime/CanonicalEconomySectionV7.cs > _w34_original_923/Tools/B01/B01-62/P17W30AdmissionV3/.source/CanonicalEconomySectionV7.cs
          git show c9c19665a4f9385e6479f7151097deb797026ade:Assets/B01Packages/ECONADMISSIONW29/Runtime/EconomyV7AdmissionW29.cs > _w34_original_923/Tools/B01/B01-62/P17W30AdmissionV3/.source/EconomyV7AdmissionW29.cs
          (cd _w34_original_923 && python Tools/B01/B01-62/P17W33R3World/source_guard.py ../w34-evidence/original-producer-923.json) | tee w34-evidence/producer-guard.log
          grep -q 'W33_ONE_WRITER_P17_EXACT_DIFF_15_PATHS=PASS' w34-evidence/producer-guard.log
      - name: Truly execute original one-writer netstandard ABI and real OS disk tests 9 6 4 2 15
        run: |
          set -euo pipefail
          cd _w34_original_923
          dotnet build Tools/B01/B01-62/P17W30AdmissionV3/W30UnityAbi.csproj -c Release -v quiet | tee ../w34-evidence/abi.log
          dotnet run --project Tools/B01/B01-62/P17W30AdmissionV3/W28OriginalRegression.csproj -c Release -v quiet | tee ../w34-evidence/w28.log
          dotnet run --project Tools/B01/B01-62/P17W30AdmissionV3/W29ColdRegression.csproj -c Release -v quiet | tee ../w34-evidence/w29.log
          dotnet run --project Tools/B01/B01-62/P17W30AdmissionV3/W30AdmissionQA.csproj -c Release -v quiet | tee ../w34-evidence/w30.log
          dotnet run --project Tools/B01/B01-62/P17W31AtomicPair/AtomicPairQA.csproj -c Release -v quiet | tee ../w34-evidence/w31.log
          dotnet run --project Tools/B01/B01-62/P17W33R3World/R3WorldActualOsQA.csproj -c Release -v quiet | tee ../w34-evidence/w33.log
          cd ..
          grep -q 'Build succeeded' w34-evidence/abi.log
          grep -q 'W25_V7_GAME_ECON_ONE_ENVELOPE_SOURCE_TOTAL 9 PASS 9 FAIL 0' w34-evidence/w28.log
          grep -q 'B0162_W29_COLD_READ_REAL_OS_TOTAL 6 PASS 6 FAIL 0' w34-evidence/w29.log
          grep -q 'B0162_W30_ADMISSION_SINGLE_WRITER_REAL_OS_TOTAL 4 PASS 4 FAIL 0' w34-evidence/w30.log
          grep -q 'B0162_W31_MUTABLE_INPUT_REAL_OS_TOTAL 2 PASS 2 FAIL 0' w34-evidence/w31.log
          grep -q 'B0162_W33_R3_SAME_ONE_WRITER_REAL_OS_TOTAL 15 PASS 15 FAIL 0' w34-evidence/w33.log
          echo B0140_W34_923_ORIGINAL_PHYSICAL_DISK_MANAGED_36_OF_36_PASS | tee w34-evidence/total.txt
          git worktree remove --force _w34_original_923
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b0140-w34-original-923-source-${{ matrix.os }}
          path: w34-evidence/
          if-no-files-found: warn
  compare-real-source-os:
    needs: [original-923-disk-source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: b0140-w34-original-923-source-ubuntu-24.04
          path: ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: b0140-w34-original-923-source-windows-2025
          path: windows
      - name: Exact binary comparison of original 923 source receipts, NOT game zip
        shell: bash
        run: |
          set -euo pipefail
          cmp ubuntu/B0140_W34_923_REVIEW_ONLY_SOURCE.zip windows/B0140_W34_923_REVIEW_ONLY_SOURCE.zip
          cmp ubuntu/manifest.json windows/manifest.json
          cmp ubuntu/sha256.json windows/sha256.json
          cmp ubuntu/original-producer-923.json windows/original-producer-923.json
          cmp ubuntu/total.txt windows/total.txt
          sha256sum ubuntu/B0140_W34_923_REVIEW_ONLY_SOURCE.zip
          echo B0140_W34_923_CROSS_OS_ORIGINAL_SOURCE_BYTE_EQUAL_NOT_UNITY_PASS
