name: B01-21 W33 JumpPad original-CSharp contact lifecycle SOURCE ONLY
on:
  push:
    branches: [b01-21/p17w33-jumppad-stale-collider-r1]
  pull_request:
    paths:
      - 'Assets/B01Packages/MapJumpPad001/**'
      - 'Tools/B01/B01-21/W33/**'
      - '.github/workflows/b01-21-w33-jumppad-original-csharp.yml'
jobs:
  source-csharp-red-green:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify exact owner-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=3bd9b159997924dcecb4e1cd1d41137896e5199e
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/w33-paths.txt"
          while IFS= read -r path; do
            case "$path" in
              Assets/B01Packages/MapJumpPad001/Runtime/MapJumpPad.cs|Assets/B01Packages/MapJumpPad001/Tests/PlayMode/MapJumpPadPhysicsTests.cs|Tools/B01/B01-21/W33/*|Docs/B01/W33_B0121_JUMPPAD_CONTACT_LIFECYCLE.md|.github/workflows/b01-21-w33-jumppad-original-csharp.yml) ;;
              *) echo "OWNERSHIP_SCOPE_FAIL: $path"; exit 1;;
            esac
          done < "$RUNNER_TEMP/w33-paths.txt"
          git rev-parse HEAD | tee "$RUNNER_TEMP/w33-head.txt"
      - name: Compile and execute exact historical RED and current GREEN CSharp
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=Tools/B01/B01-21/W33/B0121JumpPadGuard.csproj
          BASE=3bd9b159997924dcecb4e1cd1d41137896e5199e
          SRC=Assets/B01Packages/MapJumpPad001/Runtime/MapJumpPad.cs
          git show "$BASE:$SRC" > "$RUNNER_TEMP/LegacyMapJumpPad.cs"
          dotnet build "$PROJECT" --configuration Release "-p:MapJumpPadSource=$RUNNER_TEMP/LegacyMapJumpPad.cs" --output "$RUNNER_TEMP/legacy-bin" --verbosity quiet
          set +e
          dotnet "$RUNNER_TEMP/legacy-bin/B0121JumpPadGuard.dll" > "$RUNNER_TEMP/legacy.log" 2>&1
          legacy_rc=$?
          set -e
          cat "$RUNNER_TEMP/legacy.log"
          test "$legacy_rc" -eq 23
          grep -q EXPECTED_STALE_CONTACT_RED "$RUNNER_TEMP/legacy.log"
          dotnet clean "$PROJECT" --configuration Release --verbosity quiet
          dotnet build "$PROJECT" --configuration Release --output "$RUNNER_TEMP/fixed-bin" --verbosity quiet
          dotnet "$RUNNER_TEMP/fixed-bin/B0121JumpPadGuard.dll" > "$RUNNER_TEMP/fixed.log" 2>&1
          cat "$RUNNER_TEMP/fixed.log"
          grep -q B0121_ORIGINAL_CSHARP_GREEN "$RUNNER_TEMP/fixed.log"
          echo "SOURCE_CSHARP_RED_TO_GREEN=PASS (NOT UNITY G1)" | tee "$RUNNER_TEMP/receipt.txt"
      - name: Upload source logs (including failed case)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b01-21-w33-source-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/w33-paths.txt
            ${{ runner.temp }}/w33-head.txt
            ${{ runner.temp }}/legacy.log
            ${{ runner.temp }}/fixed.log
            ${{ runner.temp }}/receipt.txt
          if-no-files-found: warn
