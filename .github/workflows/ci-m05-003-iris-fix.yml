name: M05-003 connected iris independent QA
on:
  push:
    branches: [fix/rrl-m05-003-iris-hub-continuity]
    paths:
      - 'Tools/ModelFactory/M05/M05-003/**'
      - '.github/workflows/ci-m05-003-iris-fix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connected-iris:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile source and validator
        run: |
          python3 -m py_compile Tools/ModelFactory/M05/M05-003/generate_m05_003.py
          python3 -m py_compile Tools/ModelFactory/M05/M05-003/qa_static.py
      - name: Execute static geometry self-test (physical contacts and axial clearance)
        run: python3 Tools/ModelFactory/M05/M05-003/generate_m05_003.py --self-test
      - name: Independent checked-in OBJ geometry and deterministic export QA
        run: python3 Tools/ModelFactory/M05/M05-003/qa_static.py --asset-dir Tools/ModelFactory/M05/M05-003/generated
      - name: Verify exact source manifest metrics and no runtime misrepresentation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('Tools/ModelFactory/M05/M05-003/generated')
          r=json.loads((root/'M05-003_manifest.json').read_text())
          assert r['geometry_revision']=='M05-003_V2_CONNECTED_IRIS'
          assert r['iris_petals_seated_in_hubs']==10
          assert r['iris_index_markers_attached']==2
          assert abs(r['iris_hub_overlap_m']-.003)<1e-8
          assert abs(r['iris_index_overlap_m']-.002)<1e-8
          assert r['parts']==44 and r['vertices']==2526 and r['triangles']==4912
          assert r['blender_export']=='NOT RUN'
          assert r['unity_import']=='NOT RUN'
          print('PASS 12 anchored iris components; Blender/Unity NOT RUN')
          PY
      - name: Upload corrected static model
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: M05-003-V2-connected-irises-OBJ-MTL
          path: |
            Tools/ModelFactory/M05/M05-003/generated/M05-003_dual_optical_scanner.obj
            Tools/ModelFactory/M05/M05-003/generated/M05-003_dual_optical_scanner.mtl
            Tools/ModelFactory/M05/M05-003/generated/M05-003_manifest.json
          if-no-files-found: error
