name: B01-12 TutorialFlow research source QA
on:
  push:
    paths:
      - 'Research/B01-12/P17W08/TutorialFlow001/**'
      - '.github/workflows/b01-12-tutorialflow.yml'
  pull_request:
    paths:
      - 'Research/B01-12/P17W08/TutorialFlow001/**'
      - '.github/workflows/b01-12-tutorialflow.yml'
permissions:
  contents: read
jobs:
  research-source-only:
    name: Node + genuine headless Chromium (not Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated browser test prerequisites
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Replay pinned source-only reducer and browser cases
        working-directory: Research/B01-12/P17W08/TutorialFlow001
        run: |
          node test_engine.cjs
          python test_browser.py
