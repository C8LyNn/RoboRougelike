name: M01-012 Pneumatic Bolt Launcher Blender QA
on:
  push:
    branches: [feature/rrl-model-m01-012-pneumatic-bolt-launcher]
    paths:
      - 'Tools/ModelFactory/M01/M01-012/generate_m01_012.py'
      - 'Tools/ModelFactory/M01/M01-012/validate_m01_012.py'
      - 'Tools/ModelFactory/M01/M01-012/README.md'
      - '.github/workflows/ci-model-m01-012.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: model-m01-012-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-blender-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout isolated model branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Compile Blender generator and independent validator
        run: |
          python3 -m py_compile Tools/ModelFactory/M01/M01-012/generate_m01_012.py
          python3 -m py_compile Tools/ModelFactory/M01/M01-012/validate_m01_012.py
      - name: Install actual Blender
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy
          blender --version | head -n 2
      - name: Generate actual model, test manifold and sweep moving ram
        run: |
          blender -b --factory-startup --python-exit-code 1 \
            --python Tools/ModelFactory/M01/M01-012/generate_m01_012.py \
            -- --out /tmp/m01-012
      - name: Independently validate actual BLEND FBX GLB OBJ MTL
        run: python3 Tools/ModelFactory/M01/M01-012/validate_m01_012.py /tmp/m01-012
      - name: Publish real 3D exports to own model branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/rrl-model-m01-012-pneumatic-bolt-launcher'
        run: |
          set -euo pipefail
          dest=Tools/ModelFactory/M01/M01-012/generated
          mkdir -p "$dest"
          cp /tmp/m01-012/M01-012_pneumatic_bolt_launcher.blend "$dest/"
          cp /tmp/m01-012/M01-012_pneumatic_bolt_launcher_animated.glb "$dest/"
          cp /tmp/m01-012/M01-012_pneumatic_bolt_launcher_animated.fbx "$dest/"
          cp /tmp/m01-012/M01-012_pneumatic_bolt_launcher.obj "$dest/"
          cp /tmp/m01-012/M01-012_pneumatic_bolt_launcher.mtl "$dest/"
          cp /tmp/m01-012/M01-012_qa.json "$dest/"
          git add "$dest"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "asset(M01-012): real Blender exported 3D files and QA"
            for attempt in 1 2 3; do
              git fetch origin +refs/heads/feature/rrl-model-m01-012-pneumatic-bolt-launcher:refs/remotes/origin/feature/rrl-model-m01-012-pneumatic-bolt-launcher
              git rebase origin/feature/rrl-model-m01-012-pneumatic-bolt-launcher
              if git push origin HEAD:feature/rrl-model-m01-012-pneumatic-bolt-launcher; then
                echo "Actual M01-012 exports published to own branch"
                break
              fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - name: Upload actual 3D asset pack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: M01-012-pneumatic-bolt-launcher-3D
          path: |
            /tmp/m01-012/M01-012_pneumatic_bolt_launcher.blend
            /tmp/m01-012/M01-012_pneumatic_bolt_launcher_animated.glb
            /tmp/m01-012/M01-012_pneumatic_bolt_launcher_animated.fbx
            /tmp/m01-012/M01-012_pneumatic_bolt_launcher.obj
            /tmp/m01-012/M01-012_pneumatic_bolt_launcher.mtl
            /tmp/m01-012/M01-012_qa.json
          if-no-files-found: error
          retention-days: 30
