name: B01-61 PASS12 pinned Codex original-source static gate
on:
  push:
    branches: ['qa/b01-61-pass12-cross-feature']
  pull_request:
    paths: ['Tools/B01/B01-61-PASS12/**', 'Tools/B01/B01-61-PASS15/**', '.github/workflows/b01-61-pass12-static.yml']
permissions:
  contents: read
jobs:
  pin-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch exact public Codex PR 310 source
        run: |
          git fetch --no-tags --depth=1 origin refs/pull/310/head:refs/remotes/origin/b0161codex310
          test "$(git rev-parse refs/remotes/origin/b0161codex310)" = "231005c6d0351945a8ee6684f3856af118f0e94f"
      - name: Fetch exact original B01-25 LD02 data commit
        run: |
          git fetch --no-tags --depth=1 origin eecdc5ab9f20cad2f47dd7a139c9cb96981d0c3e
          git cat-file -e eecdc5ab9f20cad2f47dd7a139c9cb96981d0c3e^{commit}
      - name: Independently execute original-data LD02 wall geometry test (EXPECT P1 RED)
        run: |
          set +e
          python3 Tools/B01/B01-61-PASS15/ld02_perimeter_geometry_check.py --repo "$PWD" --require-closed
          code=$?
          set -e
          if test "$code" -ne 1; then
            echo "::error::Original LD02 geometry expected RED (1) but got $code: changed data or QA harness failure"
            exit 1
          fi
          echo "EXPECTED_PRODUCT_RED: four source-derived corner wall gaps; Unity PhysX NOT_RUN"
      - name: Fetch immutable original B01-25 new corner repair (reception only)
        run: |
          git fetch --no-tags --depth=1 origin f6d6886f45b1766f9b7a9c2975e1bd1deb3fdb84
          test "$(git rev-parse f6d6886f45b1766f9b7a9c2975e1bd1deb3fdb84:Research/B01-25/P14/LD02_ARENA.json)" = "e39e2f174984832bd97311c050e3c22fd6fb1175"
      - name: Receive owner data fix - 4 middle walls and 4 solid corner platforms
        run: |
          python3 Tools/B01/B01-61-PASS15/ld02_perimeter_geometry_check.py --repo "$PWD" --owner-fix --require-closed
          echo "B01-61_OWNER_REPAIR_RECEIVER=STATIC_GREEN | UNITY_NATIVE=NOT_RUN"
      - name: Check newly authored cover-choice Light and Heavy original source envelopes
        run: |
          python3 Tools/B01/B01-61-PASS15/ld02_cover_choice_vehicle_envelope.py --repo "$PWD"
      - name: Check 2 fixtures and original Git CSharp blobs (no Unity)
        run: python3 Tools/B01/B01-61-PASS12/verify.py --repo "$PWD"
      - name: Inspect REAL committed Codex NUnit XML (targeted cases only)
        run: |
          python3 Tools/B01/B01-61-PASS12/audit_original_nunit_xml.py --repo "$PWD" --sha 231005c6d0351945a8ee6684f3856af118f0e94f
      - name: Confirm full-suite release gate FAILS closed for targeted XML
        run: |
          if python3 Tools/B01/B01-61-PASS12/audit_original_nunit_xml.py --repo "$PWD" --sha 231005c6d0351945a8ee6684f3856af118f0e94f --require-full; then
            echo "::error::Targeted NUnit XML incorrectly accepted as complete release evidence"
            exit 1
          else
            echo "EXPECTED_BLOCK: no full-suite Unity/Player and explicit negative evidence"
          fi
