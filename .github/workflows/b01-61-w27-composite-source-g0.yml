name: B01-61 W27 exact 787 797 792 780 750 composite original Git-source transport G0
on:
  push:
    branches: [qa/b01-61-p17w27-composite-exact-g0-disposable]
  pull_request:
    paths:
      - 'Tools/B01/B01-61/P17W27CompositeExactG0/**'
      - '.github/workflows/b01-61-w27-composite-source-g0.yml'
permissions:
  contents: read
jobs:
  exact-composite-git-object-closure:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fetch only immutable chosen original producer source commits (no checkout or merge)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin d94400d95d13db7f27e1533df05c9292d5380431 33094f154c7b91119b36d58aab285e6e83c5de57 b8ca29c7707cd6b4338d0b9772d74dee676d49d2 f5db40bf293fe9582ec7c6fcb3515aeff6fcf937 2b7983f0f9e09dd1d56906b379a3f7af7b02f21a 16cb2a7b5158605b15191b6074f9e392e0d1ebd3 b4df10a7ad7e6c758f8331013f6b216b3a3689a3 60c73a6f9ed2585cbb9bf7aeaad8c62eef0629cb
      - name: Build immutable original five-PR Unity source/GUID/ABI intake manifest and safe scratch physical negative tests
        shell: bash
        run: |
          set -euo pipefail
          python Tools/B01/B01-61/P17W27CompositeExactG0/composite_intake.py --out dist/b0161-w27-original-exact
          python -c 'import pathlib,json; p=pathlib.Path("dist/b0161-w27-original-exact/SOURCE_RECEIPT.json"); r=json.loads(p.read_text()); assert r["source_transport_test"]=="PASS"; assert r["formal_combined_game_g0"].startswith("HOLD"); print("B0161_W27_DISPOSABLE_SOURCE_G0=PASS_COMPLETE_ORIGINAL_PROVENANCE")'
      - name: Compile and execute original immutable #797 real full-world plus #780 V7 economy combined CSharp9 tests
        shell: bash
        run: |
          set -euo pipefail
          src=Tools/B01/B01-62/P17W25WholeGameEconomyV7/.source
          mkdir -p "$src"
          git show b4df10a7ad7e6c758f8331013f6b216b3a3689a3:Assets/B01Packages/ECONAPPROVED007/Runtime/ApprovedEconomyPolicyV7.cs > "$src/ApprovedEconomyPolicyV7.cs"
          git show b4df10a7ad7e6c758f8331013f6b216b3a3689a3:Assets/B01Packages/ECONAPPROVED007/Runtime/CanonicalEconomySectionV7.cs > "$src/CanonicalEconomySectionV7.cs"
          test "$(git hash-object "$src/ApprovedEconomyPolicyV7.cs")" = 53ebce6c07388dc9c8a8ed79b6de4d3ccbee4773
          test "$(git hash-object "$src/CanonicalEconomySectionV7.cs")" = d8b71de91db36295b6220e9c4baad71eb54455f6
          dotnet run --project Tools/B01/B01-62/P17W25WholeGameEconomyV7/WholeGameEconomyV7QA.csproj -c Release --nologo 2>&1 | tee original-797-780-direct-source.log
      - name: SHA256 exact package and no duplicate raw writer source import guard
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import pathlib,json,hashlib; b=pathlib.Path("dist/b0161-w27-original-exact"); r=json.loads((b/"SOURCE_RECEIPT.json").read_text()); data=(b/"B0161_W27_EXACT_SOURCE_ONLY.zip").read_bytes(); assert hashlib.sha256(data).hexdigest()==r["sha256"]; assert r["referenced_only_files"]==2; assert r["native_unity_g1"]=="NOT_RUN"; print("B0161_W27_SELECTED_787_REFERENCE_ONLY_797_SINGLE_WRITER=PASS"); print("B0161_W27_INNER_ZIP_SHA256="+r["sha256"])'
      - name: Preserve original compiler stdout source packet manifest and OS scratch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0161-w27-composite-source-g0-${{ matrix.os }}
          path: |
            dist/b0161-w27-original-exact/**
            original-797-780-direct-source.log
          if-no-files-found: warn
