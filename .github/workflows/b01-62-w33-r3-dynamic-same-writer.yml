name: B01-62 W33 dynamic full R3 in original one file Save V3
on:
  push:
    branches: [b01-62/p17w33-r3-dynamic-same-writer]
  pull_request:
    paths:
      - 'Tools/B01/B01-62/P17W33R3World/**'
      - 'Tools/B01/B01-62/P17W28UnityCompatibleWholeGameV3/WholeGameEconomySlotV3.cs'
      - '.github/workflows/b01-62-w33-r3-dynamic-same-writer.yml'
permissions:
  contents: read
jobs:
  one-original-writer-full-r3:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin unchanged original game factory, frozen 556, V7 and B01-22 855 admission
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin a0282f2de0250d2a8fe421bbe182b4cb6fab2a11
          git fetch --no-tags --depth=1 origin 3bd9b159997924dcecb4e1cd1d41137896e5199e
          git fetch --no-tags --depth=1 origin b4df10a7ad7e6c758f8331013f6b216b3a3689a3
          git fetch --no-tags --depth=1 origin c9c19665a4f9385e6479f7151097deb797026ade
          mkdir -p Tools/B01/B01-62/P17W30AdmissionV3/.source Tools/B01/B01-62/P17W33R3World/.source b0162-w33-evidence
          git show 3bd9b159997924dcecb4e1cd1d41137896e5199e:Assets/R3/R3VehicleCatalog.cs > Tools/B01/B01-62/P17W33R3World/.source/R3VehicleCatalog.cs
          git show b4df10a7ad7e6c758f8331013f6b216b3a3689a3:Assets/B01Packages/ECONAPPROVED007/Runtime/ApprovedEconomyPolicyV7.cs > Tools/B01/B01-62/P17W30AdmissionV3/.source/ApprovedEconomyPolicyV7.cs
          git show b4df10a7ad7e6c758f8331013f6b216b3a3689a3:Assets/B01Packages/ECONAPPROVED007/Runtime/CanonicalEconomySectionV7.cs > Tools/B01/B01-62/P17W30AdmissionV3/.source/CanonicalEconomySectionV7.cs
          git show c9c19665a4f9385e6479f7151097deb797026ade:Assets/B01Packages/ECONADMISSIONW29/Runtime/EconomyV7AdmissionW29.cs > Tools/B01/B01-62/P17W30AdmissionV3/.source/EconomyV7AdmissionW29.cs
          python Tools/B01/B01-62/P17W33R3World/source_guard.py b0162-w33-evidence/scope.json | tee b0162-w33-evidence/source_guard.log
      - name: Actual ONE V3 production + R3 codec Csharp9 netstandard2.1 ABI
        run: |
          set -euo pipefail
          dotnet build Tools/B01/B01-62/P17W30AdmissionV3/W30UnityAbi.csproj -c Release -v quiet | tee b0162-w33-evidence/netstandard.log
          grep -q 'Build succeeded' b0162-w33-evidence/netstandard.log
      - name: Rerun actual ORIGINAL W28 9 single-writer OS regression cases
        run: |
          set -euo pipefail
          dotnet run --project Tools/B01/B01-62/P17W30AdmissionV3/W28OriginalRegression.csproj -c Release -v quiet | tee b0162-w33-evidence/w28.log
          grep -q 'W25_V7_GAME_ECON_ONE_ENVELOPE_SOURCE_TOTAL 9 PASS 9 FAIL 0' b0162-w33-evidence/w28.log
      - name: Rerun actual ORIGINAL W29 6 cold read OS regression cases
        run: |
          set -euo pipefail
          dotnet run --project Tools/B01/B01-62/P17W30AdmissionV3/W29ColdRegression.csproj -c Release -v quiet | tee b0162-w33-evidence/w29.log
          grep -q 'B0162_W29_COLD_READ_REAL_OS_TOTAL 6 PASS 6 FAIL 0' b0162-w33-evidence/w29.log
      - name: Rerun actual ORIGINAL W30 4 V7 admission regression cases
        run: |
          set -euo pipefail
          dotnet run --project Tools/B01/B01-62/P17W30AdmissionV3/W30AdmissionQA.csproj -c Release -v quiet | tee b0162-w33-evidence/w30.log
          grep -q 'B0162_W30_ADMISSION_SINGLE_WRITER_REAL_OS_TOTAL 4 PASS 4 FAIL 0' b0162-w33-evidence/w30.log
      - name: Rerun actual ORIGINAL W31 2 concurrent mutation regression cases
        run: |
          set -euo pipefail
          dotnet run --project Tools/B01/B01-62/P17W31AtomicPair/AtomicPairQA.csproj -c Release -v quiet | tee b0162-w33-evidence/w31.log
          grep -q 'B0162_W31_MUTABLE_INPUT_REAL_OS_TOTAL 2 PASS 2 FAIL 0' b0162-w33-evidence/w31.log
      - name: NEW actual current game R3 20 83 139 world+V7 physical OS file QA
        run: |
          set -euo pipefail
          dotnet run --project Tools/B01/B01-62/P17W33R3World/R3WorldActualOsQA.csproj -c Release -v quiet | tee b0162-w33-evidence/w33.log
          grep -q 'B0162_W33_R3_SAME_ONE_WRITER_REAL_OS_TOTAL 11 PASS 11 FAIL 0' b0162-w33-evidence/w33.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b0162-w33-one-writer-r3-${{ matrix.os }}
          path: b0162-w33-evidence/*
          if-no-files-found: warn
