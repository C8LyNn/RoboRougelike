name: B01-62 W25 Original exact 773 POSIX canonical path negative
on:
  push:
    branches: [qa/b01-62-p17w25-exact773-case-sensitive-path-original]
  pull_request:
    paths:
      - 'Tools/B01/B01-62/P17W25Original773CaseQA/**'
      - '.github/workflows/b01-62-w25-exact773-case-original.yml'
permissions:
  contents: read
jobs:
  real-os-original:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pin EXACT unchanged selected new #773 critical original source
        run: |
          set -euo pipefail
          test "$(git rev-parse 3aaaec4027ee246fbfb6f209179f0e9507363473:Tools/B01/B01-62/P17W24CanonicalPathFixR2/CanonicalSingleAuthorityStoreV3R2.cs)" = "3689238a16d706eda1bf4905cba8029cd2fe77aa"
          git diff --quiet 3aaaec4027ee246fbfb6f209179f0e9507363473 -- Tools/B01/B01-62/P17W24CanonicalPathFixR2 Assets/B0123CanonicalSaveApi001 Assets/B0123DetachedSaveContract001 Assets/B0123SecureReattachV2 Assets/B0123DebrisRepulse001
      - name: Compile original #773 real OS path alias source witness
        run: |
          set -euo pipefail
          mkdir -p b0162-w25-original-773-evidence
          dotnet run --project Tools/B01/B01-62/P17W25Original773CaseQA/Original773CaseQA.csproj -c Release --verbosity quiet | tee b0162-w25-original-773-evidence/original-source.txt
          grep -q 'W25_ORIGINAL_773_CASE_PATH_NEGATIVE 1 PASS 0 FAIL' b0162-w25-original-773-evidence/original-source.txt
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            grep -q 'W25_ORIGINAL_773_LINUX_CASE_ALIAS_WRITES_NONCANONICAL_SAVE=REPRODUCED' b0162-w25-original-773-evidence/original-source.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: b0162-w25-original-773-${{ matrix.os }}
          path: b0162-w25-original-773-evidence/*
          if-no-files-found: error
