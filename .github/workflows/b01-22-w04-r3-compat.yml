name: B01-22 W04 Exact R3 Compatibility
on:
  push:
    branches: ['b01-22/p17w04-ek-r3-compat-001']
  pull_request:
    paths:
      - 'Tools/B01/B01-22/EK-R3-COMPAT-001/**'
      - '.github/workflows/b01-22-w04-r3-compat.yml'
permissions:
  contents: read
jobs:
  verify-original-source:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: \${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen producer #333 data, read-only
        run: git fetch --no-tags --depth=1 origin 0d212a706c1e633b773d2e03b7b40c28bb63521b
      - name: Fetch original Codex R3/R4, read-only
        run: git fetch --no-tags --depth=1 origin aa7a917f177a9b1f07203868fb7d1d871eb3ee46
      - name: Fetch Codex #383 exact gameplay SHA, read-only
        run: git fetch --no-tags --depth=1 origin 203a0805251ed28293888e43f2d49f0df63767c6
      - name: 19 original Git object positive and negative tests
        run: python -m unittest discover -s Tools/B01/B01-22/EK-R3-COMPAT-001 -p test_compat_gate.py -v
      - name: Generate source compatibility receipt without game changes
        run: python Tools/B01/B01-22/EK-R3-COMPAT-001/compat_gate.py --repo .
