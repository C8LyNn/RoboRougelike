name: B01-25 W19 original counterbridge physical Unity source and CSharp9 regression
on:
  push:
    branches: [research/b01-25-p17w19-counterbridge001-r1]
    paths:
      - 'Assets/B0125CounterBridge001/**'
      - 'Assets/B0125CounterBridge001.meta'
      - 'Research/B01-25/P17/COUNTERBRIDGE001/**'
      - 'Tools/B01/B01-25/P17W19CounterBridge/**'
      - '.github/workflows/b01-25-w19-counterbridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SRC: Research/B01-25/P17/COUNTERBRIDGE001
      OUT: Tools/B01/B01-25/P17W19CounterBridge/.output
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile original CSharp9 netstandard2.1 source warnings errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SRC/.output" "$OUT"
          dotnet build "$SRC/CounterBridgeRuntime.csproj" -c Release -p:LangVersion=9.0 -warnaserror
      - name: Execute original mass torque angular stop and invalid sample behavior
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project "$SRC/CounterBridgeTests.csproj" -c Release -- "$SRC/.output/source-results.json" 2>&1 | tee "$OUT/behavior-$RUNNER_OS.log"
      - name: Test original Git bytes, Unity meta GUID and real physical scratch rollback
        shell: bash
        run: |
          set -euo pipefail
          python Tools/B01/B01-25/P17W19CounterBridge/check.py --out "$OUT/receipt.json" 2>&1 | tee "$OUT/qa-$RUNNER_OS.log"
      - name: Preflight real physical ZIP and source receipt
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUT/receipt.zip"
          test -s "$OUT/receipt.json"
          test -s "$SRC/.output/source-results.json"
          sha256sum "$OUT/receipt.zip"
      - name: Upload actual original source and QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-25-counterbridge-w19-${{ matrix.os }}
          path: |
            Research/B01-25/P17/COUNTERBRIDGE001/.output/source-results.json
            Tools/B01/B01-25/P17W19CounterBridge/.output/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 21
  cross-os-original-source-zip:
    needs: original-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: b01-25-counterbridge-w19-*
          path: evidence
      - name: Actual original Unity source ZIP independent byte parity
        shell: bash
        run: |
          set -euo pipefail
          A="$(find evidence/b01-25-counterbridge-w19-ubuntu-latest -name receipt.zip | head -n1)"
          B="$(find evidence/b01-25-counterbridge-w19-windows-latest -name receipt.zip | head -n1)"
          test -n "$A" && test -n "$B"
          test -s "$A" && test -s "$B"
          sha256sum "$A" "$B"
          cmp "$A" "$B"
          python - "$A" <<'PY'
          import json,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              files=z.namelist()
              assert len(files)==20 and len(set(files))==20
              assert all(f.create_system==3 for f in z.infolist())
              m=json.loads(z.read("PACKAGE_MANIFEST.json"))
              assert len(m["files"])==19 and m["nativeUnity"]=="NOT_RUN"
          print("COUNTERBRIDGE_ORIGINAL_UNITY_SOURCE_ZIP_PARITY_PASS")
          PY
