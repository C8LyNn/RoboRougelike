name: B01-23 W21 canonical #681 owned-stage V2 original source CI
on:
  push:
    branches: [b01-23/p17w21-canonical-api-owned-stage-v2]
  pull_request:
    paths:
      - 'Assets/B0123CanonicalSaveApi001/**'
      - 'Tools/B01/B01-23/P17W20CanonicalSaveApi001/**'
      - 'Tools/B01/B01-23/P17W21CanonicalOwnedStageV2/**'
      - '.github/workflows/b01-23-p17w21-canonical-owned-stage-v2.yml'
jobs:
  real-original-source:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Original #556 W06 source and NEW owned-stage C#9 lifecycle negative tests
        run: dotnet run --project Tools/B01/B01-23/P17W20CanonicalSaveApi001/CanonicalApiSourceTests.csproj -c Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source original Git physical ZIP and owned scratch rollback negatives
        run: python -m unittest discover -s Tools/B01/B01-23/P17W20CanonicalSaveApi001 -p test_package.py -v
      - name: Build original exact selected #681 V2 inner ZIP
        run: python Tools/B01/B01-23/P17W20CanonicalSaveApi001/package.py build --archive dist/B0123CanonicalStageV2_Original.zip
      - uses: actions/upload-artifact@v4
        with:
          name: b01-23-p17w21-canonical-stage-v2-${{ matrix.os }}
          path: dist/B0123CanonicalStageV2_Original.zip
          if-no-files-found: error
