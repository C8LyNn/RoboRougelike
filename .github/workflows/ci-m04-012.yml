name: M04-012 Rear Correction Aileron QA
on:
  push:
    branches: [feature/rrl-model-m04-012-rear-correction-aileron]
    paths:
      - 'Tools/ModelFactory/M04/M04-012/**'
      - '.github/workflows/ci-m04-012.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'Tools/ModelFactory/M04/M04-012/**'
      - '.github/workflows/ci-m04-012.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile and self-test source geometry
        run: |
          python3 -m py_compile Tools/ModelFactory/M04/M04-012/generate_m04_012.py
          python3 Tools/ModelFactory/M04/M04-012/generate_m04_012.py --self-test
      - name: Export OBJ MTL and validate independent QA
        run: |
          python3 Tools/ModelFactory/M04/M04-012/qa_m04_012.py
          python3 Tools/ModelFactory/M04/M04-012/generate_m04_012.py --static-obj --out build/M04-012
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: M04-012-static-OBJ-MTL-manifest
          path: build/M04-012/
          if-no-files-found: error
          retention-days: 30
  blender-animation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version | head -2
      - name: Run bpy and export BLEND plus animated GLB
        run: |
          blender -b --factory-startup --python-exit-code 1 --python \
            Tools/ModelFactory/M04/M04-012/generate_m04_012.py -- \
            --out build/M04-012
      - name: Independently validate GLB animation
        run: |
          python3 Tools/ModelFactory/M04/M04-012/qa_m04_012.py \
            --check-glb build/M04-012/M04-012_rear_correction_aileron.glb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: M04-012-Blender-animated-GLB
          path: build/M04-012/
          if-no-files-found: error
          retention-days: 30
