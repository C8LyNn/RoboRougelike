name: B01-10 P17W28 Exact V7 Loaner Reachability
on:
  push:
    paths:
      - 'Research/B01-10/P17/W28_LOANER_REACHABILITY_001/**'
      - '.github/workflows/b01-10-p17w28-v7-loaner-reachability.yml'
  pull_request:
    paths:
      - 'Research/B01-10/P17/W28_LOANER_REACHABILITY_001/**'
      - '.github/workflows/b01-10-p17w28-v7-loaner-reachability.yml'
permissions:
  contents: read
jobs:
  actual-original-v7-conditional-reachability:
    name: original-v7-reachability-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact FIVE own source Git blobs and SIX W28 only diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          p="Research/B01-10/P17/W28_LOANER_REACHABILITY_001/"
          m=json.load(open(p+"manifest.json",encoding="utf-8"))
          assert len(m["sourceFiles"])==5
          for path,expected in m["sourceFiles"].items():
              assert os.stat(path).st_size==expected["bytes"],path
              assert subprocess.check_output(["git","hash-object",path],text=True).strip()==expected["gitBlob"],path
          old=m["previousW27Head"]
          subprocess.run(["git","fetch","--no-tags","origin",old],check=True,stdout=subprocess.DEVNULL)
          changed=subprocess.check_output(["git","diff","--name-only",old,"HEAD"],text=True).splitlines()
          assert sorted(changed)==sorted(list(m["sourceFiles"])+[p+"manifest.json"]),changed
          print("W28_OWN_SOURCE_PINS_5_PASS W28_EXACT_W27_SCOPE_6_PASS")
          PY
      - name: Pin original B01-22 V7 real policy and original binary codec
        shell: bash
        run: |
          set -euo pipefail
          owner=b4df10a7ad7e6c758f8331013f6b216b3a3689a3
          git fetch --no-tags origin "$owner"
          git show "$owner:Assets/B01Packages/ECONAPPROVED007/Runtime/ApprovedEconomyPolicyV7.cs" > "$RUNNER_TEMP/actual-v7-policy.cs"
          git show "$owner:Assets/B01Packages/ECONAPPROVED007/Runtime/CanonicalEconomySectionV7.cs" > "$RUNNER_TEMP/actual-v7-section.cs"
          test "$(git hash-object "$RUNNER_TEMP/actual-v7-policy.cs")" = 53ebce6c07388dc9c8a8ed79b6de4d3ccbee4773
          test "$(git hash-object "$RUNNER_TEMP/actual-v7-section.cs")" = d8b71de91db36295b6220e9c4baad71eb54455f6
          echo "W28_REAL_OWNER_V7_BLOBS_2_PASS"
      - name: Actual original V7 cash/free threshold + one-loaner reachability
        shell: bash
        run: |
          set -euo pipefail
          dotnet run -c Release --project Research/B01-10/P17/W28_LOANER_REACHABILITY_001/LoanerReachability.csproj -p:ExactPolicy="$RUNNER_TEMP/actual-v7-policy.cs" -p:ExactSection="$RUNNER_TEMP/actual-v7-section.cs" > "$RUNNER_TEMP/w28-loaner-reachability.log" 2>&1 || { cat "$RUNNER_TEMP/w28-loaner-reachability.log"; exit 1; }
          cat "$RUNNER_TEMP/w28-loaner-reachability.log"
          grep -F "W28_C1_PRICE1_CASH0_PAID0_LOANER_WIN RECOVERABLE_SOURCE PASS" "$RUNNER_TEMP/w28-loaner-reachability.log"
          grep -F "W28_C_NO_EPOCH0_CLAIM" "$RUNNER_TEMP/w28-loaner-reachability.log"
          grep -F "W28_ORIGINAL_V7_REACHABILITY_SUITE_PASS cases=6" "$RUNNER_TEMP/w28-loaner-reachability.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b01-10-w28-original-v7-reachability-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/w28-loaner-reachability.log
          if-no-files-found: warn
          retention-days: 14
