name: B01-13 W27 Real Playtest Observer Source + Chromium
on:
  push:
    paths:
      - 'Research/B01-13/P17W27/**'
      - '.github/workflows/b01-13-w27-human-observation.yml'
  pull_request:
    paths:
      - 'Research/B01-13/P17W27/**'
      - '.github/workflows/b01-13-w27-human-observation.yml'
  workflow_dispatch:
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original immutable source SHA and bytes
        run: python Research/B01-13/P17W27/verify_package.py
      - name: Run actual original Node operator tests
        run: node --test Research/B01-13/P17W27/test_observer.mjs
      - name: Generate isolated real offline study HTML and hash bytes
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'b01-13-w27-human-observer.html'
          node Research/B01-13/P17W27/observer.mjs --output $out
          if ($LASTEXITCODE -ne 0) { throw 'HTML_GENERATOR_FAILED' }
          Write-Output ('OBSERVER_HTML_SHA256=' + (Get-FileHash -Algorithm SHA256 $out).Hash.ToLowerInvariant())
      - uses: actions/upload-artifact@v4
        with:
          name: B01-13-W27-OBSERVER-${{ matrix.os }}-Node${{ matrix.node }}
          path: ${{ runner.temp }}/b01-13-w27-human-observer.html
          if-no-files-found: error
          retention-days: 14
  chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real browser runtime
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Verify source pins
        run: python Research/B01-13/P17W27/verify_package.py
      - name: Generate real HTML in isolated runner temp
        run: node Research/B01-13/P17W27/observer.mjs --output "$RUNNER_TEMP/b01-13-w27-human-observer.html"
      - name: Execute original real Chromium operator form and actual CSV/JSON download
        run: python Research/B01-13/P17W27/browser_test.py "$RUNNER_TEMP/b01-13-w27-human-observer.html"
      - uses: actions/upload-artifact@v4
        with:
          name: B01-13-W27-REAL-CHROMIUM-HTML
          path: ${{ runner.temp }}/b01-13-w27-human-observer.html
          if-no-files-found: error
          retention-days: 14
