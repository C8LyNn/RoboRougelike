name: B01-13 W31 Player Archive + Session Integrity R3
on:
  push:
    paths:
      - 'Research/B01-13/P17W28/**'
      - '.github/workflows/b01-13-w28-evidence-intake.yml'
  pull_request:
    paths:
      - 'Research/B01-13/P17W28/**'
      - '.github/workflows/b01-13-w28-evidence-intake.yml'
  workflow_dispatch:
jobs:
  original-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact original Git blob and UTF8 byte manifest
        run: python Research/B01-13/P17W28/verify_package.py
      - name: Execute 63 actual W31 regression tests incl 66 MiB ZIP
        run: python -m unittest -v Research/B01-13/P17W28/test_playtest_intake.py
      - name: Create physical empty result template and hash
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'w29-response-template.json'
          python Research/B01-13/P17W28/playtest_intake.py --game-commit aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --make-template $out
          if ($LASTEXITCODE -ne 0) { throw 'W29_GENERATOR_FAILED' }
          Write-Output ('W29_TEMPLATE_SHA256=' + (Get-FileHash -Algorithm SHA256 $out).Hash.ToLowerInvariant())
      - uses: actions/upload-artifact@v4
        with:
          name: B01-13-W31-EMPTY-TEMPLATE-${{ matrix.os }}-Py${{ matrix.python-version }}
          path: ${{ runner.temp }}/w29-response-template.json
          if-no-files-found: error
          retention-days: 14
