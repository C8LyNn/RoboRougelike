name: B01-11 W21 Camera Visibility Lab source QA
on:
  push:
    branches: ['research/b01-11-p17w21-camera-visibility-lab-001']
  pull_request:
    paths:
      - 'Research/B01-11/P17/W21-CAMERA-VISIBILITY-LAB-001/**'
      - '.github/workflows/b01-11-p17w21-camera-visibility-lab-001.yml'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check Research/B01-11/P17/W21-CAMERA-VISIBILITY-LAB-001/visibility.js
      - run: node --test Research/B01-11/P17/W21-CAMERA-VISIBILITY-LAB-001/test_visibility.cjs
