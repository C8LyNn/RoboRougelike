name: B01-12 TACTICAL-PING-001 original-source QA
on:
  pull_request:
    paths:
      - 'Research/B01-12/P17W18/TacticalPing001/**'
      - '.github/workflows/b01-12-tactical-ping.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Execute SHA-pinned original Node and Chromium
        working-directory: Research/B01-12/P17W18/TacticalPing001
        run: |
          node test_engine.cjs
          python test_browser.py
      - name: Confirm corrupted original copy fails closed in both runners
        working-directory: Research/B01-12/P17W18/TacticalPing001
        run: |
          set -eu
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cp demo.html ping_engine.js ui.js test_engine.cjs test_browser.py manifest.json "$tmp/"
          printf '\n' >> "$tmp/ui.js"
          set +e
          (cd "$tmp" && node test_engine.cjs) > /tmp/ping-node-neg.log 2>&1
          node_rc=$?
          (cd "$tmp" && python test_browser.py) > /tmp/ping-py-neg.log 2>&1
          py_rc=$?
          set -e
          cat /tmp/ping-node-neg.log /tmp/ping-py-neg.log
          test "$node_rc" -eq 2
          test "$py_rc" -eq 2
          grep -q FAIL_CLOSED /tmp/ping-node-neg.log
          grep -q FAIL_CLOSED /tmp/ping-py-neg.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b01-12-tactical-ping-source-evidence
          path: |
            Research/B01-12/P17W18/TacticalPing001/node-results.json
            Research/B01-12/P17W18/TacticalPing001/browser-results.json
            Research/B01-12/P17W18/TacticalPing001/evidence-1280x720.png
          if-no-files-found: warn
