name: B01-13 AIM-VAULT original-source QA
on:
  push:
    branches:
      - research/b01-13-pass17-wave03-aim-vault
    paths:
      - Research/B01-13/P17C/**
      - .github/workflows/b01-13-p17w03-aimvault.yml
  pull_request:
    paths:
      - Research/B01-13/P17C/**
      - .github/workflows/b01-13-p17w03-aimvault.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }} exact original source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable original AIM-DELTA R2 dependency
        uses: actions/checkout@v4
        with:
          ref: 8b504152f2c4d170640ea824ee57a9b1ec51829c
          path: .b01-13-upstream
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pin all three executable Git source identities
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          def check(path, blob=None, digest=None):
              b=Path(path).read_bytes()
              got_blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              got_sha=hashlib.sha256(b).hexdigest()
              if blob is not None: assert got_blob==blob, (path,got_blob)
              if digest is not None: assert got_sha==digest, (path,got_sha)
              print('SOURCE_PIN_PASS',path,len(b),got_blob,got_sha)
          check('Research/B01-13/P17/verify_aim_receipt.py','70f93467fef1d5782ec4e5cbd6a8a98af6fd0b00','8e6cd46bc5f1229b54e565a1b74ea9387d27073d463f61268809f212a9e2ddf4')
          check('.b01-13-upstream/Research/B01-13/P17B/aim_delta.py','8825e21d73fc9e735c17f9d2a05254a5bac9b810')
          check('.b01-13-upstream/Research/B01-13/P17B/test_windows_atomic_publish.py','edff3430c725a8fb9f64691c350fbafb58b3bf13')
          check('Research/B01-13/P17C/aim_evidence_vault.py','7937b0a37e7c3038d571860e15d0a40710331948','4273a7ad73046a62c5ebba33a3342b980d7f823a09708d289cad21e98802f615')
          check('Research/B01-13/P17C/test_aim_evidence_vault.py','81e190f4568d98bf0ab06065b8ea8a42d07e158f')
          check('Research/B01-13/P17C/test_private_root_location.py','664efd3cb8f52fbd31165ee8422f2f9222b8bf3b')
      - name: Stage exact upstream dependency without source edits
        shell: python
        run: |
          from pathlib import Path
          src=Path('.b01-13-upstream/Research/B01-13/P17B/aim_delta.py')
          dest=Path('Research/B01-13/P17B/aim_delta.py')
          dest.parent.mkdir(parents=True,exist_ok=True)
          assert not dest.exists(), 'Upstream unexpectedly present; refuse overwrite'
          dest.write_bytes(src.read_bytes())
          Path('Research/B01-13/P17B/test_windows_atomic_publish.py').write_bytes(Path('.b01-13-upstream/Research/B01-13/P17B/test_windows_atomic_publish.py').read_bytes())
      - name: Install source-only image decoder
        run: python -m pip install --disable-pip-version-check pillow
      - name: Compile original code and complete regression suite
        run: python -m py_compile Research/B01-13/P17C/aim_evidence_vault.py Research/B01-13/P17C/test_aim_evidence_vault.py Research/B01-13/P17C/test_private_root_location.py
      - name: Execute 6 Windows publication safety regressions on AIM-DELTA R3
        run: python Research/B01-13/P17B/test_windows_atomic_publish.py
      - name: Execute 33 physical evidence lifecycle tests on CURRENT R2
        run: python Research/B01-13/P17C/test_aim_evidence_vault.py
      - name: Execute 4 private-root safety regressions on CURRENT R2
        run: python Research/B01-13/P17C/test_private_root_location.py
