name: B01-40 W21 ORIGINAL R5 #690 exact Git physical source G0 and strict migration
on:
  push:
    branches: [qa/b01-40-p17w21-r5-690-exact-physical-g0]
    paths: ['Tools/B01/B01-40/P17W21R5ExactG0/**', '.github/workflows/b01-40-p17w21-r5-690-physical-g0.yml']
  pull_request:
    paths: ['Tools/B01/B01-40/P17W21R5ExactG0/**', '.github/workflows/b01-40-p17w21-r5-690-physical-g0.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  physical-original-author-zip-and-source-only-rollback:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          path: own
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          path: selected
          ref: cc7f73541517a18f4479bb155534bd4832d9985e
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: frozen_r4
          ref: 09c1809b73324a6d31c13e5d0143de62ac1e3ca6
      - uses: actions/checkout@v4
        with:
          path: loser_r4
          ref: ae5dbfa5e9c4689d2bf80fcabf8438e9c673c419
      - uses: actions/checkout@v4
        with:
          path: loser_r3
          ref: d9b95146e46a5d81d5a291d7887e456164f4d0c2
      - uses: actions/checkout@v4
        with:
          path: r2
          ref: efb2b06eafedab5469b57f163152d96aca3c5915
      - uses: actions/checkout@v4
        with:
          path: alt604
          ref: 1aa8a59ce1bb4fcd998f0b2b1ce25dfaea333f0a
      - uses: actions/checkout@v4
        with:
          path: game
          ref: d94400d95d13db7f27e1533df05c9292d5380431
      - uses: actions/checkout@v4
        with:
          path: save
          ref: 33094f154c7b91119b36d58aab285e6e83c5de57
      - uses: actions/checkout@v4
        with:
          path: safe
          ref: 3b743acc52bb44ae6a50af56ed9aca46d22821a7
      - uses: actions/checkout@v4
        with:
          path: oldg0
          ref: 180849791c4b9594b12f26ef8d9dc0cf90adb61c
      - uses: actions/checkout@v4
        with:
          path: guidfence
          ref: 547b55560d1a33af182caeaf73f9a9b2d8b1b7fe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact ORIGINAL #690 author package build and independent real disposable stage and rollback
        shell: bash
        run: |
          set -euo pipefail
          python own/Tools/B01/B01-40/P17W21R5ExactG0/intake.py \
            --selected selected --frozen_r4 frozen_r4 --loser_r4 loser_r4 --loser_r3 loser_r3 \
            --r2 r2 --alt604 alt604 --game game --save save --safe safe --oldg0 oldg0 \
            --guidfence guidfence --output evidence | tee r5-original-source.log
          grep -q 'B0140_W21_R5_690_EXACT_SOURCE' r5-original-source.log
          grep -q 'B0140_W21_ORIGINAL_R5_690_PHYSICAL' r5-original-source.log
          grep -q 'B0140_W21_SAFE_SCRATCH_R5_690_MIGRATION' r5-original-source.log
          grep -q 'B0140_W21_R5_PHYSICAL_G0_PASS_FORMAL_SECURITY_HOLD_NATIVE_NOT_RUN_NO_MERGE' r5-original-source.log
          test -s evidence/r5-690-physical-g0-hold.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B01-40-W21-R5-690-OriginalPhysical-${{ matrix.os }}
          path: |
            evidence/r5-690-physical-g0-hold.json
            r5-original-source.log
          retention-days: 21
          if-no-files-found: warn
