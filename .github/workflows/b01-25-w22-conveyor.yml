name: B01-25 W22 original CONVEYOR source CSharp9 physical QA
on:
  push:
    branches: [research/b01-25-p17w22-conveyor001-r1]
    paths:
      - 'Assets/B0125Conveyor001/**'
      - 'Assets/B0125Conveyor001.meta'
      - 'Research/B01-25/P17/CONVEYOR001/**'
      - 'Tools/B01/B01-25/P17W22Conveyor/**'
      - '.github/workflows/b01-25-w22-conveyor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SRC: Research/B01-25/P17/CONVEYOR001
      OUT: Tools/B01/B01-25/P17W22Conveyor/.output
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile original actual CSharp9 Unity-portable source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SRC/.output" "$OUT"
          dotnet build "$SRC/ConveyorRuntime.csproj" -c Release -p:LangVersion=9.0 -warnaserror
      - name: Execute original two-mass physical-velocity conveyor mechanics and negatives
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project "$SRC/ConveyorTests.csproj" -c Release -- "$SRC/.output/results.json" 2>&1 | tee "$OUT/actual-csharp-$RUNNER_OS.log"
      - name: Execute original Git blobs, stable Unity GUIDs, scratch receipt and rollback
        shell: bash
        run: |
          set -euo pipefail
          python Tools/B01/B01-25/P17W22Conveyor/check.py --out "$OUT/receipt.json" 2>&1 | tee "$OUT/qa-$RUNNER_OS.log"
      - name: Prove original Unity source ZIP and machine receipts truly exist
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUT/receipt.zip"
          test -s "$OUT/receipt.json"
          test -s "$SRC/.output/results.json"
          sha256sum "$OUT/receipt.zip"
      - name: Upload original exact Git source ZIP, logs, and JSON receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-25-conveyor-w22-${{ matrix.os }}
          path: |
            Research/B01-25/P17/CONVEYOR001/.output/results.json
            Tools/B01/B01-25/P17W22Conveyor/.output/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 21
  physical-original-zip-parity:
    needs: original-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: b01-25-conveyor-w22-*
          path: evidence
      - name: Independent downloaded physical source ZIP sha256sum and byte cmp
        shell: bash
        run: |
          set -euo pipefail
          A="$(find evidence/b01-25-conveyor-w22-ubuntu-latest -name receipt.zip | head -n1)"
          B="$(find evidence/b01-25-conveyor-w22-windows-latest -name receipt.zip | head -n1)"
          test -n "$A" && test -n "$B"
          test -s "$A" && test -s "$B"
          sha256sum "$A" "$B"
          cmp "$A" "$B"
          python - "$A" <<'PY'
          import json,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              assert len(names)==20 and len(set(names))==20
              assert all(x.create_system==3 for x in z.infolist())
              m=json.loads(z.read("PACKAGE_MANIFEST.json"))
              assert len(m["files"])==19 and m["nativeUnity"]=="NOT_RUN"
          print("CONVEYOR_ORIGINAL_UNITY_SOURCE_ZIP_PARITY_PASS")
          PY
