name: B01-23 W22 selected #691 v3 mandatory physical owner lease
on:
  push:
    branches: ['b01-23/p17w22-selected691-lifetime-authority-v3']
  pull_request:
    paths:
      - 'Assets/B0123CanonicalSaveApi001/**'
      - 'Tools/B01/B01-23/P17W20CanonicalSaveApi001/**'
      - 'Tools/B01/B01-23/P17W22CanonicalExclusiveV3/**'
      - '.github/workflows/b01-23-p17w22-canonical-exclusive-v3.yml'
jobs:
  original-selected-v3-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, windows-2025]}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: REAL frozen #556/W06 and selected #691 original core plus new v3
        run: dotnet run --project Tools/B01/B01-23/P17W20CanonicalSaveApi001/CanonicalApiSourceTests.csproj -c Release
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: True Git original provenance and safe scratch/rollback negatives
        run: python -m unittest discover -s Tools/B01/B01-23/P17W20CanonicalSaveApi001 -p test_package.py -v
      - name: Export exact ORIGINAL v3 physical SOURCE ZIP
        run: python Tools/B01/B01-23/P17W20CanonicalSaveApi001/package.py build --archive dist/B0123CanonicalOwnerV3Original.zip
      - uses: actions/upload-artifact@v4
        with:
          name: b01-23-w22-selected-v3-${{ matrix.os }}
          path: dist/B0123CanonicalOwnerV3Original.zip
          if-no-files-found: error
