name: B01-11 P17 W12 UXCAPTION original CSharp
on:
  push:
    branches:
      - research/b01-11-p17-w12-uxcaption-001
  pull_request:
    paths:
      - 'Research/B01-11/P17/W12-UXCAPTION-001/**'
      - '.github/workflows/b01-11-uxcaption-w12.yml'
permissions:
  contents: read
jobs:
  original-csharp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run original accessibility captions CSharp
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet run --project Research/B01-11/P17/W12-UXCAPTION-001/Tests/UXCaptionTests.csproj --configuration Release --no-launch-profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
