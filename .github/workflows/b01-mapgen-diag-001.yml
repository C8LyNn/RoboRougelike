name: B01-21 MAPGEN-DIAG-001 independent W11 differential
on:
  push:
    branches:
      - "diag/b01-21-mapgen-diag-001-20261025"
    paths:
      - "Tools/B01/MAPGEN-DIAG-001/**"
      - "Docs/B01/MAPGEN-DIAG-001/**"
      - ".github/workflows/b01-mapgen-diag-001.yml"
  pull_request:
    paths:
      - "Tools/B01/MAPGEN-DIAG-001/**"
      - "Docs/B01/MAPGEN-DIAG-001/**"
      - ".github/workflows/b01-mapgen-diag-001.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w11-pinned-source-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify pinned R3.2 and fetch immutable R3.3 for read-only comparisons
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 003bced54480d509ffc0d49d26daf87160a8d609 HEAD
          git cat-file -e 003bced54480d509ffc0d49d26daf87160a8d609^{commit}
          git cat-file -e 7334f3b1d8cd3a976098faa4e683f4de3d9a592f^{commit} || git fetch --no-tags origin 7334f3b1d8cd3a976098faa4e683f4de3d9a592f
          git cat-file -e 7334f3b1d8cd3a976098faa4e683f4de3d9a592f^{commit}
          git rev-parse HEAD > w11-source-branch-sha.txt
          echo "W11_PINNED_REVISIONS=READY"
      - name: Execute 2 real frozen CSharp source builds and per-case differential (NOT UNITY)
        shell: bash
        run: |
          set -o pipefail
          python Tools/B01/MAPGEN-DIAG-001/w11_compare.py "$PWD/w11-mapgen-diff-evidence" | tee w11-mapgen-diff-console.log
      - name: Save full per-case differential, snapshots, logs and exact branch SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-21-w11-mapgen-r32-vs-r33-source-evidence
          path: |
            w11-mapgen-diff-evidence/
            w11-mapgen-diff-console.log
            w11-source-branch-sha.txt
          if-no-files-found: warn
          retention-days: 30
