name: B01 MAPGEN R3.4.1 isolated source CSharp QA
on:
  push:
    branches:
      - fix/b01-mapgen001-w12-r341-material-gettag-20261025
    paths:
      - "Assets/B01Packages/MAPGEN001/**"
      - "Tools/B01/MAPGEN001/**"
      - "Docs/B01/MAPGEN001/**"
      - ".github/workflows/b01-mapgen-r32-source-csharp.yml"
  pull_request:
    paths:
      - "Assets/B01Packages/MAPGEN001/**"
      - "Tools/B01/MAPGEN001/**"
      - "Docs/B01/MAPGEN001/**"
      - ".github/workflows/b01-mapgen-r32-source-csharp.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dotnet-real-planner-not-unity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Prevent duplicate TestRunner references in both Unity asmdefs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for kind in ["EditMode","PlayMode"]:
              p=Path("Assets/B01Packages/MAPGEN001/Tests")/kind/("B01.MAPGEN001."+kind+"Tests.asmdef")
              a=json.loads(p.read_text(encoding="utf8"))
              refs=a["references"]
              assert refs==["B01.MAPGEN001.Runtime"], (p,refs)
              assert a["optionalUnityReferences"]==["TestAssemblies"], (p,a)
          print("MAPGEN_ASMDEF_DUPLICATE_REFS_STATIC=PASS")
          PY
      - name: Verify 12 distinct Unity cube case IDs (static source contract only)
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path("Assets/B01Packages/MAPGEN001/Tests/PlayMode/MapGenPhysicalTraversalTests.cs")
          src=path.read_text()
          ids=re.findall(r'\[UnityTest\]\s*public IEnumerator (\w+)_CubePhysics\(\)',src)
          assert len(ids)==12 and len(set(ids))==12,(len(ids),ids)
          assert "LightAndHeavyRigidbodyDriveThreeSeedsForBothRecipes" not in src
          print("12/12 SOURCE-DEFINED independently executable UnityTest cases verified; Unity execution NOT_RUN")
          PY
      - name: Verify R3.4.1 Unity API regression and R3.4 URP/cube contracts
        run: python Tools/B01/MAPGEN001/check_w12_contract.py
      - name: Compile and execute exact MAPGEN planner & route validator CSharp
        run: dotnet run --project Tools/B01/MAPGEN001/Headless/MapGen.Headless.csproj --configuration Release -- headless-mapgen-evidence
      - name: Verify manifest and build full R3.4.1 ZIP
        shell: bash
        run: |
          set -euo pipefail
          if python -c "import json; assert json.load(open('Docs/B01/MAPGEN001/manifest.json'))['revision']=='R3.4.1'"; then
            python Tools/B01/MAPGEN001/package_gate.py --verify-zip
          else
            python Tools/B01/MAPGEN001/package_gate.py --emit
          fi
      - name: Archive signed-source ZIP and verified manifest receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-mapgen-r341-source-zip
          path: mapgen-r341-evidence/
          if-no-files-found: ignore
          retention-days: 21
      - name: Archive all seed case outcomes (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-mapgen-r341-source-csharp-cases
          path: headless-mapgen-evidence/
          retention-days: 21
