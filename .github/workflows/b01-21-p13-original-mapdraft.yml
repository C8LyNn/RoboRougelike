name: B01-21 PASS13 Original MapDraft CSharp (NOT Unity)
on:
  push:
    branches: [qa/b01-21-p13-mapdraft-original-csharp]
  workflow_dispatch:
jobs:
  source_csharp_only:
    name: Original CSharp with Unity shim / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pin exact original Codex and B01-25 revisions, extract immutable Git objects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $codex = '231005c6d0351945a8ee6684f3856af118f0e94f'
          $research = '758662782acd92026b39b09a60d92b7e587a34f9'
          git fetch --no-tags --depth=1 origin refs/pull/310/head
          if ($LASTEXITCODE -ne 0 -or (git rev-parse FETCH_HEAD).Trim() -ne $codex) { throw 'CODEX HEAD MOVED OR FETCH FAILED -- FAIL CLOSED' }
          git fetch --no-tags --depth=30 origin refs/heads/research/b01-25-p11-level-fixtures
          if ($LASTEXITCODE -ne 0) { throw 'B01-25 RESEARCH FETCH FAILED' }
          git cat-file -e "${research}^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'PINNED B01-25 HISTORIC COMMIT UNREACHABLE -- FAIL CLOSED' }
          $expect = @{
            'Assets/MapEditor/MapDraft.cs' = 'b5f8f395f93972c0ede000701dbbada8fcfcdfdb'
          }
          foreach ($path in $expect.Keys) {
            $blob = (git rev-parse "${codex}:$path").Trim()
            if ($LASTEXITCODE -ne 0 -or $blob -ne $expect[$path]) { throw "WRONG ORIGINAL CODEX BLOB: $path $blob" }
          }
          $mapPath = Join-Path $env:RUNNER_TEMP 'b0121-mapdraft.zip'
          git archive --format=zip --output="$mapPath" $codex Assets/MapEditor/MapDraft.cs
          if ($LASTEXITCODE -ne 0) { throw 'Original CSharp archive failed' }
          Expand-Archive -LiteralPath "$mapPath" -DestinationPath . -Force
          $actual = (git hash-object Assets/MapEditor/MapDraft.cs).Trim()
          if ($actual -ne $expect['Assets/MapEditor/MapDraft.cs']) { throw 'Extracted original CSharp changed!' }
          $entries = @(
            'Research/B01-25/P11/LD01.json',
            'Research/B01-25/P11/LD02.json',
            'Research/B01-25/P11/LD03.json',
            'Research/B01-25/P12/LD01_NEG.json',
            'Research/B01-25/P12/LD02_NEG.json',
            'Research/B01-25/P12/LD03_NEG.json'
          )
          $inputZip = Join-Path $env:RUNNER_TEMP 'b0121-b25-inputs.zip'
          git archive --format=zip --output="$inputZip" $research -- $entries
          if ($LASTEXITCODE -ne 0) { throw 'Original B01-25 fixtures archive failed' }
          Expand-Archive -LiteralPath "$inputZip" -DestinationPath . -Force
          $expectedBlobs = @{
            'Research/B01-25/P11/LD01.json' = '85b575691f25520d85f2caf9718d74b881ff32b3'
            'Research/B01-25/P11/LD02.json' = '71c305077b97015a3a4dad7a5fc64dea59943617'
            'Research/B01-25/P11/LD03.json' = '94b8af8f1b212fa89a90508e7b3e5a46667fa662'
            'Research/B01-25/P12/LD01_NEG.json' = 'c32a44fee5b041e0b0021071a13065f5db979ab8'
            'Research/B01-25/P12/LD02_NEG.json' = '5d4af877f3d45d7e26619922bc2b46538a0d06cd'
            'Research/B01-25/P12/LD03_NEG.json' = 'c9cf54c663b675f8b70f0494410a67082bbc8640'
          }
          foreach ($path in $entries) {
            $blob = (git hash-object "$path").Trim()
            if ($LASTEXITCODE -ne 0 -or $blob -ne $expectedBlobs[$path]) { throw "WRONG B01-25 ORIGINAL FIXTURE: $path $blob" }
          }
          $fixtureCommit = '01c0a267a13c97da7cc5e74d20a6222624d44230'
          $fixtureFile = 'Research/B01-21/P14/CV05_D06_GlobalFloor_2000Ground.json'
          $fixtureBlob = '4a8efed0b4dc688cb4cb541868f61fbf5500c446'
          git fetch --no-tags --depth=30 origin refs/heads/research/b01-21-p14-cv05-d06-fixture
          if ($LASTEXITCODE -ne 0) { throw 'CV05 fixture branch fetch failed' }
          git cat-file -e "${fixtureCommit}^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'CV05 immutable fixture commit unavailable' }
          $repoBlob = (git rev-parse "${fixtureCommit}:$fixtureFile").Trim()
          if ($LASTEXITCODE -ne 0 -or $repoBlob -ne $fixtureBlob) { throw 'CV05 wrong pinned fixture Git blob' }
          $fixtureZip = Join-Path $env:RUNNER_TEMP 'b0121-cv05-d06.zip'
          git archive --format=zip --output="$fixtureZip" $fixtureCommit -- $fixtureFile
          if ($LASTEXITCODE -ne 0) { throw 'CV05 exact fixture archive failure' }
          Expand-Archive -LiteralPath "$fixtureZip" -DestinationPath . -Force
          $extractedBlob = (git hash-object "$fixtureFile").Trim()
          if ($LASTEXITCODE -ne 0 -or $extractedBlob -ne $fixtureBlob) { throw 'CV05 actual fixture byte mutation' }
          Write-Output 'EXACT PUBLISHED CV-05 D06 ORIGINAL 2000-GROUND JSON FILE GIT BLOB VERIFIED'
          $arenaCommit = 'eecdc5ab9f20cad2f47dd7a139c9cb96981d0c3e'
          $arenaPath = 'Research/B01-25/P14/LD02_ARENA.json'
          $arenaBlob = '6de0d04900a69606ba873f7c29cef75ed6f182cd'
          $worldBlob = (git rev-parse "${codex}:Assets/MapEditor/MapWorld.cs").Trim()
          if ($LASTEXITCODE -ne 0 -or $worldBlob -ne '8928908db123b35dcab4b324fe9d3a7a8fceee4e') { throw 'CODEX MAPWORLD PHYSICAL SHAPE SOURCE CHANGED' }
          git cat-file -e "${arenaCommit}^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'B01-25 P14 ARENA immutable source commit unavailable' }
          if ((git rev-parse "${arenaCommit}:$arenaPath").Trim() -ne $arenaBlob) { throw 'B01-25 P14 ARENA ORIGINAL BLOB WRONG' }
          $arenaZip = Join-Path $env:RUNNER_TEMP 'b0121-arena-old.zip'
          git archive --format=zip --output="$arenaZip" $arenaCommit -- $arenaPath
          if ($LASTEXITCODE -ne 0) { throw 'Arena original Git archive failed' }
          Expand-Archive -LiteralPath "$arenaZip" -DestinationPath . -Force
          if ((git hash-object "$arenaPath").Trim() -ne $arenaBlob) { throw 'Extracted original arena asset changed' }
          $p15Commit = '3fd57dacc34b0fe34b813037de2fa4bdea6252cd'
          $p15Path = 'Research/B01-21/P15/LD02_ARENA_SEALED_CORNERS.json'
          $p15Blob = 'e39e2f174984832bd97311c050e3c22fd6fb1175'
          git fetch --no-tags --depth=5 origin refs/heads/research/b01-21-pass15-ld02-sealed-corners
          if ($LASTEXITCODE -ne 0) { throw 'Corrected LD02 source fixture branch fetch failed' }
          git cat-file -e "${p15Commit}^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Corrected LD02 exact source commit unavailable' }
          if ((git rev-parse "${p15Commit}:$p15Path").Trim() -ne $p15Blob) { throw 'Corrected LD02 expected original Git blob mismatch' }
          $p15Zip = Join-Path $env:RUNNER_TEMP 'b0121-arena-corrected.zip'
          git archive --format=zip --output="$p15Zip" $p15Commit -- $p15Path
          if ($LASTEXITCODE -ne 0) { throw 'Corrected LD02 Git archive failed' }
          Expand-Archive -LiteralPath "$p15Zip" -DestinationPath . -Force
          if ((git hash-object "$p15Path").Trim() -ne $p15Blob) { throw 'Corrected LD02 Git blob mutated during extraction' }
          $coverCommit = 'ee2bc8a70b870864ce4a40c89cc7c6f28496b932'
          $coverPath = 'Research/B01-25/P15/LD02_COVER_CHOICE.json'
          $coverBlob = '21d079d0fe5917554be526aeb0d0d89a35de4c7e'
          git cat-file -e "${coverCommit}^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Original B01-25 P15 cover source commit unavailable' }
          if ((git rev-parse "${coverCommit}:$coverPath").Trim() -ne $coverBlob) { throw 'Original B01-25 P15 cover Git blob changed' }
          $coverArchive = Join-Path $env:RUNNER_TEMP 'b0121-p15-original-cover.zip'
          git archive --format=zip --output="$coverArchive" $coverCommit -- $coverPath
          if ($LASTEXITCODE -ne 0) { throw 'Original B01-25 P15 cover archive failed' }
          Expand-Archive -LiteralPath "$coverArchive" -DestinationPath . -Force
          if ((git hash-object "$coverPath").Trim() -ne $coverBlob) { throw 'Original B01-25 P15 cover extracted bytes mutated' }
          Write-Output 'P15 COVER CHOICE EXACT ORIGINAL GIT JSON BLOB VERIFIED'
          Write-Output 'P15 BOTH ORIGINAL MAPDOCUMENTS AND MAPWORLD SOURCE SHAPE GIT BLOBS VERIFIED'
          Write-Output 'EXACT ORIGINAL CODEX CSHARP AND SIX ACTUAL B01-25 JSON GIT BLOBS VERIFIED'
      - name: Execute actual original MapDraft CSharp (Unity types stubbed, no Unity G1)
        shell: pwsh
        run: |
          dotnet run --project Research/B01-21/P13/MapDraftOriginal.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL MAPDRAFT CSHARP REGRESSIONS FAILED' }
