name: B01-12 STRUCTURE-IMPACT-001 original-source QA
on:
  pull_request:
    paths:
      - 'Research/B01-12/P17W22/StructureImpact001/**'
      - '.github/workflows/b01-12-structure-impact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Chromium Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Execute exact-manifest original Node tests and Chromium
        working-directory: Research/B01-12/P17W22/StructureImpact001
        run: |
          node test_engine.cjs
          python test_browser.py
      - name: Verify unchanged runners reject one-byte changed source
        working-directory: Research/B01-12/P17W22/StructureImpact001
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cp impact_engine.js fixture.js ui.js demo.html test_engine.cjs test_browser.py manifest.json "$scratch/"
          printf ' ' >> "$scratch/ui.js"
          set +e
          (cd "$scratch" && node test_engine.cjs) > "$scratch/node-negative.log" 2>&1
          node_exit=$?
          (cd "$scratch" && python test_browser.py) > "$scratch/python-negative.log" 2>&1
          python_exit=$?
          set -e
          cat "$scratch/node-negative.log" "$scratch/python-negative.log"
          test "$node_exit" -eq 2
          test "$python_exit" -eq 2
          grep -q 'FAIL_CLOSED source mismatch: ui.js' "$scratch/node-negative.log"
          grep -q 'FAIL_CLOSED source mismatch: ui.js' "$scratch/python-negative.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b01-12-structure-impact-source-evidence
          path: |
            Research/B01-12/P17W22/StructureImpact001/node-results.json
            Research/B01-12/P17W22/StructureImpact001/browser-results.json
