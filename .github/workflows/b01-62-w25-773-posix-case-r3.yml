name: B01-62 W25 canonical 773 descendant R3 Linux casepath fix
on:
  push:
    branches: [fix/b01-62-p17w25-773-posix-canonical-path-r3b]
  pull_request:
    paths:
      - 'Tools/B01/B01-62/P17W25PosixCanonicalR3/**'
      - '.github/workflows/b01-62-w25-773-posix-case-r3.yml'
permissions:
  contents: read
jobs:
  os-path-regression:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate immutable selected parent source
        run: |
          set -euo pipefail
          test "$(git rev-parse 3aaaec4027ee246fbfb6f209179f0e9507363473:Tools/B01/B01-62/P17W24CanonicalPathFixR2/CanonicalSingleAuthorityStoreV3R2.cs)" = "3689238a16d706eda1bf4905cba8029cd2fe77aa"
          git diff --quiet 3aaaec4027ee246fbfb6f209179f0e9507363473 -- Assets Tools/B01/B01-62/P17W23OneAuthorityV3 Tools/B01/B01-62/P17W24CanonicalPathFixR2
      - name: Original V3 owner + corrected R3 store true POSIX and Windows path behavior
        run: |
          set -euo pipefail
          mkdir -p b0162-w25-r3-evidence
          dotnet run --project Tools/B01/B01-62/P17W25PosixCanonicalR3/Selected773PosixR3.csproj -c Release --verbosity quiet | tee b0162-w25-r3-evidence/source-os.log
          grep -q 'W25_FIXED_R3_CASE_PATH_GREEN 1 PASS 0 FAIL' b0162-w25-r3-evidence/source-os.log
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            grep -q 'W25_FIXED_R3_LINUX_CASE_ALIAS_DENIED_NO_FOREIGN_FILE=PASS' b0162-w25-r3-evidence/source-os.log
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: b0162-w25-r3-${{ matrix.os }}
          path: b0162-w25-r3-evidence/*
          if-no-files-found: error
