name: B01-61 PASS17 original camera CSharp contract

on:
  push:
    branches: ['qa/b01-61-pass17-camera-state-contract']
  pull_request:
    paths:
      - 'Tools/B01/B01-61-PASS17-CAMERA/**'
      - '.github/workflows/b01-61-pass17-original-camera.yml'

permissions:
  contents: read
jobs:
  original-camera:
    runs-on: ${{ matrix.os }}
    name: Original camera CSharp / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fetch exact Codex game camera source commit
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin be2c4b6ac63e04eff5b046e50641ec8d1da4837f
          test "$(git rev-parse be2c4b6ac63e04eff5b046e50641ec8d1da4837f:Assets/Pack/P12_PipelineSafeCamera.cs)" = "8519938f5734487d0350634cb6d81679a6434d62"
      - name: Refuse stale package manifest source hash
        shell: bash
        run: |
          python -c "import json,subprocess; m=json.load(open('Tools/B01/B01-61-PASS17-CAMERA/manifest.json',encoding='utf8')); actual=subprocess.check_output(['git','hash-object',m['new_source']],text=True).strip(); assert actual==m['new_source_blob'], f'manifest original tool SHA drift: {actual}'"
      - name: Execute unmodified camera controller source in both input branches plus negatives
        shell: bash
        run: |
          set -o pipefail
          python Tools/B01/B01-61-PASS17-CAMERA/run_original_camera_contract.py --repo . 2>&1 | tee b0161-original-camera.log
      - name: Preserve original executed source/CSharp test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0161-camera-${{ matrix.os }}
          path: b0161-original-camera.log
          if-no-files-found: warn
