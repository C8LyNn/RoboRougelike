name: B01-60 P17 W14 NUnit native result identity gate (source QA only; G1 NOT_RUN)
on:
  push:
    branches: [qa/b01-60-p17w14-native-xml-identity-gate-r3]
    paths:
      - 'Tools/B01/B01-60/P17W12NativeSecureV2QA/runner.py'
      - 'Tools/B01/B01-60/P17W14NativeResultProof/**'
      - '.github/workflows/b01-60-p17w14-native-xml-case-gate.yml'
  pull_request:
    paths:
      - 'Tools/B01/B01-60/P17W12NativeSecureV2QA/runner.py'
      - 'Tools/B01/B01-60/P17W14NativeResultProof/**'
      - '.github/workflows/b01-60-p17w14-native-xml-case-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-original-xml-parser-red-to-new-strict-green:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin original frozen #510 and two immutable B01-60 native QA ancestors
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin d94400d95d13db7f27e1533df05c9292d5380431
          git fetch --no-tags origin ed0234d8a3b1b3bc85f3d0a07bbe44b065c96508
          git fetch --no-tags origin 5778023163d8b51d23abfebaa17119e21bd5e131
          git fetch --no-tags origin 33a32b8bd9ab40467ab1a17b5684926a37dbd4d3
          git fetch --no-tags origin cb2b3a76e84266e2730fffc4ab048c1039f0652f
      - name: Execute actual old native-result XML parser false-PASS vs corrected 16-case parser and 26 negatives
        shell: bash
        run: |
          set -euo pipefail
          python Tools/B01/B01-60/P17W14NativeResultProof/test_native_result_gate.py 2>&1 | tee b01-60-w14-native-result-gate.log
          cp b01-60-w14-native-result-gate.log qa-w14-native-case-proof/stdout.log
      - name: Regression of W13 actual rollback RED-to-failclosed GREEN on same W14 source
        shell: bash
        run: |
          set -euo pipefail
          python Tools/B01/B01-60/P17W13NativeRollbackQA/audit.py 2>&1 | tee b01-60-w14-rollback-regression.log
          cp b01-60-w14-rollback-regression.log qa-w14-native-case-proof/rollback-regression.log
      - name: Reuse ORIGINAL #532 Unity runner with absent Editor (actual NOT_RUN exit 3; never fake G1)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python Tools/B01/B01-60/P17W12NativeSecureV2QA/runner.py --mode native --unity /B01/NO_LICENSED_UNITY_6000.3.14f1 --out qa-w14-unlicensed-source 2>&1 | tee b01-60-w14-native-NOT_RUN.log
          native_exit="${PIPESTATUS[0]}"
          set -e
          if [ "$native_exit" -ne 3 ]; then echo "B01_60_W14_NOT_RUN_EXIT_MISMATCH=$native_exit"; exit 1; fi
          grep -F 'B01_60_W12_NATIVE_NOT_RUN: authorized Unity executable missing' b01-60-w14-native-NOT_RUN.log
          test ! -e qa-w14-unlicensed-source/EditMode.xml
          test ! -e qa-w14-unlicensed-source/PlayMode.xml
          test ! -e qa-w14-unlicensed-source/EditMode-Editor.log
          test ! -e qa-w14-unlicensed-source/PlayMode-Editor.log
          echo 'B01_60_W14_NATIVE_G1_NOT_RUN_NO_XML_NO_EDITORLOG_CONFIRMED'
          cp b01-60-w14-native-NOT_RUN.log qa-w14-native-case-proof/native-NOT_RUN.log
      - name: Preserve exact-head executed source QA receipts (NOT native Unity evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-60-w14-NUnit-identity-sourceQA-NOT_NATIVE-${{ matrix.os }}
          path: |
            qa-w14-native-case-proof/
            b01-60-w14-native-result-gate.log
            b01-60-w14-rollback-regression.log
            b01-60-w14-native-NOT_RUN.log
          retention-days: 21
          if-no-files-found: warn
