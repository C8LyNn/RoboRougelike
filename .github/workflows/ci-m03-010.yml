name: M03-010 Stepped Segment Armor QA

on:
  push:
    branches: [feature/rrl-model-m03-010-stepped-segment-armor]
    paths:
      - 'Tools/ModelFactory/M03/M03-010/**'
      - '.github/workflows/ci-m03-010.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'Tools/ModelFactory/M03/M03-010/**'
      - '.github/workflows/ci-m03-010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Independent OBJ geometry, 5 tiers, manifold and mounts QA
        run: python3 Tools/ModelFactory/M03/M03-010/qa_m03_010.py
      - name: Generate actual OBJ MTL and inspect manifest
        run: |
          python3 Tools/ModelFactory/M03/M03-010/generate_m03_010.py --static-obj --out /tmp/m03-010-static
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/m03-010-static")
          manifest=json.loads((root/"M03-010_stepped_segment_armor_manifest.json").read_text())
          assert manifest["result"]=="PASS"
          assert manifest["parts"]==32 and manifest["materials"]==6
          assert manifest["segments"]==5
          assert manifest["bored_mounts"]==4 and manifest["snap_points"]==4
          assert manifest["no_volume_overlap_pair_checks"]==496
          assert manifest["animation"]=="NOT REQUIRED"
          assert manifest["blender"]=="NOT RUN" and manifest["unity"]=="NOT RUN"
          assert (root/"M03-010_stepped_segment_armor.obj").stat().st_size>1000
          print("PASS: actual static OBJ, MTL and geometry report")
          PY
      - name: Upload static OBJ MTL and report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: M03-010-static-OBJ-MTL
          path: /tmp/m03-010-static/
          if-no-files-found: error
          retention-days: 14

  blender-export:
    needs: static-geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Run actual Blender bpy generator and export GLB FBX BLEND
        run: |
          blender -b --factory-startup --python-exit-code 1 \
            --python Tools/ModelFactory/M03/M03-010/generate_m03_010.py \
            -- --out /tmp/m03-010-blender
          test -s /tmp/m03-010-blender/M03-010_stepped_segment_armor.glb
          test -s /tmp/m03-010-blender/M03-010_stepped_segment_armor.fbx
          test -s /tmp/m03-010-blender/M03-010_stepped_segment_armor.blend
      - name: Check same-process rerun and no duplicated meshes
        run: |
          blender -b --factory-startup --python-exit-code 1 --python-expr \
            "import bpy,sys;from pathlib import Path;sys.path.insert(0,'Tools/ModelFactory/M03/M03-010');import generate_m03_010 as m;p=m.build_parts();out=Path('/tmp/m03-010-repeat');m.blender_export(p,out);m.blender_export(p,out);c=bpy.data.collections[m.COLLECTION];assert len([o for o in c.objects if o.type=='MESH'])==32;assert len([o for o in c.objects if o.type=='EMPTY'])==5;assert len([x for x in bpy.data.meshes if x.name.startswith(m.PREFIX)])==32;print('PASS: repeat bpy generation without duplicates')"
      - name: Inspect actual GLB mesh materials SNAP locators and manifest
        run: |
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          root=Path("/tmp/m03-010-blender")
          blob=(root/"M03-010_stepped_segment_armor.glb").read_bytes()
          magic,version,length=struct.unpack_from("<4sII",blob)
          assert (magic,version,length)==(b"glTF",2,len(blob))
          size,kind=struct.unpack_from("<I4s",blob,12)
          assert kind==b"JSON"
          gltf=json.loads(blob[20:20+size])
          expected={"RRL_M03_010_"+x for x in
                    ("GraphiteBacker","TitaniumStep","CeramicTile",
                     "CopperLip","AmberWarning","TitaniumMount")}
          assert {m["name"] for m in gltf["materials"]}==expected
          assert len([n for n in gltf["nodes"] if "mesh" in n])==32
          assert any(n.get("name")=="RRL_M03_010_ROOT_PIVOT" for n in gltf["nodes"])
          assert len([n for n in gltf["nodes"] if n.get("name","").startswith("RRL_M03_010_SNAP_")])==4
          assert not gltf.get("animations")
          manifest=json.loads((root/"M03-010_stepped_segment_armor_manifest.json").read_text())
          assert manifest["backend"]=="blender-bpy" and manifest["blender"]=="EXPORTED"
          assert manifest["unity"]=="NOT RUN"
          print("PASS: actual GLB, 32 meshes, 6 PBR materials, four SNAP, no animation")
          PY
      - name: Upload Blender GLB FBX and BLEND
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: M03-010-Blender-GLB-FBX-BLEND
          path: /tmp/m03-010-blender/
          if-no-files-found: error
          retention-days: 14
