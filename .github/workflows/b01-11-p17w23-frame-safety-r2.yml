name: B01-11 W23 Frame Safety R2 real browser regression
on:
  push:
    branches: ['research/b01-11-p17w23-frame-safety-002']
  pull_request:
    paths:
      - 'Research/B01-11/P17/W22-FRAME-SAFETY-001/index.html'
      - 'Research/B01-11/P17/W22-FRAME-SAFETY-001/manifest.json'
      - 'Research/B01-11/P17/W23-FRAME-SAFETY-R2/**'
      - '.github/workflows/b01-11-p17w23-frame-safety-r2.yml'
jobs:
  original-source:
    name: Original Node source / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 16
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check Research/B01-11/P17/W22-FRAME-SAFETY-001/frame.js
      - run: node --test Research/B01-11/P17/W22-FRAME-SAFETY-001/test_frame.cjs Research/B01-11/P17/W23-FRAME-SAFETY-R2/test_source.cjs
  original-browser:
    name: Real headless Chromium original R1 RED to R2 GREEN
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 16
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --test Research/B01-11/P17/W23-FRAME-SAFETY-R2/test_browser.cjs
