name: B01-24 W03 isolated Unity Editor scene builder (native Unity NOT_RUN)
on:
  push:
    branches: [research/b01-24-p17-w03-enemy-staging-scenes]
    paths:
      - 'Research/B01-24/P17/W03-ENEMY-STAGING-001/**'
      - '.github/workflows/b01-24-p17-w03-stage-builder.yml'
  pull_request:
    paths:
      - 'Research/B01-24/P17/W03-ENEMY-STAGING-001/**'
      - '.github/workflows/b01-24-p17-w03-stage-builder.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-run-editor-code-against-explicit-stubs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile actual Unity Editor scene-builder CSharp against isolated test-only API doubles
        shell: bash
        run: dotnet build Research/B01-24/P17/W03-ENEMY-STAGING-001/StageBuilderCI.csproj -c Release --warnaserror
      - name: Run actual original scene builder across all 12 frozen formations, verify never overwrite
        shell: bash
        run: |
          dotnet run --no-build -c Release --project Research/B01-24/P17/W03-ENEMY-STAGING-001/StageBuilderCI.csproj | tee staging-source-receipt.txt
      - name: Archive source execution receipt only (mock scenes are NOT valid Unity .unity assets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0124-staging-code-${{ matrix.os }}
          path: staging-source-receipt.txt
          if-no-files-found: warn
          retention-days: 21
