name: B01-61 W21 independent exact original adapter 697 orphan stage Dispose lease P0
on:
  push:
    branches: [qa/b01-61-p17w21-adapter697-orphan-lease-dispose]
  pull_request:
    paths:
      - 'Tools/B01/B01-61/P17W21Adapter697OrphanLeaseQA/**'
      - '.github/workflows/b01-61-w21-adapter697-partial-owner-lease.yml'
permissions:
  contents: read
jobs:
  original-697-691-669-crossprocess:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pin exact unchanged B01-23 V2 #691, B01-62 #669, original frozen #556 W06 #510
        shell: bash
        run: |
          set -euo pipefail
          dir="Tools/B01/B01-61/P17W21Adapter697OrphanLeaseQA/.source"
          mkdir -p "$dir"
          git fetch --no-tags origin 809f82575c638e1b4d2806b5f417bddab6c0871a d6ec0c82e388e65c1e02ddfd920bb50a1f6ef121 33094f154c7b91119b36d58aab285e6e83c5de57 d94400d95d13db7f27e1533df05c9292d5380431
          git show 809f82575c638e1b4d2806b5f417bddab6c0871a:Assets/B0123CanonicalSaveApi001/Core/CanonicalWorldGateway.cs > "$dir/CanonicalWorldGatewayV2.cs"
          git show d6ec0c82e388e65c1e02ddfd920bb50a1f6ef121:Tools/B01/B01-62/P17W20SingleFileSaveSlot/SingleFileSaveSlot.cs > "$dir/SingleFileSaveSlot.cs"
          git show 33094f154c7b91119b36d58aab285e6e83c5de57:Assets/B0123DetachedSaveContract001/Runtime/DetachedSnapshotContract.cs > "$dir/DetachedSnapshotContract.cs"
          git show d94400d95d13db7f27e1533df05c9292d5380431:Assets/B0123DebrisRepulse001/Runtime/DebrisImpulseCore.cs > "$dir/DebrisImpulseCore.cs"
          git show d94400d95d13db7f27e1533df05c9292d5380431:Assets/B0123SecureReattachV2/Runtime/SecureRigSpec.cs > "$dir/SecureRigSpec.cs"
          test "$(git hash-object "$dir/CanonicalWorldGatewayV2.cs")" = 704e774dedd5be5af26e0791fba87ecdb109ae2a
          test "$(git hash-object "$dir/SingleFileSaveSlot.cs")" = db7745635164d9eb6b10f3246538700158130b7b
          test "$(git hash-object "$dir/DetachedSnapshotContract.cs")" = b52e511c370f5fca56c74029050844dc8cbb7f9a
          test "$(git hash-object "$dir/DebrisImpulseCore.cs")" = fa1aa5e531927cbe73cf5fdfe161b4a981316db5
          test "$(git hash-object "$dir/SecureRigSpec.cs")" = b680ed0ec969ac23203fa55eab7b90f8daa86e43
          test "$(git rev-parse HEAD:Tools/B01/B01-62/P17W21Canonical681SlotAdapter001/CanonicalSlotCommitAdapter.cs)" = bcecb87c8b1b198e8c086d30f26846bf202ea1c4
      - name: Compile genuine unchanged #697 session with #691 owner gateway and #669 physical original store
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Tools/B01/B01-61/P17W21Adapter697OrphanLeaseQA/OriginalAdapter697LeaseQA.csproj -c Release --nologo 2>&1 | tee build.log
      - name: Execute actual CSharp9 source and real extra CLR OS process; source RELEASE intentionally RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          dotnet Tools/B01/B01-61/P17W21Adapter697OrphanLeaseQA/bin/Release/net8.0/OriginalAdapter697LeaseQA.dll --release | tee qa_release.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "ACTUAL_697_ORIGINAL_SOURCE_RELEASE_EXIT=${rc}"
          if [[ "${rc}" -ne 3 ]]; then echo 'ORIGINAL_QA_EXPECTED_RED_NOT_REPRODUCED_OR_HARNESS_FAILED'; exit 1; fi
          grep -Fx 'TOTAL 7 PASS 7 FAIL 0' qa_release.log
          grep -Fx 'SOURCE_RELEASE_GATE=HOLD_ORPHAN_LEASE_LOSS_ON_DISPOSE' qa_release.log
      - name: Source SHA, added-only 5 paths, genuine second process markers and per-file SHA256 JSON evidence
        shell: bash
        run: |
          set -euo pipefail
          python Tools/B01/B01-61/P17W21Adapter697OrphanLeaseQA/receipt.py --log qa_release.log --out dist/b01-61-w21-adapter697-original-lease.json
      - name: Preserve raw original execution stdout, strict source build and SHA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0161-w21-original-697-lease-${{ matrix.os }}
          path: |
            build.log
            qa_release.log
            dist/b01-61-w21-adapter697-original-lease.json
          if-no-files-found: warn
