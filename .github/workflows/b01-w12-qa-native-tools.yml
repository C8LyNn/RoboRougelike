name: B01-60 W12 independent QA tooling (NO UNITY)
on:
  pull_request:
    paths:
      - 'Tools/B01/QA-NATIVE-001/**'
      - '.github/workflows/b01-w12-qa-native-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Run B01-60 negative receipt fixtures (NOT Unity)
        working-directory: Tools/B01/QA-NATIVE-001
        run: python -m unittest -v test_qa_native.py
