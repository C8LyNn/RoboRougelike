name: B01-60 W16 two-packet independent QA preflight (NO UNITY)
on:
  pull_request:
    paths:
      - 'Tools/B01/QA-W16-ACCEPTANCE/**'
      - '.github/workflows/b01-w16-qa-two-packages.yml'
  push:
    paths:
      - 'Tools/B01/QA-W16-ACCEPTANCE/**'
      - '.github/workflows/b01-w16-qa-two-packages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight-only:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: 27 adversarial data-schema tests (synthetic only)
        working-directory: Tools/B01/QA-W16-ACCEPTANCE
        run: python -m unittest -v test_qa_w16.py
      - name: Verify QA-only manifest hashes without Unity
        working-directory: Tools/B01/QA-W16-ACCEPTANCE
        run: python verify_manifest.py
