name: B01-62 W32 actual R3 factory versus frozen #556 one-Save compatibility
on:
  push:
    branches: [b01-62/p17w32-r3-fixed-world-compat-gate]
  pull_request:
    paths:
      - 'Tools/B01/B01-62/P17W32R3WorldCompatibility/**'
      - '.github/workflows/b01-62-w32-r3-world-compatibility.yml'
permissions:
  contents: read
jobs:
  original-game-world-abi:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch EXACT selected #896 sole source and original frozen 556
        run: |
          set -euo pipefail
          git fetch --no-tags origin a0282f2de0250d2a8fe421bbe182b4cb6fab2a11
          mkdir -p Tools/B01/B01-62/P17W32R3WorldCompatibility/.source b0162-w32-evidence
          git show a0282f2de0250d2a8fe421bbe182b4cb6fab2a11:Assets/B0123DetachedSaveContract001/Runtime/DetachedSnapshotContract.cs > Tools/B01/B01-62/P17W32R3WorldCompatibility/.source/DetachedSnapshotContract.cs
          git show a0282f2de0250d2a8fe421bbe182b4cb6fab2a11:Assets/B0123DebrisRepulse001/Runtime/DebrisImpulseCore.cs > Tools/B01/B01-62/P17W32R3WorldCompatibility/.source/DebrisImpulseCore.cs
          git show a0282f2de0250d2a8fe421bbe182b4cb6fab2a11:Tools/B01/B01-62/P17W28UnityCompatibleWholeGameV3/WholeGameEconomySlotV3.cs > Tools/B01/B01-62/P17W32R3WorldCompatibility/.source/WholeGameEconomySlotV3.cs
          python Tools/B01/B01-62/P17W32R3WorldCompatibility/source_guard.py b0162-w32-evidence/receipt.json | tee b0162-w32-evidence/scope.log
      - name: Compile ORIGINAL R3 factory + ORIGINAL 556 and execute strict compatibility tests
        run: |
          set -euo pipefail
          dotnet run --project Tools/B01/B01-62/P17W32R3WorldCompatibility/OriginalR3VsFrozen556.csproj -c Release -v quiet | tee b0162-w32-evidence/csharp.log
          grep -q 'B0162_W32_R3_VS_556_REAL_ORIGINAL_CODE_TOTAL 7 PASS 7 FAIL 0' b0162-w32-evidence/csharp.log
          grep -q 'B0162_W32_PRODUCT_COMPATIBILITY=RED_EXPECTED_SOURCE_WITNESS' b0162-w32-evidence/csharp.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b0162-w32-incompatible-world-${{ matrix.os }}
          path: b0162-w32-evidence/*
          if-no-files-found: warn
