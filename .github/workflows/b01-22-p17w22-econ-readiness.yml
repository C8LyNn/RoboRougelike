name: B01-22 P17W22 ECON read-only deploy readiness original source
on:
  pull_request:
    paths:
      - 'Assets/B01Packages/ECONREADINESS004/**'
      - 'Tools/B01/ECONREADINESS004/**'
      - '.github/workflows/b01-22-p17w22-econ-readiness.yml'
  workflow_dispatch:
jobs:
  readiness-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile real original W22 C#9 and frozen W21 V3
        shell: bash
        run: dotnet build Tools/B01/ECONREADINESS004/Readiness.Tests.csproj -c Release
      - name: Run original code against real OS disk and independent cold process
        shell: bash
        run: |
          dotnet run --project Tools/B01/ECONREADINESS004/Readiness.Tests.csproj -c Release --no-build -- --scenario "$RUNNER_TEMP/w22-readiness.json" | tee "$RUNNER_TEMP/w22-readiness.log"
          dotnet run --project Tools/B01/ECONREADINESS004/Readiness.Tests.csproj -c Release --no-build -- --cold "$RUNNER_TEMP/w22-readiness.json" | tee -a "$RUNNER_TEMP/w22-readiness.log"
          grep -q 'ECON_V4_SOURCE_PASS' "$RUNNER_TEMP/w22-readiness.log"
          grep -q 'softlock=UNRESOLVED' "$RUNNER_TEMP/w22-readiness.log"
      - name: Verify physical Git blob identities, 4 new GUIDs and strict additive scope
        shell: bash
        run: python3 Tools/B01/ECONREADINESS004/verify_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: b01-22-w22-readiness-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/w22-readiness.log
            ${{ runner.temp }}/w22-readiness.json
          if-no-files-found: error
