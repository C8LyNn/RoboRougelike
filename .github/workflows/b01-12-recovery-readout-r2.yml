name: B01-12 W25 RECOVERY-READOUT R2 source repair QA
"on":
  pull_request:
    paths:
      - 'Research/B01-12/P17W25/RecoveryReadoutR2/**'
      - '.github/workflows/b01-12-recovery-readout-r2.yml'
  push:
    branches:
      - 'research/b01-12-p17w25-recovery-readout-r2'
permissions:
  contents: read
jobs:
  original-source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Chromium and Playwright
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Show immutable original R1 RED witness
        working-directory: Research/B01-12/P17W25/RecoveryReadoutR2
        run: node r1-red-reproducer.cjs
      - name: Run original R2 Node engine tests
        working-directory: Research/B01-12/P17W25/RecoveryReadoutR2
        run: node test_engine.cjs
      - name: Run real Chromium interaction
        working-directory: Research/B01-12/P17W25/RecoveryReadoutR2
        run: python test_browser.py
      - name: Both runners reject modified source in disposable copy
        shell: bash
        run: |
          set -euo pipefail
          src='Research/B01-12/P17W25/RecoveryReadoutR2'
          mkdir -p "$RUNNER_TEMP/b01-12-readout-r2-mutated"
          cp -a "$src/." "$RUNNER_TEMP/b01-12-readout-r2-mutated/"
          printf 'X' >> "$RUNNER_TEMP/b01-12-readout-r2-mutated/ui.js"
          cd "$RUNNER_TEMP/b01-12-readout-r2-mutated"
          set +e
          node test_engine.cjs > node-mutated.log 2>&1; a=$?
          python test_browser.py > browser-mutated.log 2>&1; b=$?
          set -e
          cat node-mutated.log browser-mutated.log
          test "$a" -eq 2 && test "$b" -eq 2
          grep -q 'FAIL_CLOSED source mismatch: ui.js' node-mutated.log
          grep -q 'FAIL_CLOSED source mismatch: ui.js' browser-mutated.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b01-12-w25-readout-r2-receipts
          path: |
            Research/B01-12/P17W25/RecoveryReadoutR2/node-results.json
            Research/B01-12/P17W25/RecoveryReadoutR2/browser-results.json
            Research/B01-12/P17W25/RecoveryReadoutR2/evidence-1280x720.png
          if-no-files-found: warn
