name: B01-10 CHL003 Design Acceptance Review
on:
  pull_request:
    paths:
      - 'Docs/B01Design/CHL003_W16/**'
      - '.github/workflows/b01-10-chl003-design-review.yml'
jobs:
  review-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute genuine portable independent CHL design QA fixtures (NOT Unity)
        run: node Docs/B01Design/CHL003_W16/validate.mjs
      - name: Run NEW W17 six-trial scorecard source-format positive and negative controls (native NOT_RUN)
        run: node --test Docs/B01Design/CHL003_W16/W17_trial_scorecard.test.mjs
