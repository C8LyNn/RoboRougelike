name: B01-12 LOCALIZE-001 source QA
on:
  pull_request:
    paths:
      - 'Research/B01-12/P17W10/Localize001/**'
      - '.github/workflows/b01-12-localize.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Chromium and Playwright
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Execute exact pinned Node and Chromium QA
        working-directory: Research/B01-12/P17W10/Localize001
        run: |
          node test_engine.cjs
          python test_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b01-12-localize-evidence
          path: |
            Research/B01-12/P17W10/Localize001/node-results.json
            Research/B01-12/P17W10/Localize001/browser-results.json
            Research/B01-12/P17W10/Localize001/evidence-1280x720.png
          if-no-files-found: warn
