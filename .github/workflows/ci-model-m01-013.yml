name: MODEL-01 M01-013 Disruption Net Launcher Blender QA
on:
  push:
    branches:
      - feature/rrl-model-m01-013-disruption-net-launcher
    paths:
      - "Tools/ModelFactory/M01/M01-013/**"
      - ".github/workflows/ci-model-m01-013.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m01-013-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout dedicated model branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Independent static generator and geometry QA
        run: python3 Tools/ModelFactory/M01/M01-013/qa_m01_013.py
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version | head -n 3
          blender --background --python-expr 'import numpy; print("NUMPY_OK", numpy.__version__)' 2>&1 | tee /tmp/m01-013-numpy.log
          grep -q NUMPY_OK /tmp/m01-013-numpy.log
      - name: Generate real OBJ MTL GLB FBX BLEND and test Blender rerun
        run: |
          set -euo pipefail
          blender --background --python Tools/ModelFactory/M01/M01-013/generate_m01_013.py -- --out build/M01-013 --repeat-blender 2>&1 | tee /tmp/m01-013-blender.log
          for ext in obj mtl glb fbx blend; do
            test -s "build/M01-013/M01-013_disruption_net_launcher.$ext"
          done
          test -s build/M01-013/M01-013_disruption_net_launcher_qa.json
          grep -q '"blender_repeatability": "PASS' build/M01-013/M01-013_disruption_net_launcher_qa.json
      - name: Independently validate real GLB animation and binary exports
        run: python3 Tools/ModelFactory/M01/M01-013/qa_m01_013.py --out build/M01-013 --require-blender
      - name: Publish actual Blender outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: M01-013-disruption-net-launcher-3D
          path: |
            build/M01-013/M01-013_disruption_net_launcher.obj
            build/M01-013/M01-013_disruption_net_launcher.mtl
            build/M01-013/M01-013_disruption_net_launcher.glb
            build/M01-013/M01-013_disruption_net_launcher.fbx
            build/M01-013/M01-013_disruption_net_launcher.blend
            build/M01-013/M01-013_disruption_net_launcher_qa.json
          if-no-files-found: error
      - name: Commit validated exports only to this model branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$BRANCH" = "feature/rrl-model-m01-013-disruption-net-launcher"
          mkdir -p Tools/ModelFactory/M01/M01-013/generated
          cp build/M01-013/M01-013_disruption_net_launcher.{obj,mtl,glb,fbx,blend} Tools/ModelFactory/M01/M01-013/generated/
          cp build/M01-013/M01-013_disruption_net_launcher_qa.json Tools/ModelFactory/M01/M01-013/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Tools/ModelFactory/M01/M01-013/generated/
          if git diff --cached --quiet; then
            echo "No generated file changes"
          else
            git commit -m "assets(M01-013): publish Blender-validated OBJ GLB FBX BLEND"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
