name: B01-61 W15 exact 556 cross-process cold Save Load generation QA
on:
  push:
    branches:
      - qa/b01-61-p17w15-crossprocess-rollback-anchor
  pull_request:
    paths:
      - 'Tools/B01/B01-61/P17W15CrossProcessGenerationQA/**'
      - '.github/workflows/b01-61-p17w15-crossprocess-generation-qa.yml'
jobs:
  real-source-process:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run exact original source cross-process physical files and W06
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project Tools/B01/B01-61/P17W15CrossProcessGenerationQA/CrossProcessGenerationQA.csproj -c Release | tee qa_test.log
      - name: Execute exact frozen original atomic host bridge core with adversarial worlds
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 'cf7f2a155570f99c412585d5f09f8f97f9e83754^{commit}' || git fetch --no-tags origin cf7f2a155570f99c412585d5f09f8f97f9e83754
          mkdir -p dist/bridge
          git show cf7f2a155570f99c412585d5f09f8f97f9e83754:Assets/B0123UnitySaveBridge001/Core/AtomicWorldSwap.cs > dist/bridge/AtomicWorldSwap.cs
          git show cf7f2a155570f99c412585d5f09f8f97f9e83754:Assets/B0123UnitySaveBridge001/Unity/IsolatedTwinRigSaveHost.cs > dist/bridge/IsolatedTwinRigSaveHost.cs
          test "$(git hash-object dist/bridge/AtomicWorldSwap.cs)" = "74e853601ecc7a5455d9bb466432ce7c027e0695"
          test "$(git hash-object dist/bridge/IsolatedTwinRigSaveHost.cs)" = "94594b0b83514e9f2e1c5bb21ddef9f093b299fc"
          dotnet build Tools/B01/B01-61/P17W15CrossProcessGenerationQA/WorldSwapSourceQA.csproj -c Release -p:BridgeSourcePath=../../../../dist/bridge/AtomicWorldSwap.cs --nologo
          dotnet Tools/B01/B01-61/P17W15CrossProcessGenerationQA/bin/Release/net8.0/WorldSwapSourceQA.dll | tee qa_bridge.log
      - name: Verify selected immutable blobs and produce exact SHA evidence
        shell: bash
        run: |
          set -euo pipefail
          python Tools/B01/B01-61/P17W15CrossProcessGenerationQA/receipt.py --log qa_test.log --bridge-log qa_bridge.log --bridge-dir dist/bridge --out dist/b01-61-w15-generation-qa.json
      - name: Upload actual separate-process output and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-61-w15-generation-${{ matrix.os }}
          path: |
            qa_test.log
            qa_bridge.log
            dist/b01-61-w15-generation-qa.json
          if-no-files-found: warn
