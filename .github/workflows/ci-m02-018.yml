name: M02-018 Mechanical Disc Brake QA
on:
  push:
    branches:
      - feature/rrl-model-m02-018-mechanical-disc-brake
    paths:
      - 'Tools/ModelFactory/M02/M02-018/**'
      - '.github/workflows/ci-m02-018.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and analytic brake clearance
        run: |
          python3 -m py_compile Tools/ModelFactory/M02/M02-018/generate_m02_018.py
          python3 -m py_compile Tools/ModelFactory/M02/M02-018/qa_m02_018.py
          python3 Tools/ModelFactory/M02/M02-018/qa_m02_018.py
  blender-export:
    needs: source-qa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Run actual Blender geometry and export QA
        run: |
          blender --background --factory-startup --python-exit-code 1 \
            --python Tools/ModelFactory/M02/M02-018/generate_m02_018.py \
            -- --out "$RUNNER_TEMP/M02-018"
      - name: Verify exported GLB, BLEND, optional FBX
        run: |
          python3 Tools/ModelFactory/M02/M02-018/qa_m02_018.py \
            --verify --out "$RUNNER_TEMP/M02-018"
      - name: Upload actual artifacts
        uses: actions/upload-artifact@v4
        with:
          name: M02-018-Mechanical-Disc-Brake-BLEND-GLB-QA
          path: ${{ runner.temp }}/M02-018/*
          if-no-files-found: error
          retention-days: 30
