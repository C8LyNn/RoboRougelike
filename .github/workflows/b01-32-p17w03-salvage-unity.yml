name: B01-32 Wave03 salvage beacon physical Unity Sprite prefab delivery (NOT native Unity)
on:
  push:
    branches: [art/b01-32-p17w03-salvage-unity-prefab]
    paths:
      - Tools/B01-32/P17/SalvageUnityDelivery/**
      - .github/workflows/b01-32-p17w03-salvage-unity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-source-and-physical-unity-asset-archive:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch exact immutable B01-32 art producer source
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/art/b01-32-p17-salvage-beacon-r1:refs/remotes/origin/immutable-salvage
          test "$(git rev-parse refs/remotes/origin/immutable-salvage)" = "9956a9281ccbd93f8c115796f90f86d3bd0a0ca1"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install original physical SVG/PNG renderer and image verifier
        run: python -m pip install --disable-pip-version-check "CairoSVG==2.7.1" "Pillow==11.3.0"
      - name: Compile and execute exact original 8-frame C# clock
        run: dotnet run -c Release --project Tools/B01-32/P17/SalvageUnityDelivery/ClockTest/ClockTest.csproj
      - name: Parse original owner Unity runtime/test C# at C#9 via real Roslyn
        run: dotnet run -c Release --project Tools/B01-32/P17/SalvageUnityDelivery/SyntaxTest/SyntaxTest.csproj
      - name: Render 8 physical PNG Sprites from pinned Git sources and generate real Unity prefab/meta archive
        run: python Tools/B01-32/P17/SalvageUnityDelivery/build_import.py --output build/B0132SalvageUnity
      - name: Verify actual ZIP extraction, all prefab GUID references, 8 PNG alpha and 4 deliberate bad-byte rejections
        run: python Tools/B01-32/P17/SalvageUnityDelivery/verify_import.py --output build/B0132SalvageUnity
      - name: Publish actual importable original Unity asset archive and SHA-256 receipt
        uses: actions/upload-artifact@v4
        with:
          name: B0132-SALVAGE-UNITY-001-${{ matrix.os }}
          path: build/B0132SalvageUnity/
          if-no-files-found: error
          retention-days: 30
