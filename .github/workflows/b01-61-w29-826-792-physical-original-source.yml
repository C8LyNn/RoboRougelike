name: B01-61 W29 exact original 826 new one-Store + 792 physical + 780 V7 + 750 corrected R5 composite source G0
on:
  push:
    branches: [qa/b01-61-p17w29-826-792-original-physical-session]
  pull_request:
    paths:
      - 'Tools/B01/B01-61/P17W29PhysicalOriginal826/**'
      - '.github/workflows/b01-61-w29-826-792-physical-original-source.yml'
permissions:
  contents: read
jobs:
  exact-selected-826-792-v7-physical-source:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fetch exactly selected immutable original physical, V7, original fixture and frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 99fb08619c78b3834bb4c0450499babf991f218a 16cb2a7b5158605b15191b6074f9e392e0d1ebd3 b4df10a7ad7e6c758f8331013f6b216b3a3689a3 60c73a6f9ed2585cbb9bf7aeaad8c62eef0629cb f5db40bf293fe9582ec7c6fcb3515aeff6fcf937 d94400d95d13db7f27e1533df05c9292d5380431 33094f154c7b91119b36d58aab285e6e83c5de57 b8ca29c7707cd6b4338d0b9772d74dee676d49d2 e66968408b583404cd50250f53e655ea75a085fc
      - name: Build exact original five selected source closure and safe physical scratch rollout proof
        shell: bash
        run: |
          set -euo pipefail
          python Tools/B01/B01-61/P17W29PhysicalOriginal826/composite_packet.py --out dist/b0161-w29-826-792
          python -c 'import pathlib,json,hashlib; b=pathlib.Path("dist/b0161-w29-826-792"); r=json.loads((b/"SOURCE_RECEIPT.json").read_text()); blob=(b/"B0161_W29_EXACT_SOURCE_ONLY.zip").read_bytes(); assert hashlib.sha256(blob).hexdigest()==r["sha256"]; assert r["source_transport_test"]=="PASS"; assert r["native_unity_g1"]=="NOT_RUN"; assert r["referenced_only_files"]==2; assert len(r["checks"])>=5; print("B0161_W29_ORIGINAL_826_792_780_750_TRANSPORT_G0_SUBSCOPE=PASS"); print("B0161_W29_INNER_ZIP_SHA256="+r["sha256"])'
      - name: Prepare byte-exact original 792 actual Unity runtime source and original 780 V7 binary
        shell: bash
        run: |
          set -euo pipefail
          dir=Tools/B01/B01-61/P17W29PhysicalOriginal826
          mkdir -p "$dir/.external" Tools/B01/B01-62/P17W28UnityCompatibleWholeGameV3/.source
          git show 16cb2a7b5158605b15191b6074f9e392e0d1ebd3:Assets/B0123CanonicalRigPortW24/Runtime/CanonicalPhysicalRigPortW24.cs > "$dir/.external/CanonicalPhysicalRigPortW24.cs"
          git show 16cb2a7b5158605b15191b6074f9e392e0d1ebd3:Assets/B0123CanonicalRigPortW24/Runtime/CanonicalRigLedgerHydratorW24.cs > "$dir/.external/CanonicalRigLedgerHydratorW24.cs"
          git show 16cb2a7b5158605b15191b6074f9e392e0d1ebd3:Tools/B01/B01-23/P17W25PhysicalRollbackR2/ManagedUnitySourceOnlyShim.cs > "$dir/.external/ManagedUnitySourceOnlyShim.cs"
          git show e66968408b583404cd50250f53e655ea75a085fc:Tools/B01/B01-62/P17W27CompositeOriginalPhysicalABI/prepare_hierarchy_shim.py > "$dir/.external/prepare_hierarchy_shim.py"
          git show b4df10a7ad7e6c758f8331013f6b216b3a3689a3:Assets/B01Packages/ECONAPPROVED007/Runtime/ApprovedEconomyPolicyV7.cs > "$dir/.external/ApprovedEconomyPolicyV7.cs"
          git show b4df10a7ad7e6c758f8331013f6b216b3a3689a3:Assets/B01Packages/ECONAPPROVED007/Runtime/CanonicalEconomySectionV7.cs > "$dir/.external/CanonicalEconomySectionV7.cs"
          cp "$dir/.external/ApprovedEconomyPolicyV7.cs" Tools/B01/B01-62/P17W28UnityCompatibleWholeGameV3/.source/
          cp "$dir/.external/CanonicalEconomySectionV7.cs" Tools/B01/B01-62/P17W28UnityCompatibleWholeGameV3/.source/
          test "$(git hash-object "$dir/.external/CanonicalPhysicalRigPortW24.cs")" = 7623f698b6e644b8d8247a011b453bf40adc2227
          test "$(git hash-object "$dir/.external/CanonicalRigLedgerHydratorW24.cs")" = eb21cb12605e94d17dc7decdf040c9009ca0aafe
          test "$(git hash-object "$dir/.external/ManagedUnitySourceOnlyShim.cs")" = 53d16eb828772532f81a7af1ed2ed3a712b0e9e4
          test "$(git hash-object "$dir/.external/ApprovedEconomyPolicyV7.cs")" = 53ebce6c07388dc9c8a8ed79b6de4d3ccbee4773
          test "$(git hash-object "$dir/.external/CanonicalEconomySectionV7.cs")" = d8b71de91db36295b6220e9c4baad71eb54455f6
          test "$(git hash-object Tools/B01/B01-62/P17W28UnityCompatibleWholeGameV3/WholeGameEconomySlotV3.cs)" = 247ab912b73a0e6f17e86aa1a3c74343cb4d9af6
          test "$(git hash-object Tools/B01/B01-62/P17W28UnityCompatibleWholeGameV3/CanonicalWholeGameSessionV3.cs)" = 927b286e76a358716d69e76da5d8351c2564d613
          python "$dir/.external/prepare_hierarchy_shim.py" "$dir/.external/ManagedUnitySourceOnlyShim.cs" | tee dist/b0161-w29-826-792/managed-source-shim.txt
          echo B0161_W29_ORIGINAL_826_AND_792_AND_780_EXACT_BLOBS=PASS
      - name: Compile new exact original V3 Unity-like netstandard2.1 CSharp9 API before actual physical rig test
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Tools/B01/B01-62/P17W28UnityCompatibleWholeGameV3/WholeGameEconomyUnityV3Abi.csproj -c Release --nologo 2>&1 | tee dist/b0161-w29-826-792/original-826-netstandard21.log
          echo B0161_W29_NEW_826_ORIGINAL_NETSTANDARD21_ABI=PASS
      - name: Execute unchanged original 826 and original 792 real world and Save physical OS source regressions
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project Tools/B01/B01-61/P17W29PhysicalOriginal826/Original826With792PhysicalRigQA.csproj -c Release --nologo 2>&1 | tee dist/b0161-w29-826-792/original826-plus792-physical.txt
          grep -F 'B0162_W29_ORIGINAL_COMPOSITE_PHYSICAL_SOURCE_ABI_TOTAL 2 PASS 2 FAIL 0' dist/b0161-w29-826-792/original826-plus792-physical.txt
          grep -F 'B0162_W29_UNITY_PHYSX_NATIVE_G1=NOT_RUN' dist/b0161-w29-826-792/original826-plus792-physical.txt
      - name: Verify no selected producer or Codex source edit
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 99fb08619c78b3834bb4c0450499babf991f218a HEAD > dist/b0161-w29-826-792/only_qa_files.txt
          python -c 'import pathlib; p=pathlib.Path("dist/b0161-w29-826-792/only_qa_files.txt").read_text().splitlines(); assert len(p)==5 and all(x.startswith("Tools/B01/B01-61/P17W29PhysicalOriginal826/") or x==".github/workflows/b01-61-w29-826-792-physical-original-source.yml" for x in p),p; print("B0161_W29_FIVE_ADDED_QA_ONLY_NO_PRODUCER_SOURCE_EDIT=PASS")'
      - name: Archive true original source and physical filesystem test stdout, exact deterministic SHA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0161-w29-original826-plus792-source-${{ matrix.os }}
          path: |
            dist/b0161-w29-826-792/**
          if-no-files-found: warn
