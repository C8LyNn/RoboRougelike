name: B01-23 W21 R5 component-only host destroy source regression
on:
  push:
    branches: ['b01-23/p17w21-selected647-r5-component-retirement-001']
  pull_request:
    paths:
      - 'Assets/B0123UnitySaveBridge001/**'
      - 'Tools/B01/B01-23/P17W21R5HostRetirement001/**'
      - '.github/workflows/b01-23-p17w21-r5-host-retirement.yml'
jobs:
  original-selected-r5-host:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run REAL R5 original Unity-facing host against declared TEST-ONLY synthetic UnityEngine
        run: dotnet run --project Tools/B01/B01-23/P17W21R5HostRetirement001/R5HostSourceTests.csproj -c Release
