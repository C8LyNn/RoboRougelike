name: B01-23 P17 W06 detached debris source QA
on:
  push:
    branches:
      - b01-23/p17w06-detached-debris-repulse-001
  pull_request:
    paths:
      - Assets/B0123DebrisRepulse001/**
      - Tools/B01/B01-23/P17W06DebrisRepulse001/**
      - .github/workflows/b01-23-p17w06-debris-repulse.yml
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      # Pull request runs must build the immutable PRODUCER HEAD, never GitHub's synthetic merge commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Actual original CSharp9 core executable tests
        run: dotnet run --project Tools/B01/B01-23/P17W06DebrisRepulse001/DebrisRepulseTests.csproj --configuration Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original Git source manifest, deterministic archive and rollback negatives
        run: python -m unittest discover -s Tools/B01/B01-23/P17W06DebrisRepulse001 -p test_package.py -v
      - name: Produce actual Codex review ZIP, with verified per-file SHA256 manifest
        run: python Tools/B01/B01-23/P17W06DebrisRepulse001/package.py build --archive dist/b01-23-debris-repulse-001-original.zip
      - uses: actions/upload-artifact@v4
        with:
          name: b01-23-debris-original-${{ matrix.os }}
          path: dist/b01-23-debris-repulse-001-original.zip
          if-no-files-found: error
