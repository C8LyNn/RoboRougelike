name: B01-60 PASS17 original R5 CSharp plan isolation (NOT UNITY)
on:
  pull_request:
    paths:
      - 'Tools/B01/R5-PLAN-ISOLATION-QA-001/**'
      - '.github/workflows/b01-60-p17-r5-original.yml'
  workflow_dispatch:
jobs:
  run-exact-original-csharp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile exact original Codex R5 CSharp and execute original B01-10 encounter deck
        shell: bash
        run: |
          python Tools/B01/R5-PLAN-ISOLATION-QA-001/run_original.py --output "$RUNNER_TEMP/r5-original-source-receipt.json"
      - name: Preserve native-CSharp source execution output (NOT Unity G1)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0160-pass17-r5-csharp-${{ matrix.os }}
          path: ${{ runner.temp }}/r5-original-source-receipt.json
          if-no-files-found: error
