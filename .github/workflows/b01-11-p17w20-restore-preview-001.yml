name: B01-11 P17 W20 RestorePreview source checks
on:
  push:
    branches: ['research/b01-11-p17w20-restore-preview-001']
  pull_request:
    paths:
      - 'Research/B01-11/P17/W20-RESTORE-PREVIEW-001/**'
      - '.github/workflows/b01-11-p17w20-restore-preview-001.yml'
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check Research/B01-11/P17/W20-RESTORE-PREVIEW-001/restore_preview.js
      - run: node --test Research/B01-11/P17/W20-RESTORE-PREVIEW-001/test_restore_preview.cjs
