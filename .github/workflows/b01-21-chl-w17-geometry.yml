name: B01-21 CHL W17 exact-geometry source QA (not Unity)
on:
  push:
    branches:
      - "qa/b01-21-chl003-world-w17-20261027"
    paths:
      - "Tools/B01/CHL003WorldQA/W17/**"
      - ".github/workflows/b01-21-chl-w17-geometry.yml"
  pull_request:
    paths:
      - "Tools/B01/CHL003WorldQA/W17/**"
      - ".github/workflows/b01-21-chl-w17-geometry.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-geometry:
    name: Original CHL source measured yaw/ramp QA (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact immutable ORIGINAL CHL physical authoring Git blobs
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "PIN=9a947108928d4c2cdfdfbb25cbeb30464439da37"
          git log -3 --oneline
          if ! git merge-base --is-ancestor 9a947108928d4c2cdfdfbb25cbeb30464439da37 HEAD; then
            echo "PRODUCER_ANCESTRY_MISMATCH"; exit 10
          fi
          echo "PRODUCER_ANCESTRY_PIN_PASS"
          while IFS='|' read -r path expected; do
            actual="$(git hash-object "$path")"
            echo "SOURCE_BLOB_PIN_CHECK path=$path actual=$actual expected=$expected"
            if test "$actual" != "$expected"; then
              echo "SOURCE_BLOB_PIN_MISMATCH_$path"; exit 11
            fi
          done <<'BLOB_PINS'
          Assets/RoboRougelikeChallenges/CHL003/Demo/CHL003DemoBootstrap.cs|c74455dda6aa6c5210ebcce73330cf296b3597bd
          Assets/RoboRougelikeChallenges/CHL003/Runtime/CHL003CourseController.cs|77e72b87988bdd7e181f649b33e41866bba7083e
          Assets/RoboRougelikeChallenges/CHL003/Runtime/CHL003VehicleMotor.cs|2ec5334539cfe3b1108ad2c868e04be7a9b18129
          Assets/RoboRougelikeChallenges/CHL003/Tests/PlayMode/CHL003DemoAcceptancePlayModeTests.cs|ac126bbe00479790fcd7bc3480faec5c0c4b7e88
          Assets/RoboRougelikeChallenges/CHL003/Runtime/CHL003GateCrossing.cs|5c736da620487e48131f6d454bcf231ae368b513
          BLOB_PINS
          mkdir -p w17-chl-world-source-evidence
          git rev-parse HEAD > w17-chl-world-source-evidence/QA_HEAD.txt
          printf "%s\n" "9a947108928d4c2cdfdfbb25cbeb30464439da37" > w17-chl-world-source-evidence/PINNED_PRODUCER_HEAD.txt
          echo CHL003_W17_ORIGINAL_BLOBS_PIN_PASS
      - name: Compute exact original primitives and yaw margin source report
        shell: bash
        run: |
          set -euo pipefail
          python Tools/B01/CHL003WorldQA/W17/geometry_qa.py --out w17-chl-world-source-evidence/CHL003_W17_GEOMETRY_SOURCE.json | tee w17-chl-world-source-evidence/geometry.log
          grep -q "CHL003_WORLD_W17_SOURCE_REPORT_PASS rows=72" w17-chl-world-source-evidence/geometry.log
      - name: Execute original-source QA and tamper negative regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s Tools/B01/CHL003WorldQA/W17 -p 'test_*.py' -v 2>&1 | tee w17-chl-world-source-evidence/tests.log
          grep -q 'Ran 24 tests' w17-chl-world-source-evidence/tests.log
          echo CHL003_WORLD_W17_SOURCE_UNIT_TESTS_PASS_24_NATIVE_NOT_RUN
      - name: Verify branch changes are B01-21 QA only; preserve original evidence
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 9a947108928d4c2cdfdfbb25cbeb30464439da37 HEAD > w17-chl-world-source-evidence/changed_paths.txt
          if grep -Ev '^(Tools/B01/CHL003WorldQA/(W17|DependencyQueue)/|\.github/workflows/b01-21-chl-(w17-geometry|dq-exact-gate)\.yml$)' w17-chl-world-source-evidence/changed_paths.txt; then
            echo "B01_21_W17_SCOPE_VIOLATION"; exit 3
          fi
          sha256sum w17-chl-world-source-evidence/CHL003_W17_GEOMETRY_SOURCE.json > w17-chl-world-source-evidence/SHA256SUMS.txt
          echo "B01_21_W17_SCOPE_PASS_CHL_RUNTIME_UNCHANGED_NATIVE_NOT_RUN"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-21-w17-original-chl-source-geometry-${{ matrix.os }}
          path: w17-chl-world-source-evidence/
          retention-days: 30
          if-no-files-found: warn
