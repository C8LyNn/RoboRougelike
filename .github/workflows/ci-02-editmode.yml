name: CI-02 Unity EditMode
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # Native Unity execution only when an isolated candidate is promoted out of Draft.
    # For later updates request a manual workflow_dispatch at the exact branch SHA.
    types: [ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate project before launching Unity
        run: python3 Tools/CI/validate_repository.py
      - name: Require valid Unity activation credentials
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          mkdir -p Artifacts/CI
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ] || { [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; }; then
            echo 'BLOCKED: Unity NOT RUN. Configure UNITY_EMAIL, UNITY_PASSWORD and UNITY_LICENSE (Personal, if supported) or UNITY_SERIAL (Pro). See Docs/CI_SETUP.md.' | tee Artifacts/CI/activation-status.txt
            echo '::error::Unity activation is missing. No tests or build executed.'
            exit 1
          fi
          echo 'Credentials present; activation still must succeed in GameCI.' > Artifacts/CI/activation-status.txt
      - name: Unity 6000.3.14f1 EditMode
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.14f1
          cliVersion: v0.1.72
          testMode: editmode
          coverageEnabled: false
          githubToken: ''
          artifactsPath: Artifacts/CI/EditMode
      - name: Require nonempty, fully passing executed test cases
        run: python3 Tools/CI/check_results.py Artifacts/CI/EditMode/editmode-results.xml
      - name: Preserve XML, Unity logs or activation blocker
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CI-02-EditMode-${{ github.run_id }}-${{ github.run_attempt }}
          path: Artifacts/CI/
          if-no-files-found: warn
          retention-days: 7
