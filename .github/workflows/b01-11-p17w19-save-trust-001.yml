name: B01-11 P17 W19 SaveTrust source tests
on:
  push:
    branches: ['research/b01-11-p17w19-save-trust-001']
  pull_request:
    paths:
      - 'Research/B01-11/P17/W19-SAVE-TRUST-001/**'
      - '.github/workflows/b01-11-p17w19-save-trust-001.yml'
jobs:
  reducer:
    name: save-state-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check Research/B01-11/P17/W19-SAVE-TRUST-001/save_state.js
      - name: Execute actual reducer and negative cases
        run: node --test Research/B01-11/P17/W19-SAVE-TRUST-001/test_save_state.cjs
