name: B01-60 P17 W07 Independent HazardPulse source and boundary QA (Unity NOT_RUN)
on:
  push:
    branches: [qa/b01-60-p17w07-hazardpulse-boundaries]
    paths:
      - 'Tools/B01/B01-60/P17W07/HazardPulseBoundaryQA/**'
      - '.github/workflows/b01-60-p17w07-hazardpulse-qa.yml'
  pull_request:
    paths:
      - 'Tools/B01/B01-60/P17W07/HazardPulseBoundaryQA/**'
      - '.github/workflows/b01-60-p17w07-hazardpulse-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execute-original-hazard-boundary-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Verify immutable producer Git objects and exclusive receiver scope
        shell: bash
        run: python Tools/B01/B01-60/P17W07/HazardPulseBoundaryQA/source_gate.py
      - name: Compile unmodified CSharp9 netstandard2.1 gameplay source
        shell: bash
        run: dotnet build Research/B01-25/P17/HAZARDPULSE001/PulseUnityCompat.csproj -c Release -warnaserror
      - name: Compile original source into independent adversarial test executable
        shell: bash
        run: dotnet build Tools/B01/B01-60/P17W07/HazardPulseBoundaryQA/HazardPulseIndependentQA.csproj -c Release --warnaserror
      - name: Execute genuine original source timing and damage authorization tests
        shell: bash
        run: |
          set -o pipefail
          dotnet run --no-build -c Release --project Tools/B01/B01-60/P17W07/HazardPulseBoundaryQA/HazardPulseIndependentQA.csproj | tee independent-hazardpulse-qa.txt
      - name: Preserve actual QA evidence including RED failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-60-w07-hazardpulse-source-qa-${{ matrix.os }}
          path: independent-hazardpulse-qa.txt
          if-no-files-found: warn
          retention-days: 21
