name: M05-024 Cryogenic Cooler Blender QA
on:
  pull_request:
    paths:
      - 'Tools/ModelFactory/M05/M05-024/**'
      - '.github/workflows/ci-model-m05-024.yml'
  workflow_dispatch:
jobs:
  blender-asset:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Syntax check
        run: python3 -m py_compile Tools/ModelFactory/M05/M05-024/*.py
      - name: Generate and test actual Blender scene
        run: |
          blender -b -t 2 --python Tools/ModelFactory/M05/M05-024/generate_m05_024.py -- --out "$GITHUB_WORKSPACE/m05-024-artifacts" --self-test
      - name: Independent GLB validation
        run: python3 Tools/ModelFactory/M05/M05-024/validate_m05_024.py "$GITHUB_WORKSPACE/m05-024-artifacts"
      - name: Upload Blender outputs and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M05-024-Cryogenic-Cooler-GLB-BLEND-QA
          path: m05-024-artifacts/
          retention-days: 14
