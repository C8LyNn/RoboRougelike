name: B01-22 P17 W21 ECON V3 trusted victory source QA
on:
  pull_request:
    paths:
      - 'Assets/B01Packages/ECONREBUILD003/**'
      - 'Tools/B01/ECONREBUILD003/**'
      - '.github/workflows/b01-22-p17w21-econ-v3.yml'
  workflow_dispatch:
jobs:
  cross-os-original-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build ORIGINAL V3 runtime C#9 without Unity substitutes
        shell: bash
        run: dotnet build Tools/B01/ECONREBUILD003/V3.Tests.csproj -c Release
      - name: True OS file host CAS trust issued win replay/ack/softlock model + cold process
        shell: bash
        run: |
          dotnet run --project Tools/B01/ECONREBUILD003/V3.Tests.csproj -c Release --no-build -- --scenario "$RUNNER_TEMP/econ-v3.json" | tee "$RUNNER_TEMP/econ-v3.log"
          dotnet run --project Tools/B01/ECONREBUILD003/V3.Tests.csproj -c Release --no-build -- --cold "$RUNNER_TEMP/econ-v3.json" | tee -a "$RUNNER_TEMP/econ-v3.log"
          grep -q "ECON_V3_SOURCE_PASS" "$RUNNER_TEMP/econ-v3.log"
          grep -q "pending=2" "$RUNNER_TEMP/econ-v3.log"
      - name: Execute original frozen V2 source negative fake-win witness
        shell: bash
        run: |
          dotnet run --project Tools/B01/ECONREBUILD003/V2OriginalWitness.csproj -c Release | tee "$RUNNER_TEMP/econ-v2-original-witness.log"
          grep -q "ORIGINAL_FROZEN_V2_CONTRACT_RED" "$RUNNER_TEMP/econ-v2-original-witness.log"
      - name: Exact Git package source manifest + frozen V2/V1 unchanged
        shell: bash
        run: |
          python3 Tools/B01/ECONREBUILD003/verify_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: b01-22-econ-v3-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/econ-v2-original-witness.log
            ${{ runner.temp }}/econ-v3.log
            ${{ runner.temp }}/econ-v3.json
            ${{ runner.temp }}/lost-ack.json
            ${{ runner.temp }}/lost-victory.json
            ${{ runner.temp }}/known-reject.json
          if-no-files-found: error
