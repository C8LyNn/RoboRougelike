name: B01-22 P17 W23 original Core encounter preflight
on:
  pull_request:
    paths:
      - 'Assets/B01Packages/ECONCOREGUARD005/**'
      - 'Tools/B01/ECONCOREGUARD005/**'
      - '.github/workflows/b01-22-p17w23-econ-core-guard.yml'
  workflow_dispatch:
jobs:
  core-original-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile ORIGINAL V5 + frozen V4 and V3 C#9 source with warnings fatal
        shell: bash
        run: dotnet build Tools/B01/ECONCOREGUARD005/W23.Tests.csproj -c Release
      - name: Run actual source against disposable on-disk owner and cold independent CLR process
        shell: bash
        run: |
          dotnet run --project Tools/B01/ECONCOREGUARD005/W23.Tests.csproj -c Release --no-build -- --scenario "$RUNNER_TEMP/w23-core.json" | tee "$RUNNER_TEMP/w23-core.log"
          dotnet run --project Tools/B01/ECONCOREGUARD005/W23.Tests.csproj -c Release --no-build -- --cold "$RUNNER_TEMP/w23-core.json" | tee -a "$RUNNER_TEMP/w23-core.log"
          grep -q 'ECON_W23_CSHARP_SOURCE_PASS' "$RUNNER_TEMP/w23-core.log"
          grep -q 'human_participants=0' "$RUNNER_TEMP/w23-core.log"
      - name: Validate exact Git manifest, frozen V3/V4 blobs and four new GUIDs
        shell: bash
        run: python3 Tools/B01/ECONCOREGUARD005/verify_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: b01-22-w23-core-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/w23-core.json
            ${{ runner.temp }}/w23-core.log
          if-no-files-found: error
