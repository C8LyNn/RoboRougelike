name: B01-30 P17W32 R41 v5 visual SOURCE negative witness (not Unity)
on:
  push:
    branches: [qa/b01-30-p17w32-r41v5-visual-hierarchy-r1]
  pull_request:
    paths:
      - 'Assets/B01_30/**'
      - 'Assets/B01_30.meta'
      - 'Tools/B01-30/**'
      - '.github/workflows/b01-30-p17w32-r41v5-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-source-negative:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original source SHA, independent P0 and GUID check
        run: python Tools/B01-30/P17/W32R41V5VisualQA/check_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: B0130-W32-SOURCE-WITNESS-${{ matrix.os }}
          path: build/B0130W32/receipt.json
          if-no-files-found: error
