name: B01 REWARD KEEP3 R1
on:
  push:
    branches: [b01-22/reward-keep3-001-r1]
    paths:
      - 'Assets/B01Packages/REWARDKEEP3001/**'
      - 'Assets/B01Packages/REWARDKEEP3001.meta'
      - 'Assets/B01Packages.meta'
      - 'Tools/B01/REWARDKEEP3001/**'
      - '.github/workflows/b01-reward-keep3.yml'
  pull_request:
    paths:
      - 'Assets/B01Packages/REWARDKEEP3001/**'
      - 'Assets/B01Packages/REWARDKEEP3001.meta'
      - 'Assets/B01Packages.meta'
      - 'Tools/B01/REWARDKEEP3001/**'
      - '.github/workflows/b01-reward-keep3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile exact Unity C# runtime with labelled JsonUtility surrogate
        id: build
        run: dotnet build Tools/B01/REWARDKEEP3001/tests/RewardKeep3.SurrogateTests.csproj -c Release --nologo
      - name: Compile install-only R3 bridge against verified OBJ API signatures
        id: bridge
        run: dotnet build Tools/B01/REWARDKEEP3001/tests/BridgeCompile/BridgeCompile.csproj -c Release --nologo
      - name: Execute bounded reward-selection tests (0..3 non-armor)
        id: tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/reward-keep3
          dotnet run --project Tools/B01/REWARDKEEP3001/tests/RewardKeep3.SurrogateTests.csproj -c Release --no-build -- artifacts/reward-keep3/test-results.json | tee artifacts/reward-keep3/tests.log
      - name: Build deterministic package twice and compare bytes
        if: always()
        id: package
        run: |
          python3 Tools/B01/REWARDKEEP3001/build_package.py artifacts/reward-keep3
          cp artifacts/reward-keep3/REWARDKEEP3001_Unity_Source.zip artifacts/reward-keep3/repro-check.zip
          python3 Tools/B01/REWARDKEEP3001/build_package.py artifacts/reward-keep3
          cmp artifacts/reward-keep3/repro-check.zip artifacts/reward-keep3/REWARDKEEP3001_Unity_Source.zip
          rm artifacts/reward-keep3/repro-check.zip
      - name: Emit pinned machine CI receipt
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          BRIDGE: ${{ steps.bridge.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
        run: |
          python3 - <<'PY'
          import pathlib,json,os,subprocess
          d=pathlib.Path("artifacts/reward-keep3");d.mkdir(exist_ok=True,parents=True)
          f=d/"test-results.json";t=json.loads(f.read_text()) if f.exists() else None
          result={"schema":"b01.reward-keep3.ci.v1",
             "sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
             "dotnet_build":os.environ["BUILD"],"r3_signature_compile":os.environ["BRIDGE"],"surrogate_tests":os.environ["TESTS"],
             "package":os.environ["PACKAGE"],"results":({k:t[k] for k in ["total","passed","failed"]} if t else None),
             "unity_editor":"NOT_RUN","unity_playmode":"NOT_RUN","g0_independent":"PENDING","g2":"HOLD"}
          (d/"ci-receipt.json").write_text(json.dumps(result,indent=2)+"\n")
          summary=f"REWARD keep3 source {result['sha']}: build {result['dotnet_build']} / tests {result['surrogate_tests']} {result['results']} / package {result['package']}; Unity native NOT_RUN, G2 HOLD\n"
          (d/"ci-summary.txt").write_text(summary)
          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a").write(summary)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b01-reward-keep3-001-source-and-test-evidence
          path: artifacts/reward-keep3/
          retention-days: 30
