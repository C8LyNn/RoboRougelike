name: B01-23 W08 safe reattach real source and immutable ZIP tests
on:
  push:
    branches:
      - b01-23/p17w08-reattach-clearance-gate001
  pull_request:
    paths:
      - 'Assets/B0123ReattachClearance001/**'
      - 'Tools/B01/B01-23/P17W08ReattachClearance001/**'
      - '.github/workflows/b01-23-p17w08-reattach-clearance.yml'
jobs:
  original-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Real W08 game CSharp9 gate decision core and positive negative tests
        run: dotnet run --project Tools/B01/B01-23/P17W08ReattachClearance001/DockSourceTests.csproj --configuration Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original Git blobs, scope, Unity meta GUID and archive red-green QA
        run: python -m unittest discover -s Tools/B01/B01-23/P17W08ReattachClearance001 -p test_package.py -v
      - name: Produce deterministic real W08 source ZIP
        run: python Tools/B01/B01-23/P17W08ReattachClearance001/package.py build --archive dist/B0123_W08_ReattachClearance_Delta.zip
      - uses: actions/upload-artifact@v4
        with:
          name: b01-23-w08-dock-clearance-${{ matrix.os }}
          path: dist/B0123_W08_ReattachClearance_Delta.zip
          if-no-files-found: error
