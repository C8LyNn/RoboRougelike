name: B01-12 A11Y-PREFS source QA
on:
  pull_request:
    paths:
      - 'Research/B01-12/P17W09/A11YPrefs001/**'
      - '.github/workflows/b01-12-a11y-prefs.yml'
  workflow_dispatch:
jobs:
  a11y-source:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact browser test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Execute producer original-byte validation and real Chromium
        working-directory: Research/B01-12/P17W09/A11YPrefs001
        run: |
          node test_engine.cjs
          python test_browser.py
      - name: Upload real source QA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-12-a11y-source-receipts
          path: |
            Research/B01-12/P17W09/A11YPrefs001/node-results.json
            Research/B01-12/P17W09/A11YPrefs001/browser-results.json
            Research/B01-12/P17W09/A11YPrefs001/evidence-1280x720.png
          if-no-files-found: warn
