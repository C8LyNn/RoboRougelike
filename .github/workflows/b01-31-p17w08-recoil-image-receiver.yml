name: B01-31 P17 W08 independently receive real B01-32 DualRecoil binary assets
on:
  push:
    branches: [qa/b01-31-p17-w08-dual-recoil-original-binary]
    paths:
      - 'Tools/B01-31/P17/W08DualRecoilBinaryQA/**'
      - '.github/workflows/b01-31-p17w08-recoil-image-receiver.yml'
  pull_request:
    paths:
      - 'Tools/B01-31/P17/W08DualRecoilBinaryQA/**'
      - '.github/workflows/b01-31-p17w08-recoil-image-receiver.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-original-image-and-unity-zip:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact original immutable B01-32 commit (no producer mutation)
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/art/b01-32-p17-w07-dual-recoil-animation
          test "$(git rev-parse FETCH_HEAD)" = "d020db8bf43626dfecf979ffc47b57dd526a7ca0"
      - name: Confirm original successful run exact SHA and artifact identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41038102796 --jq .head_sha)" = "d020db8bf43626dfecf979ffc47b57dd526a7ca0"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41038102796 --jq .conclusion)" = "success"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/12968263808 --jq .name)" = "B0132-W07-DUAL-RECOIL-ORIGINAL-UNITY-ZIP-AND-PNG"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/12968263808 --jq .expired)" = "false"
      - name: Physically download ORIGINAL immutable producer artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41038102796 --name B0132-W07-DUAL-RECOIL-ORIGINAL-UNITY-ZIP-AND-PNG --dir original-recoil
      - name: Independently install PNG pixel decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Actually check original 8 PNGs, original contact image and Unity ZIP with negative controls
        run: python Tools/B01-31/P17/W08DualRecoilBinaryQA/receiver.py --original original-recoil --output qa-evidence
      - name: Archive independently produced real byte QA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-31-p17w08-dualrecoil-binary-qa-${{ matrix.os }}
          path: qa-evidence/receiver.json
          if-no-files-found: warn
          retention-days: 30
