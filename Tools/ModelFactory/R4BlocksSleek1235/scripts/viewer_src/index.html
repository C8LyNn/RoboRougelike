<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>#1235 — katalog 30 klocków R4 A „Sleek”</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#15181c;color:#e8eaed;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
#bar{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 14px;background:rgba(16,18,22,.88);border-bottom:1px solid #2c3138;z-index:2}
#bar b{font-size:15px;margin-right:6px}
.grp{display:flex;gap:4px;align-items:center}
.grp span{color:#9aa3ad;margin-right:4px}
button,select{background:#232830;color:#e8eaed;border:1px solid #39404a;border-radius:6px;padding:6px 11px;font:inherit;cursor:pointer}
button.on{background:#e8eaed;color:#15181c;border-color:#e8eaed;font-weight:600}
button:focus-visible,select:focus-visible{outline:2px solid #7fb4ff;outline-offset:1px}
label{display:flex;gap:6px;align-items:center;cursor:pointer}
#info{position:fixed;left:14px;bottom:12px;background:rgba(16,18,22,.82);border:1px solid #2c3138;border-radius:8px;padding:9px 12px;max-width:min(620px,90vw);z-index:2}
#info small{color:#9aa3ad}
canvas{display:block}
</style></head><body>
<div id="bar"><b>#1235 · 30 klocków R4</b>
 <div class="grp"><span>Scena</span><select id="scene"></select></div>
 <div class="grp" id="kindgrp"><span>Klocek</span><select id="kind"></select></div>
 <div class="grp" id="variants"><span>Klocki</span><button data-v="before">PRZED (#963)</button><button data-v="A">A „Sleek”</button></div>
 <div class="grp"><span>Malowanie</span><select id="livery"></select></div>
 <label><input type="checkbox" id="lod"> LOD1</label>
 <label><input type="checkbox" id="wire"> siatka</label>
</div>
<div id="info"></div>
<script src="lib/three.min.js"></script><script src="lib/GLTFLoader.js"></script><script src="lib/OrbitControls.js"></script><script src="models.js"></script>
<script>
const D = window.R4_DATA, MODELS = window.R4_MODELS, LOOK = D.look;
const LIVNAME = {r41:"domyślne materiały R41", ember:"Ember", cobalt:"Cobalt", jade:"Jade"};
const state = {scene:"R3_Leviathan", kind:"Arch", variant:"A", livery:"cobalt", lod:false, wire:false};
const renderer = new THREE.WebGLRenderer({antialias:true}); document.body.appendChild(renderer.domElement);
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = LOOK.exposure; renderer.physicallyCorrectLights = true;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
const C = a => new THREE.Color(a[0],a[1],a[2]);
function makeEnv(cfg){
  const s = new THREE.Scene(), geo = new THREE.SphereGeometry(50,48,48), top=C(cfg.sky), hor=C(cfg.horizon), bot=C(cfg.ground);
  const pos = geo.attributes.position, col = new Float32Array(pos.count*3), t = new THREE.Color();
  for(let i=0;i<pos.count;i++){ const h=pos.getY(i)/50; if(h>=0) t.copy(hor).lerp(top,Math.pow(h,0.55)); else t.copy(hor).lerp(bot,Math.pow(-h,0.35)); col[i*3]=t.r; col[i*3+1]=t.g; col[i*3+2]=t.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(col,3)); s.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({side:THREE.BackSide, vertexColors:true})));
  cfg.panels.forEach(p=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(p[1][0],p[1][1]), new THREE.MeshBasicMaterial({color:C(p[2]), side:THREE.DoubleSide})); m.position.set(p[0][0],p[0][1],p[0][2]); m.lookAt(0,0,0); s.add(m); });
  const pm = new THREE.PMREMGenerator(renderer), rt = pm.fromScene(s, 0.03); pm.dispose(); return rt.texture;
}
const scene = new THREE.Scene(); scene.environment = makeEnv(LOOK.env); scene.background = C(LOOK.background);
const cam = new THREE.PerspectiveCamera(28, 1, 0.05, 400), ctl = new THREE.OrbitControls(cam, renderer.domElement); ctl.enableDamping = true;
const key = new THREE.DirectionalLight(0xffffff, LOOK.keyIntensity); key.castShadow = true; key.shadow.mapSize.set(4096,4096); key.shadow.bias=-0.0004; key.shadow.normalBias=0.004; key.shadow.radius=3; scene.add(key); scene.add(key.target);
const fill = new THREE.DirectionalLight(0xbfd4ff, LOOK.fillIntensity); scene.add(fill); scene.add(fill.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400,400), new THREE.MeshStandardMaterial({color:C(LOOK.groundColor), roughness:0.92, metalness:0, envMapIntensity:0.5})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
let root = new THREE.Group(); scene.add(root);
const loader = new THREE.GLTFLoader(), cache = {};
function load(key){ if(!cache[key]) cache[key] = new Promise((res,rej)=>{ const bin = atob(MODELS[key]), buf = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i); loader.parse(buf.buffer, "", g=>res(g.scene), rej); }); return cache[key]; }
const T = (x,y,z)=>[1,0,0,x, 0,1,0,y, 0,0,1,z, 0,0,0,1];
function sceneParts(){
  if(D.robots[state.scene]) return D.robots[state.scene];
  if(state.scene==="single"){ const e = D.extent[state.kind], w = (e[1][0]-e[0][0]) + 0.5;
    return {parts:[{k:state.kind, m:T(-w/2-(e[0][0]+e[1][0])/2,0,0), p:"hull", force:"before"},{k:state.kind, m:T(w/2-(e[0][0]+e[1][0])/2,0,0), p:"hull", force:"A"}], ground:e[0][1]-0.002, center:[0,(e[0][1]+e[1][1])/2,(e[0][2]+e[1][2])/2], size:w*2.2+1.2, single:true}; }
  const parts=[]; let x=0, z=0, row=0, rowDepth=0;                                   // catalogue: rows of six
  D.kinds.forEach((k,i)=>{ const e = D.extent[k], w = e[1][0]-e[0][0], dz = e[1][2]-e[0][2];
    if(i%6===0 && i>0){ z -= rowDepth + 0.9; x = 0; rowDepth = 0; }
    parts.push({k:k, m:T(x - e[0][0], -e[0][1]-0.26, z - e[1][2]), p:(i%3===1)?"accent":"hull"}); x += w + 0.7; rowDepth = Math.max(rowDepth, dz); });
  return {parts:parts, ground:-0.262, center:[4.2,0.3,-3.4], size:13};
}
let token = 0;
async function rebuild(resetCam){
  const my = ++token, S = sceneParts(), g = new THREE.Group(); let tris = 0, blocks = 0, btris = 0;
  for(const p of S.parts){
    let keyName, paint = null;
    if(p.k){ const v = p.force || state.variant; keyName = (v==="before" ? "before" : "A" + (state.lod ? "_LOD1" : "")) + "/" + p.k; const Lv = D.livery[state.livery][p.p]; if(Lv) paint = (v==="before") ? {Armor_Gunmetal: Lv.R4P_Base} : Lv; blocks++; }
    else keyName = p.u;
    const o = (await load(keyName)).clone(true); if(my!==token) return;
    o.traverse(n=>{ if(!n.isMesh) return; if(n.material.name==="Muzzle_Flash" || /MuzzleFlash|Flash|_FX/.test(n.name)){ n.visible=false; return; }
      n.castShadow = n.receiveShadow = true; const c = (n.geometry.index ? n.geometry.index.count : n.geometry.attributes.position.count)/3; tris += c; if(p.k) btris += c;
      const ov = paint && paint[n.material.name]; if(ov){ const m = n.material.clone(); m.color = C(ov); m.metalness = ov[3]; m.roughness = ov[4]; n.material = m; }
      if(state.wire){ n.material = new THREE.MeshBasicMaterial({color:0xd8dde3, wireframe:true}); n.castShadow=false; } });
    const w = new THREE.Group(); w.add(o); const m = new THREE.Matrix4(); m.set(...p.m); w.applyMatrix4(m); g.add(w);
  }
  scene.remove(root); root = g; scene.add(root); ground.position.y = S.ground;
  const c = S.center; key.position.set(c[0]+4.5,c[1]+7,c[2]+3.5); key.target.position.set(c[0],c[1],c[2]); fill.position.set(c[0]-5,c[1]+3,c[2]-2); fill.target.position.set(c[0],c[1],c[2]);
  const ex = S.size*0.75; Object.assign(key.shadow.camera, {left:-ex,right:ex,top:ex,bottom:-ex,near:0.1,far:60}); key.shadow.camera.updateProjectionMatrix();
  if(resetCam){ const d = new THREE.Vector3(0.55,0.40,0.74).normalize().multiplyScalar(S.size*1.5); ctl.target.set(c[0],c[1],c[2]); cam.position.set(c[0]+d.x,c[1]+d.y,c[2]+d.z); }
  const vn = S.single ? "lewy: zatwierdzony #963 · prawy: A „Sleek”" : {before:"zatwierdzone #963", A:"A „Sleek”"}[state.variant];
  const b = D.budget[state.kind];
  document.getElementById("info").innerHTML = "<b>"+vn+(state.lod&&(S.single||state.variant!=="before")?" · LOD1":"")+"</b> — "+(S.single ? state.kind+": "+b[0].toLocaleString("pl")+" tri (#963) → "+b[1].toLocaleString("pl")+" tri (A), LOD1 "+b[2] : blocks+" klocków = "+Math.round(btris).toLocaleString("pl")+" tri; cała scena "+Math.round(tris).toLocaleString("pl")+" tri")
    + "<br><small>Prawdziwe GLB osadzone w models.js. Interfejs (porty, gniazda, siatka 0,55 m, ściana ±0,26 m, komórki klocków wielokomórkowych) identyczny w obu wariantach. Malowania to propozycje do podglądu. Nic nie jest zainstalowane w grze.</small>";
}
const sel = document.getElementById("scene"); [["R3_Leviathan","Robot R3 „Leviathan” (210 klocków, 30 rodzajów)"],["R1_GlacisRover","Robot R1 „Glacis Rover” (pełny katalog)"],["R2_OutriggerSkiff","Robot R2 „Outrigger Skiff” (ROD/STRUT)"],["catalog","Katalog 30 klocków"],["single","Pojedynczy klocek: #963 obok A"]].forEach(([v,t])=>sel.add(new Option(t,v)));
const ksel = document.getElementById("kind"); D.kinds.forEach(k=>ksel.add(new Option(k,k)));
const liv = document.getElementById("livery"); Object.keys(LIVNAME).forEach(k=>liv.add(new Option(LIVNAME[k],k)));
function sync(){ document.querySelectorAll("#variants button").forEach(b=>b.classList.toggle("on", b.dataset.v===state.variant)); sel.value=state.scene; liv.value=state.livery; ksel.value=state.kind;
  document.getElementById("kindgrp").style.display = state.scene==="single" ? "flex" : "none"; document.getElementById("variants").style.display = state.scene==="single" ? "none" : "flex"; }
sel.onchange = ()=>{ state.scene = sel.value; sync(); rebuild(true); }; liv.onchange = ()=>{ state.livery = liv.value; rebuild(false); }; ksel.onchange = ()=>{ state.kind = ksel.value; rebuild(true); };
document.querySelectorAll("#variants button").forEach(b=>b.onclick = ()=>{ state.variant = b.dataset.v; sync(); rebuild(false); });
document.getElementById("lod").onchange = e=>{ state.lod = e.target.checked; rebuild(false); }; document.getElementById("wire").onchange = e=>{ state.wire = e.target.checked; rebuild(false); };
function resize(){ renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); } addEventListener("resize", resize); resize();
sync(); rebuild(true).then(()=>{ window.viewerReady = true; });
(function loop(){ requestAnimationFrame(loop); ctl.update(); renderer.render(scene, cam); })();
</script></body></html>
