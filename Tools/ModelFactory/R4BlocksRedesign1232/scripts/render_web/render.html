<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#222}canvas{display:block}</style></head><body>
<script src="lib/three.min.js"></script><script src="lib/GLTFLoader.js"></script>
<script>
const cache = {}; const loader = new THREE.GLTFLoader();
function loadGLB(url){ if(!cache[url]) cache[url] = new Promise((res,rej)=>loader.load(url, g=>res(g.scene), undefined, rej)); return cache[url]; }
function lin(c){ return new THREE.Color(c[0],c[1],c[2]); }
function makeEnv(renderer, cfg){
  const s = new THREE.Scene();
  const geo = new THREE.SphereGeometry(50, 48, 48);
  const top=lin(cfg.sky||[0.55,0.62,0.72]), hor=lin(cfg.horizon||[0.85,0.85,0.83]), bot=lin(cfg.ground||[0.18,0.18,0.19]);
  const pos = geo.attributes.position, col = new Float32Array(pos.count*3), tmp = new THREE.Color();
  for(let i=0;i<pos.count;i++){ const h = pos.getY(i)/50; if(h>=0) tmp.copy(hor).lerp(top, Math.pow(h,0.55)); else tmp.copy(hor).lerp(bot, Math.pow(-h,0.35)); col[i*3]=tmp.r; col[i*3+1]=tmp.g; col[i*3+2]=tmp.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  const mat = new THREE.MeshBasicMaterial({side:THREE.BackSide, vertexColors:true});
  s.add(new THREE.Mesh(geo, mat));
  (cfg.panels||[[ [8,14,6],[14,8],[7,7,6.6] ], [ [-12,6,-4],[10,10],[2.2,2.4,2.8] ], [ [2,5,-14],[16,6],[2.5,2.3,2.0] ]]).forEach(p=>{
    const m = new THREE.Mesh(new THREE.PlaneGeometry(p[1][0],p[1][1]), new THREE.MeshBasicMaterial({color:new THREE.Color(p[2][0],p[2][1],p[2][2]), side:THREE.DoubleSide}));
    m.position.set(p[0][0],p[0][1],p[0][2]); m.lookAt(0,0,0); s.add(m); });
  const pm = new THREE.PMREMGenerator(renderer); const rt = pm.fromScene(s, 0.03); pm.dispose(); return rt.texture;
}
let renderer=null, envTex=null, envKey="";
window.renderScene = async function(sc){
  const W=sc.width||1280, H=sc.height||720;
  if(!renderer){ renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true}); document.body.appendChild(renderer.domElement);
    renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.physicallyCorrectLights = !window.NOPHYS;
    renderer.shadowMap.enabled = !window.NOSHADOW; renderer.shadowMap.type = THREE.PCFSoftShadowMap; }
  renderer.setPixelRatio(sc.pixelRatio||1); renderer.setSize(W,H); renderer.toneMappingExposure = sc.exposure||1.0;
  const ek = JSON.stringify(sc.env||{}); if(ek!==envKey){ envTex = makeEnv(renderer, sc.env||{}); envKey=ek; }
  const scene = new THREE.Scene(); if(!sc.noEnv) scene.environment = envTex;
  const bg = sc.background||[0.36,0.39,0.43]; scene.background = new THREE.Color(bg[0],bg[1],bg[2]);
  if(sc.fog){ scene.fog = new THREE.Fog(scene.background.getHex(), sc.fog[0], sc.fog[1]); }
  const root = new THREE.Group(); scene.add(root);
  let tris = 0, calls = 0;
  for(const p of sc.parts){
    const src = await loadGLB(p.url); const o = src.clone(true);
    o.traverse(n=>{ if(n.isMesh){
        const skip = (sc.hideMaterials||["Muzzle_Flash"]).includes(n.material.name) || (sc.hideNodes||[]).some(h=>n.name.includes(h)) || /MuzzleFlash|_FX|Flash/.test(n.name);
        if(skip){ n.visible=false; return; }
        n.castShadow = true; n.receiveShadow = true; calls++;
        tris += (n.geometry.index? n.geometry.index.count : n.geometry.attributes.position.count)/3;
        const ov = p.paint && p.paint[n.material.name];
        if(ov){ const m = n.material.clone(); m.color = new THREE.Color(ov[0],ov[1],ov[2]); if(ov.length>3){ m.metalness=ov[3]; m.roughness=ov[4]; } n.material = m; }
        if(sc.wire){ n.material = new THREE.MeshBasicMaterial({color:0x101418, wireframe:true}); }
        if(sc.envIntensity!==undefined) { if(n.material===src) {} n.material.envMapIntensity = sc.envIntensity; }
    }});
    const g = new THREE.Group(); g.add(o);
    if(p.matrix){ const m = new THREE.Matrix4(); m.set(...p.matrix); g.applyMatrix4(m); }   // row-major 16
    root.add(g);
  }
  const key = new THREE.DirectionalLight(0xffffff, sc.keyIntensity||3.0); const kd = sc.keyDir||[3.5,6,4.5];
  const tgt = sc.target||[0,0,0]; key.position.set(tgt[0]+kd[0],tgt[1]+kd[1],tgt[2]+kd[2]); key.target.position.set(tgt[0],tgt[1],tgt[2]); scene.add(key.target);
  const ex = sc.shadowExtent||4; key.castShadow = true; key.shadow.mapSize.set(4096,4096); key.shadow.camera.left=-ex; key.shadow.camera.right=ex; key.shadow.camera.top=ex; key.shadow.camera.bottom=-ex;
  key.shadow.camera.near=0.1; key.shadow.camera.far=40; key.shadow.bias=-0.0004; key.shadow.normalBias=0.004; key.shadow.radius=sc.shadowRadius||3; scene.add(key);
  const fill = new THREE.DirectionalLight(0xbfd4ff, sc.fillIntensity===undefined?0.6:sc.fillIntensity); fill.position.set(tgt[0]-5,tgt[1]+3,tgt[2]-2); fill.target.position.set(tgt[0],tgt[1],tgt[2]); scene.add(fill.target); scene.add(fill);
  if(sc.groundY!==undefined && sc.groundY!==null){
    const gc = sc.groundColor||[0.30,0.32,0.35];
    const gm = new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshStandardMaterial({color:new THREE.Color(gc[0],gc[1],gc[2]), roughness:0.92, metalness:0.0, envMapIntensity:0.5}));
    gm.rotation.x = -Math.PI/2; gm.position.y = sc.groundY; gm.receiveShadow = true; scene.add(gm);
    if(sc.grid){ const gh = new THREE.GridHelper(sc.grid[0], sc.grid[1], 0x55606c, 0x48525c); gh.position.y = sc.groundY+0.002; gh.material.transparent=true; gh.material.opacity=0.55; scene.add(gh); }
  }
  const c = sc.camera; let cam;
  if(c.ortho){ const a=W/H, s=c.ortho; cam = new THREE.OrthographicCamera(-s*a,s*a,s,-s,0.05,200); }
  else cam = new THREE.PerspectiveCamera(c.fov||30, W/H, 0.05, 300);
  cam.position.set(c.pos[0],c.pos[1],c.pos[2]); cam.lookAt(tgt[0],tgt[1],tgt[2]);
  renderer.render(scene, cam);
  return {tris:Math.round(tris), meshes:calls, programs:renderer.info.programs.length, renderCalls:renderer.info.render.calls};
};
window.ready = true;
</script></body></html>
